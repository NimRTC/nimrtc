name: Feature Request

description: Suggest a new capability or improvement
title: "[Feature] "
labels: [enhancement]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature description
        A clear description of the feature or improvement. Why is it needed?

  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What pain point does this feature address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you explored?
      placeholder: "I also considered..."

  - type: dropdown
    id: phase
    attributes:
      label: Which NimRTC phase?
      options:
        - P0 (scaffold)
        - P1 (RTP + SDP + Chrome interop)
        - P2 (PCM tap + jitter buffer + priority)
        - P3 (ref_frame + ICE + BWE)
        - P4 (embedded / production)
        - cross-phase
        - not sure

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Any other relevant context or mock-ups?
