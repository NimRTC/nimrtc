# =============================================================================
# NimRTC CI auto-retry
#
# The problem this solves
# -----------------------
#
# A GitHub-hosted runner is not guaranteed.  A job that asks for a
# saturated pool -- the `macos-15` arm64 image is the chronic case in
# this repository -- can sit in the queue until the platform gives up:
#
#     The job was not acquired by Runner of type hosted even after
#     multiple attempts
#
# and end up `cancelled` with **no steps** and **no runner**.  The run's
# conclusion is then `failure`, and the merge gate -- which requires
# that check by name -- is red for a reason that has nothing to do with
# the tree.
#
# Measured on 2026-11-16: PRs #65, #66 and #67 all needed a manual
# `gh run rerun` before the macOS leg would go green.  The rerun is the
# correct remedy, but doing it by hand makes CI unattended only for the
# runs that happen to be watched.
#
# What it does NOT do
# --------------------
#
# It does not re-run a failing build.  A job that *ran* and failed is
# the tree's failure, and re-running it would hide exactly the defect
# the CI run was for.  `tools/ci_retry_runner.py` classifies every job
# before it touches one, and the two signatures are disjoint:
#
#     starved   steps == 0  AND  runner_name == ""   -> re-run
#     genuine   the job ran and failed                -> left alone
#
# That distinction has been checked against real runs of this
# repository:
#
#     run 43938323684  macos-clang / arm64   steps=0   runner=""   -> starved
#     run 43877514623  macos-clang / arm64   steps=19  runner set -> genuine
#     run 43864579652  linux-sanitizers / asan-ubsan  steps=11     -> genuine
#
# The loop guard
# --------------
#
# A retry can itself be starved.  The script therefore only re-runs a
# run's **first** attempt (`--max-attempt 1`): if the second attempt is
# starved too, the platform is having a sustained outage and more
# retries only burn runner minutes.  The run attempt counter is
# reliable for this -- a job-level re-run increments it, which was
# verified against the API (run 43938323684 went from attempt 1 to
# attempt 2 after a job-level re-run).
#
# Because the re-run creates a new attempt, that attempt also fires
# `workflow_run`.  The attempt counter is what makes that safe: the
# second attempt is reported, not retried.
#
# Scope
# -----
#
# `ci`, `ci-e2e`, `ci-fast` and `release` -- every workflow whose jobs
# can leave the merge gate or a release cut red.  `soak` is the only
# workflow left out, and not because a release measurement should not
# be retried:
#
#   * Both soak jobs carry `continue-on-error: true` (the verdict
#     lives in the evidence record, not in the job status -- see the
#     comment above `continue-on-error` in `soak.yml`).  A job that
#     ran and failed therefore still reports `success`, so the
#     classifier would classify it as `fine` and never touch it.  The
#     exclusion is about the *starved* case only.
#   * A starved soak job would be safe to re-run, but re-running it
#     does not help: the soak window is a statement about
#     *calendar* days, and `tools/run_soak.py` counts a day green only
#     when it carries a PASS record measured on the candidate tree.
#     A retry that lands on the next UTC day produces a record for a
#     *different* day, which is a second data point rather than a
#     replacement -- and a day whose only record is INCONCLUSIVE
#     breaks the streak just as a missing day does.
#
# In short: the soak is a measurement, and re-measuring a day is not
# the same act as re-running a build.
#
# Why `release` belongs here
# --------------------------
#
# A release cut is the most expensive thing this repository does, and a
# starved runner should not be the reason it has to be redone by hand.
# The `release` workflow is already written to be re-run safely: the
# `publish-release` job recreates the draft and then explicitly
# refreshes its body ("Refresh the draft release body"), precisely so
# that a re-run is idempotent rather than leaving a stale body behind.
#
# Two properties of the retry mechanism were verified experimentally
# before `release` was added to this list, because both of them decide
# whether the retry publishes a *complete* release:
#
#   1. A job-level re-run revives a dependent job that was SKIPPED
#      because its dependency failed.  This is the `release` shape:
#      `publish-release` has `needs:` on all four build jobs, so a
#      starved build job skips the publish job.  Verified: a
#      dependent job went from `skipped` back to `success` after the
#      dependency was re-run at the job level.
#
#   2. An artefact uploaded in attempt 1 is still downloadable in
#      attempt 2.  Artefacts belong to the *run*, not the attempt, so
#      the publish job in attempt 2 finds the three bundles the other
#      build jobs uploaded in attempt 1.  Verified: a payload uploaded
#      in attempt 1 was read back in attempt 2.
#
# A third property was verified for the same reason, because
# `release.yml` is the one workflow whose concurrency group does NOT
# cancel in progress (`cancel-in-progress: false`, so a superseded
# re-run of a tag is idempotent).  A `false` group *queues* a second
# run instead of cancelling the first, so the re-run could in
# principle have waited behind the very run that was trying to
# re-queue it.  It does not: a job-level re-run starts immediately
# even under a `false` group, and its dependent job comes back with
# it.  Verified under the exact release shape.
#
# The one case that could have broken this is a 409 from
# `actions/upload-artifact` (artefacts are immutable in v4+, so the
# same name cannot be uploaded twice in one run).  It cannot happen
# here: a job is only retried when **no step of it ever ran**, so it
# never uploaded anything in the first place.
#
# Permissions
# -----------
#
# `actions: write` is required to call the re-run endpoint.  The
# repository's default workflow permission is `read` (see
# `GET /repos/:owner/:repo/actions/permissions/workflow`), so the grant
# has to be explicit.
# =============================================================================

name: ci-retry

on:
  # Fires when a run of one of the watched workflows *completes*.  The
  # payload carries the completed run's id and conclusion, which is
  # what the script needs.
  #
  # NB: `workflow_run` only fires for workflows that exist on the
  # default branch -- which is why this file has to be merged before it
  # can act on anything.
  workflow_run:
    workflows: [ci, ci-e2e, ci-fast, release]
    types: [completed]

  # Manual escape hatch: re-run the retry logic against any run, on
  # demand, without waiting for a `workflow_run` event.
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The workflow run to inspect (e.g. 43938323684).'
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  # One retry per run at a time.  Two concurrent retries of the same run
  # would race each other for the same runner slot, which is the very
  # thing being worked around.  Different runs do not block each other.
  group: ci-retry-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    name: ci-retry / starved jobs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Only a *failed* run is worth inspecting.  Without this guard the
    # workflow would claim a runner after every green CI run -- the
    # workflow_run event carries no conclusion filter of its own, so
    # the check has to happen here.
    #
    # `cancelled` counts as failure: a run that was cancelled may have
    # been cancelled because one of its jobs was starved of a runner.
    #
    # The manual dispatch path is exempt: it has no workflow_run payload
    # at all (the conclusion is null), and the operator named the run
    # explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    steps:
      - uses: actions/checkout@v7
        with:
          # The retry logic lives on the default branch, and so does
          # this workflow -- `workflow_run` always runs the workflow
          # from the default branch.  Pinning the checkout to the
          # default branch makes it explicit that the script is the
          # merged one, not the one from the branch that happened to
          # fail.
          ref: ${{ github.event.repository.default_branch }}

      - name: Self-test the retry classifier
        # The classifier is the whole safety argument of this workflow:
        # it is what keeps a real failure from being re-run.  A guard
        # that cannot fail is a guard that stopped guarding, so it is
        # self-tested on every invocation.
        run: python3 tools/ci_retry_runner.py --self-test

      - name: Retry the starved jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `workflow_run.id` is the run that just completed.  The
          # manual dispatch path may override it with a specific run.
          TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${TARGET_RUN_ID}" ]]; then
            echo "::error::no run id to inspect"
            exit 1
          fi

          echo "inspecting run ${TARGET_RUN_ID}"
          python3 tools/ci_retry_runner.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${TARGET_RUN_ID}" \
            --max-attempt 1 \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Surface the verdict
        # The summary is the record of what the workflow decided and
        # why.  A retry that silently did nothing looks identical to a
        # retry that worked, and only one of them is a red build.
        if: always()
        run: |
          {
            echo "### ci-retry"
            echo ""
            echo "Run \`${TARGET_RUN_ID:-n/a}\` inspected."
            echo ""
            echo "Only jobs that never received a runner are re-run. A job"
            echo "that ran and failed is left alone, because that failure"
            echo "belongs to the tree."
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
