# =============================================================================
# NimRTC continuous integration
#
# Matrix (1.0.0):
#   - windows       : MSVC 19.43 on windows-2022        (primary dev env)
#   - linux-gcc     : GCC 11 on ubuntu-22.04            (x86_64)
#   - linux-aarch64 : GCC 11 on ubuntu-24.04-arm        (native arm64 runner)
#   - macos-clang   : Apple Clang on macos-15           (arm64; runs x86_64 binaries
#                                                          under Rosetta)
#
# Goals:
#   1. Library + tests + loopback example build on every supported platform.
#   2. All gtest unit tests pass on every supported platform.
#   3. Loopback-p2p smoke (NimRTC↔NimRTC over loopback UDP) exits 0 on
#      Windows; Linux/macOS run ctest only at this stage.
#
# End-to-end Chrome interop lives in `interop.yml`.
#
# PLATFORM NOTE: cross-platform jobs in this matrix are intentionally
# fail-fast=false and per-job so a regression on one platform does not
# hide the others. See CHANGELOG.md "Platform support matrix" for the
# current support status of each (✅ = CI green-and-merged, 🔶 = best-effort,
# pending first green run).
# =============================================================================

name: ci

on:
  push:
    branches: [main, feat/**, fix/**, chore/**, release/**]
  pull_request:
    branches: [main]
  # Manual trigger.  Useful for re-running the 4-platform matrix on
  # demand (e.g. after a runner-side hiccup) without pushing a commit.
  workflow_dispatch:

# Cancel superseded runs on the same ref (branch or PR). Each job below
# overrides `concurrency.group` so the macOS runner doesn't gate the Linux
# runner, etc.  NB: interop.yml uses "ci-e2e-${{ github.ref }}" so the two
# workflows do NOT share a concurrency group (avoids cascading cancels on
# rapid re-pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug

jobs:
  # ---------------------------------------------------------------------------
  # Windows: MSVC on windows-2022
  # ---------------------------------------------------------------------------
  windows:
    name: windows / msvc
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # v1.0+: hard gate — drift = red CI = blocked merge.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        shell: pwsh
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python scripts/check_api_marker_includes.py

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        shell: pwsh
        run: python tools/ci_preflight.py

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake + build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            build
          key: ${{ runner.os }}-cmake-debug.msvc-${{ hashFiles('CMakeLists.txt', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug.msvc-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's SChannel backend loads the
      # certificate from the Windows certificate store, so the certificate is
      # created and installed here; its SHA-1 thumbprint is written to
      # build/wtserver_hash.txt, which the listener reads at startup.
      # This step runs after the build-directory cache restore so the
      # thumbprint file always matches the certificate in the store.
      - name: Provision WebTransport TLS material
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File ./scripts/generate_wtserver_cert.ps1 `
            -BuildDir "${{ github.workspace }}/build"

      - name: Configure
        run: cmake --preset debug.msvc -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        run: cmake --build --preset debug.msvc -j 2

      - name: Test
        run: ctest --preset tests.msvc --output-on-failure -j 2

      - name: Loopback smoke
        shell: cmd
        run: |
          if exist build\examples\loopback-p2p\Debug\loopback-p2p.exe (
            build\examples\loopback-p2p\Debug\loopback-p2p.exe
          )

      - name: Benchmark transport floor (Track A)
        shell: pwsh
        run: |
          python tools/benchmark_latency.py --count 1000
          python tools/benchmark_dc.py
          python tools/benchmark_weaknet.py --count 200 --size 1200

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows-x86_64-${{ github.run_id }}
          path: |
            build/e2e/bench_latency.json
            build/e2e/bench_dc.json
            build/e2e/bench_weaknet.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # GMSSL vendored opt-in (v1.1 X1, ADR-013 correction).
  # Windows/MSVC acceptance: submodule at src/third_party/gmssl/src
  # (pin v3.2.0) builds STATIC EXCLUDE_FROM_ALL when
  # NIMRTC_ENABLE_DTLS_GMSSL=ON, and test_dtls_gmssl_tlcp passes.
  # Default builds stay OFF (zero cost for non-GM users).
  # ---------------------------------------------------------------------------
  gmssl-vendored:
    name: gmssl-vendored / msvc
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gmssl-vendored
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (GMSSL ON)
        # NIMRTC_VENDORED_WEBRTC_APM=OFF: this leg is about the GMSSL DTLS
        # backend, not the 3A stack.  The WebRTC APM prebuilt archive is
        # not present on a CI runner (it is produced by the release
        # workflow's out-of-tree meson prebuild), and the default ON
        # contract hard-fails at configure time when the archive is
        # missing.  Every other CI leg passes the same flag.
        run: cmake --preset debug.msvc -DNIMRTC_ENABLE_DTLS_GMSSL=ON -DNIMRTC_BUILD_EXAMPLES=OFF -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build GMSSL backend + TLCP test
        run: cmake --build --preset debug.msvc --target nimrtc_dtls_seam nimrtc_gmssl_cli test_dtls_gmssl_tlcp -j 2

      - name: Run TLCP test
        # test_dtls_gmssl_tlcp shells out to `gmssl sm2keygen`/`gmssl certgen`
        # for SM2 fixtures — put the vendored CLI on PATH first.
        run: |
          $gmsslBin = Get-ChildItem -Recurse -Filter gmssl.exe build | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($gmsslBin) { $env:PATH = "$gmsslBin;$env:PATH" }
          ctest --preset tests.msvc -R test_dtls_gmssl_tlcp --output-on-failure

  # ---------------------------------------------------------------------------
  # Docs: Markdown link / anchor integrity.
  # Cheap, platform-independent, and catches the class of rot that a
  # README rewrite introduces (relative paths written as if they were
  # repo-root-relative, anchors that no longer match a heading).
  # ---------------------------------------------------------------------------
  docs:
    name: docs / markdown links
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Markdown links and anchors
        run: python tools/check_md_links.py

      # The offline release-signature verifier carries its own Ed25519
      # implementation.  A wrong curve equation or an inverted
      # verification equation makes it reject *valid* release
      # signatures, so the RFC 8032 §7.1 vectors run on every push.
      - name: Self-test the offline release signature verifier
        run: python tools/verify_release_signature.py --self-test

      # The soak collector's whole value is in its evidence, so its
      # streak semantics are pinned by a self-test: seven calendar-
      # consecutive green days are a streak of seven, a gap or a failing
      # or an inconclusive day ends it, a FAIL hidden behind a later
      # PASS does not make the day green, and a day measured on a tree
      # other than the candidate branch is not green at all.  Without
      # this running on every push, a change to the gate could make the
      # window overstate itself -- and the window is what the release
      # tag waits on.
      - name: Self-test the soak evidence collector
        run: python tools/run_soak.py --self-test

      # The fetcher is how the CI half of the window is read back.  It
      # must not lose a record (a day measured twice keeps both sets)
      # and it must not grow the files it writes (a record that is
      # already there is not written again), or the window it reports
      # would not be the window that was measured.
      - name: Self-test the soak evidence fetcher
        run: python tools/fetch_soak_evidence.py --self-test

      # The sanitizer gate decides whether the sanitizer CI leg fails, so
      # a bug in the gate's own classification is a silent hole in the
      # coverage: a NimRTC finding misfiled as vendored would stop the
      # gate from ever firing.  The self-test pins the classification:
      # an ASan report rooted in our own code is ours, a report rooted in
      # src/third_party is upstream even when our code is on the stack,
      # a data race whose other party is our code is shared, and a test
      # failure that no upstream report explains is a plain failure.
      - name: Self-test the sanitizer gate
        run: python tools/sanitizer_gate.py --self-test

      # Pre-tag guardrail (v1.1 plan Track C, item C3).  These are
      # repo-level facts that no unit test sees and that rot quietly
      # between releases: the SFU track must stay unwired, every public
      # symbol must carry an ADR-015 stability marker, the API version
      # must not carry a pre-release label, every submodule pin must be
      # fetchable from a fresh clone, and the project root must stay
      # free of scratch files.  The script was written for the tag cut
      # but never wired into CI, so a violation could only surface when
      # the release was already being cut.  Running it on every push
      # moves the failure to the push that introduced it.
      #
      # `--final-tag` is deliberately NOT passed here: it requires an
      # empty NIMRTC_API_VERSION_PRE_RELEASE, which is a property of a
      # release tag rather than of ordinary trunk commits.  The release
      # workflow passes it at cut time.
      - name: Release freeze checklist
        run: sh scripts/check-release-freeze.sh

  # ---------------------------------------------------------------------------
  # Linux x86_64: GCC on ubuntu-22.04
  # ---------------------------------------------------------------------------
  linux-gcc:
    name: linux-gcc / x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-gcc
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # v1.0+: hard gate — drift = red CI = blocked merge.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python3 scripts/check_api_marker_includes.py

      # Ubuntu 22.04 ships CMake 3.22.3; CMakePresets.json uses preset
      # schema v6 which requires CMake ≥ 3.25. Pin a recent cmake via pip.
      - name: Install ninja + Python (CMake via pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Cache CMake + build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            ~/.local/lib/python*/site-packages/cmake
            build
          key: ${{ runner.os }}-cmake-debug-${{ hashFiles('CMakeLists.txt', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's OpenSSL / quictls backend
      # loads it from PEM files, so a self-signed key + certificate pair is
      # written into the build directory here.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      - name: Configure
        run: cmake --preset debug -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF -DNIMRTC_INSTALL=ON

      - name: Build
        run: cmake --build --preset debug -j 2

      - name: Test
        run: ctest --preset tests --output-on-failure -j 2

      # Track D downstream proof (Linux): install into a staging dir and
      # build a minimal find_package(NimRTC) consumer against it, so the
      # install rules stay verified on every push — not just on Windows.
      - name: Install + downstream proof
        run: |
          cmake --install build --prefix build/_install/linux-x86_64
          found="$(find build/_install/linux-x86_64 -name NimRTCConfig.cmake -print -quit)"
          test -n "$found" && test -f "$found"
          mkdir -p build/downstream-proof
          cat > build/downstream-proof/main.cpp <<'EOF'
          #include <nimrtc/core/api_version.hpp>
          #include <cstdio>
          int main() {
            std::printf("nimrtc %s\n", NIMRTC_API_VERSION_STRING);
            return 0;
          }
          EOF
          cat > build/downstream-proof/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(nimrtc_downstream_proof LANGUAGES CXX)
          find_package(NimRTC 1.0 REQUIRED)
          add_executable(downstream_proof main.cpp)
          target_link_libraries(downstream_proof PRIVATE nimrtc::engine)
          EOF
          cmake -S build/downstream-proof -B build/downstream-proof/build \
            -DCMAKE_PREFIX_PATH="$PWD/build/_install/linux-x86_64"
          cmake --build build/downstream-proof/build
          ./build/downstream-proof/build/downstream_proof

      - name: Benchmark transport floor (Track A)
        run: |
          python3 tools/benchmark_latency.py --count 1000
          python3 tools/benchmark_dc.py
          python3 tools/benchmark_weaknet.py --count 200 --size 1200

      - name: Benchmark weak network with kernel netem (Linux only)
        run: |
          sudo --preserve-env=PATH bash tools/benchmark_weaknet_netem.sh --count 200 --size 1200

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-x86_64-${{ github.run_id }}
          path: |
            build/e2e/bench_latency.json
            build/e2e/bench_dc.json
            build/e2e/bench_weaknet.json
            build/e2e/bench_weaknet_netem.json
          retention-days: 14

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-gcc-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # linux-sanitizers: ASan + UBSan + TSan on ubuntu-22.04
  #
  # P0 hardening (2026-11-09): the project had sanitizer *options*
  # (NIMRTC_ASAN / NIMRTC_UBSAN) but no CI leg ever enabled them, so the
  # ~274 std::mutex / ~222 std::atomic in the tree were never checked for
  # data races.  This job is the gate.
  #
  # Two legs in one job (matrix over the preset):
  #   - asan-ubsan : memory errors + undefined behaviour
  #   - tsan       : data races
  #
  # ASan and TSan are mutually exclusive, so they cannot live in the same
  # build; the presets set the others OFF explicitly and
  # cmake/NimRTCOptions.cmake raises a hard FATAL_ERROR if both end up ON.
  #
  # The sanitizer flags are applied GLOBALLY (add_compile_options /
  # add_link_options) so the vendored third-party static libs are
  # instrumented too and the sanitizer runtime is present in every final
  # link line — a per-target application would produce undefined
  # references to the runtime in the test executables.
  #
  # Vendor code noise: wolfSSL / usrsctp / libjuice / msquic are upstream
  # code and may trip the sanitizers on their own.  Suppressing their
  # reports globally would hide real issues in the code we call into, and
  # failing on every upstream finding would train everyone to ignore the
  # gate.  So tools/sanitizer_gate.py classifies every report by the
  # ownership of its root frame:
  #
  #   owned  : the root frame is in src/ or tests/       -> the job FAILS
  #   vendor : the root frame is in src/third_party/     -> reported only
  #   shared : upstream root, NimRTC is the other party  -> reported only
  #
  # The ctest step is continue-on-error so that a sanitizer abort -- which
  # kills the test binary -- cannot stop the job before the gate has read
  # the log.  The gate step is what decides the outcome of the job: a
  # NimRTC-owned finding fails it, an upstream finding does not.  A test
  # failure that no upstream report explains is a plain test failure and
  # fails the gate too -- the sanitizer build can expose timing bugs the
  # plain build does not.
  # ---------------------------------------------------------------------------
  linux-sanitizers:
    name: linux-sanitizers / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: asan-ubsan
          - preset: tsan
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-sanitizers-${{ matrix.preset }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ninja + Python (CMake via pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Configure (${{ matrix.preset }})
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF \
            -DNIMRTC_INSTALL=OFF

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} -j 2

      - name: Test (${{ matrix.preset }})
        # continue-on-error: a sanitizer abort kills the test binary, and
        # the gate below still has to read what the sanitizer printed
        # before the job is allowed to end.
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set +e
          ctest --preset tests.${{ matrix.preset }} -j 2 --output-on-failure 2>&1 | tee build/sanitizer-ctest.log
          echo "${PIPESTATUS[0]}" > build/ctest-exit.txt
          exit 0

      - name: Classify the sanitizer findings
        # The gate is the point of this job.  LastTest.log is read as
        # well: ctest only echoes the output of *failing* tests, so a
        # leak report printed by a test that still passed would otherwise
        # never be seen.
        run: |
          python3 tools/sanitizer_gate.py \
            --ctest-status build/ctest-exit.txt \
            build/sanitizer-ctest.log \
            build/Testing/Temporary/LastTest.log

      - name: Upload sanitizer build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.preset }}-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux aarch64: GCC on a native arm64 runner
  #
  # ROOT CAUSE (corrected 2026-10-28): the "ARM64 runner pool is
  # unreliable" story in the CHANGELOG was a misdiagnosis.  The label
  # `ubuntu-22.04-arm64` was never a valid GitHub-hosted runner label
  # -- the documented ARM64 labels are `ubuntu-26.04-arm`,
  # `ubuntu-24.04-arm` and `ubuntu-22.04-arm` (see the "Available
  # Images" table in actions/runner-images' README).  A job asking for
  # a label that matches no runner sits in `queued` forever: the
  # check-run stays `queued`, `started_at == created_at`, and
  # `runner_name` stays empty.
  #
  # That is exactly what the historical runs show.  Run #269
  # (#40370283784, 2026-10-26) had an aarch64 job with
  # `labels: [ubuntu-22.04-arm64]` and an empty `runner_name`, while
  # the other three jobs in the same run were allocated a runner within
  # 5 seconds.  Commit 4467cd8's aarch64 check-run sat queued for
  # exactly 24 h (2026-09-11T02:30:03Z -> 2026-09-12T02:30:03Z) and
  # was then cancelled -- the signature of "no runner matches this
  # label", not of "the pool is saturated".  The label was introduced
  # by 4467cd8 (2026-09-11); before it, 21e883f used the valid
  # `ubuntu-22.04-arm`.
  #
  # The label is now `ubuntu-24.04-arm`, which IS in the documented
  # label set, so the leg is a plain hard gate again -- no repository
  # variable, no `if:`.  A queued-forever job blocks the whole run
  # from reaching a terminal state, so keeping an escape hatch is
  # worth it, but the escape hatch must not be the default: the
  # previous `vars.NIMRTC_ARM64_CI` gate meant the 4-platform matrix
  # could never be observed green on a normal push, which is what
  # v1.0-plan.md §3 Gate #8 requires.
  #
  # If this leg ever has to be skipped, use a code change (as
  # 34a6ace / d2152ff did) rather than a variable -- a variable gate
  # makes "is the ARM64 leg actually running?" a question that has to
  # be answered out of band, which is what this register exists to
  # prevent.
  #
  # See `docs/plan/ci-workarounds.md` §4 (W5) for the full record.
  # ---------------------------------------------------------------------------
  linux-aarch64:
    name: linux-gcc / aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-aarch64
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python3 scripts/check_api_marker_includes.py

      - name: Install ninja + g++ + Python
        # The runner is a *native* arm64 host, so the cross toolchain is
        # not needed: `cmake/toolchains/aarch64-linux-gnu.cmake` detects
        # `uname -m == aarch64` and uses the system compiler directly
        # (its "native aarch64" branch, which is checked *before* the
        # cross-toolchain probe).  Installing the cross package here
        # would have made the toolchain file pick the cross compiler
        # and point `CMAKE_SYSROOT` at a sysroot the native image does
        # not have.  `g++` (not `g++-aarch64-linux-gnu`) is the native
        # arm64 package on this image.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 g++
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Cache CMake + build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            ~/.local/lib/python*/site-packages/cmake
            build
          key: ${{ runner.os }}-cmake-debug.aarch64-${{ hashFiles('CMakeLists.txt', 'cmake/toolchains/aarch64-linux-gnu.cmake', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug.aarch64-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's OpenSSL / quictls backend
      # loads it from PEM files, so a self-signed key + certificate pair is
      # written into the build directory here.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      - name: Configure
        run: cmake --preset debug.aarch64 -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        run: cmake --build --preset debug.aarch64 -j 2

      - name: Test
        run: ctest --preset tests.aarch64 --output-on-failure -j 2

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-aarch64-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS: Apple Clang on macos-15 (arm64)
  #
  # macos-14 images were retired from GitHub Actions on 2026-11-02
  # (actions/runner-images#15226).  A job that asks for a retired label
  # is never allocated a runner: it stays queued and is then cancelled,
  # which is exactly what every macos-clang job did from 2026-11-06
  # onwards.  macos-15 is the current arm64 image; it ships a newer
  # CMake (3.31.x) and Xcode, so the Apple Clang leg is unaffected.
  # ---------------------------------------------------------------------------
  macos-clang:
    name: macos-clang / arm64
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-macos-clang
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python3 scripts/check_api_marker_includes.py

      - name: Unused-const gate self-test
        # The gate below only reports what its scanner recognizes.  The
        # self-test pins that behavior: an unused internal-linkage
        # constant must be reported, an external-linkage one must not.
        run: python3 scripts/test_check_unused_const.py

      - name: Unused-const gate (Apple Clang)
        # Clang's -Wunused-const-variable fires on a namespace-scope
        # constant in a .cpp that nothing reads; GCC does not diagnose
        # the same construct, so the defect is invisible on the Windows
        # and Linux builds and only breaks this leg (which compiles with
        # -Werror).  The scanner exits non-zero when it finds one.
        run: python3 scripts/check_unused_const.py .

      # macos-15 ships a modern CMake (3.31.x, ≥ 3.25) but its system
      # Python is not guaranteed to be the version the tooling expects
      # (and a Homebrew `brew update` can burn 10-25 min on a cold tap
      # refresh).  Pin a managed interpreter with actions/setup-python,
      # exactly as the release workflow's macos job does.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Cache CMake + build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CMake
            build
          key: ${{ runner.os }}-cmake-debug.macos-${{ hashFiles('CMakeLists.txt', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug.macos-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's OpenSSL / quictls backend
      # loads it from PEM files, so a self-signed key + certificate pair is
      # written into the build directory here.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      - name: Configure
        run: cmake --preset debug.macos -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        run: cmake --build --preset debug.macos -j 2

      - name: Test
        run: ctest --preset tests.macos --output-on-failure -j 2

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-clang-${{ github.run_id }}
          path: build/
          retention-days: 7
