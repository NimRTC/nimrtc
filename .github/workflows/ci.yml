# =============================================================================
# NimRTC continuous integration
#
# Matrix (1.0.0):
#   - windows       : MSVC 19.43 on windows-2022        (primary dev env)
#   - linux-gcc     : GCC 11 on ubuntu-22.04            (x86_64)
#   - linux-aarch64 : GCC 11 on ubuntu-24.04-arm        (native arm64 runner)
#   - macos-clang   : Apple Clang on macos-15           (arm64; runs x86_64 binaries
#                                                          under Rosetta)
#
# Goals:
#   1. Library + tests + loopback example build on every supported platform.
#   2. All gtest unit tests pass on every supported platform.
#   3. Loopback-p2p smoke (NimRTC↔NimRTC over loopback UDP) exits 0 on
#      Windows; Linux/macOS run ctest only at this stage.
#
# End-to-end Chrome interop lives in `interop.yml`.
#
# PLATFORM NOTE: cross-platform jobs in this matrix are intentionally
# fail-fast=false and per-job so a regression on one platform does not
# hide the others. See CHANGELOG.md "Platform support matrix" for the
# current support status of each (✅ = CI green-and-merged, 🔶 = best-effort,
# pending first green run).
# =============================================================================

name: ci

on:
  # The full matrix is reserved for the refs that actually merge:
  # `main` itself and the release branches, plus every PR that targets
  # `main`.  A push to a working branch gets the fast leg
  # (`ci-fast.yml`) instead -- see the comment there for the throughput
  # argument.  The eleven checks the repository ruleset gates on are
  # exactly the ones produced here or in `interop.yml`, and both still
  # run on `main` and on every PR into `main`.
  #
  # `tools/check_ci_ruleset.py` is what keeps that sentence true: it
  # compares `.github/rulesets/protect-main.json` against the
  # workflows and fails when the two disagree.
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  # Manual trigger.  Useful for re-running the 4-platform matrix on
  # demand (e.g. after a runner-side hiccup) without pushing a commit.
  workflow_dispatch:

# Cancel superseded runs on the same ref (branch or PR). Each job below
# overrides `concurrency.group` so the macOS runner doesn't gate the Linux
# runner, etc.  NB: interop.yml uses "ci-e2e-${{ github.ref }}" so the two
# workflows do NOT share a concurrency group (avoids cascading cancels on
# rapid re-pushes).
#
# NB: the group deliberately does NOT carry the head SHA.  A pull
# request's `github.ref` is `refs/pull/<n>/merge` for EVERY commit on
# that pull request, so the group cannot tell two commits apart -- and a
# re-run of an OLD commit's run enters the group of the CURRENT run and
# cancels it.  That is an infinite loop (the `ci-retry` workflow does
# exactly such a re-run for a starved job; the retry kills the current
# run, the cancellation fires another retry, and the pull request can
# never go green -- observed on PR #124).
#
# The fix belongs in the actor, not in the group: the group must stay
# SHA-free so that a new push still cancels the run it supersedes (which
# is what keeps a rapid sequence of pushes from burning a full
# four-platform matrix each).  `tools/ci_retry_runner.py` therefore
# refuses to re-run a run whose commit is no longer the head of its ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug

jobs:
  # ---------------------------------------------------------------------------
  # Windows: MSVC on windows-2022
  # ---------------------------------------------------------------------------
  windows:
    name: windows / msvc
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # v1.0+: hard gate — drift = red CI = blocked merge.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        shell: pwsh
        run: python tools/check_vendor.py

      # PyYAML is not part of the standard library, and the
      # PowerShell-step guard below parses the workflow files with it.
      # The runner image usually has it, but "usually" is not a
      # dependency contract -- and the guard is worthless if it silently
      # skips.  Installing it explicitly turns "the runner happened to
      # have it" into "the guard runs".
      - name: Install PyYAML
        shell: pwsh
        run: python -m pip install --upgrade pyyaml

      # A `run:` block under `shell: pwsh` is PowerShell, and PowerShell
      # reads `$var:` as a *drive reference* -- the `:` is a drive
      # qualifier, not punctuation.  So `Write-Host "mirror $m: not a
      # clone"` is a parser error, not a string with a colon in it: the
      # step dies before it does anything, and the log says
      # `InvalidVariableReferenceWithDrive` without naming the mistake.
      #
      # It landed in the hardware job's mirror-fetching step on
      # 2026-11-24 -- the step written to make the job survive a broken
      # link was the step that failed.  This guard parses every
      # PowerShell step with the PowerShell parser, so a mistake like
      # that is found here rather than on the runner.  It needs the
      # parser, so it runs on this Windows leg; the Linux and macOS legs
      # report it as skipped.
      - name: Check that every PowerShell workflow step parses
        shell: pwsh
        run: python tools/check_workflow_powershell.py --self-test

      # The v1.4 plan's verification table (§10) is a list of claims
      # about the tree, each a search a person is meant to run by hand.
      # Hand-run tables drift: three items landed between the plan's
      # survey (2026-11-19) and 2026-11-24 -- the real TURN/TLS
      # client, the reference TURN deployment, and the engine running
      # the renderer -- and the table still said none of them existed.
      # The next reader would have gone and built them again.
      #
      # So the table is *executed*, and a claim that no longer holds is
      # reported.  This step prints the report; it does not fail the
      # build on a stale claim, because a plan that has moved on is a
      # documentation task, and a build that goes red for it teaches
      # people to ignore the build.  The self-test pins the checker's
      # own machinery, so the checker cannot silently pass everything.
      - name: Report the v1.4 plan's claims against the tree
        shell: pwsh
        run: python tools/check_v14_plan_status.py --self-test
        # The report itself: every claim, with the stale ones marked.
      - name: Report the v1.4 plan's status
        shell: pwsh
        run: python tools/check_v14_plan_status.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python scripts/check_api_marker_includes.py

      - name: API freeze — public header manifest
        # The checked-in manifest lists every public header.  The
        # per-symbol scan above checks the *markers*; this checks the
        # *set*.  A count cannot tell a swap from a change: deleting
        # `a.hpp` and adding `b.hpp` in the same PR leaves the count
        # untouched, so CI would stay green while the public surface
        # moved.  ADR-015 calls the surface a contract, and a contract
        # needs the actual list, not its cardinality.
        run: python scripts/check_api_manifest.py

      - name: Deployment-bundle packaging self-test
        # The packaging script has two guards that protect the operator
        # from a bundle that ships the wrong code: it refuses to mix
        # build trees (a msquic.dll from another configuration is an
        # ABI mismatch), and it warns when the binaries are older than
        # the sources they were built from.  Both are quiet failures
        # if they are dropped, so they are pinned here.  The script
        # under test is a .ps1, so this leg is the one that can run it.
        run: python scripts/test_package_rd_deploy.py

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        shell: pwsh
        run: python tools/ci_preflight.py

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake + build directory
        uses: actions/cache@v6
        with:
          path: |
            ~/.cmake
            build
          key: ${{ runner.os }}-cmake-debug.msvc-${{ hashFiles('CMakeLists.txt', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug.msvc-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's SChannel backend loads the
      # certificate from the Windows certificate store, so the certificate is
      # created and installed here; its SHA-1 thumbprint is written to
      # build/wtserver_hash.txt, which the listener reads at startup.
      # This step runs after the build-directory cache restore so the
      # thumbprint file always matches the certificate in the store.
      - name: Provision WebTransport TLS material
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File ./scripts/generate_wtserver_cert.ps1 `
            -BuildDir "${{ github.workspace }}/build"

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        shell: pwsh
        run: python scripts/generate_dtls_certs_ci.py

      # NIMRTC_PLUGINS_OPENH264 / NIMRTC_PLUGINS_DAV1D: the real software
      # codecs (remote-desktop plan WP-B).  They are vendored source
      # builds, so the leg proves that the wrappers compile and that the
      # software round-trip tests pass on this platform too.
      - name: Configure
        run: cmake --preset debug.msvc -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF -DNIMRTC_INSTALL=ON -DNIMRTC_PLUGINS_OPENH264=ON -DNIMRTC_PLUGINS_DAV1D=ON

      - name: Build
        run: cmake --build --preset debug.msvc -j 2

      - name: Test
        run: ctest --preset tests.msvc --output-on-failure -j 2

      # Track D downstream proof (Windows / MSVC): stage the installed
      # bundle and build a minimal find_package(NimRTC) consumer against
      # it.  The Linux leg of this proof cannot catch an MSVC-only
      # packaging defect: GCC 11+ defaults to gnu++17, which is enough
      # for the public headers, while MSVC defaults to C++14 and needs
      # the standard the package config has to declare.  The consumer
      # below deliberately pins NO CMAKE_CXX_STANDARD -- inheriting the
      # standard from the package is exactly what has to work.
      #
      # CMAKE_MSVC_RUNTIME_LIBRARY does have to match: the bundle is
      # built with MultiThreadedDLL (/MD, the dev.msvc preset), so the
      # consumer has to use the same CRT or the linker reports
      # LNK2038 (incompatible CRT).
      - name: Install + downstream proof
        shell: pwsh
        run: |
          cmake --install build --config Debug --prefix build/_install/windows-x86_64
          $cfg = Get-ChildItem build/_install/windows-x86_64 -Recurse -Filter NimRTCConfig.cmake | Select-Object -First 1
          if (-not $cfg) { throw "NimRTCConfig.cmake not found in the staged bundle" }
          New-Item -ItemType Directory -Force build/downstream-proof | Out-Null
          @'
          #include <nimrtc/engine/engine.hpp>
          #include <cstdio>
          int main() {
            std::printf("nimrtc %s\n", NIMRTC_API_VERSION_STRING);
            return 0;
          }
          '@ | Set-Content build/downstream-proof/main.cpp
          @'
          cmake_minimum_required(VERSION 3.20)
          project(nimrtc_downstream_proof LANGUAGES CXX)
          find_package(NimRTC 1.0 REQUIRED)
          add_executable(downstream_proof main.cpp)
          target_link_libraries(downstream_proof PRIVATE nimrtc::engine)
          '@ | Set-Content build/downstream-proof/CMakeLists.txt
          cmake -S build/downstream-proof -B build/downstream-proof/build `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/_install/windows-x86_64" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          cmake --build build/downstream-proof/build --config Debug
          $exe = Get-ChildItem build/downstream-proof/build -Recurse -Filter downstream_proof.exe | Select-Object -First 1
          if (-not $exe) { throw "downstream_proof.exe was not produced" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "downstream proof exited $LASTEXITCODE" }

      - name: Loopback smoke
        shell: cmd
        run: |
          if exist build\examples\loopback-p2p\Debug\loopback-p2p.exe (
            build\examples\loopback-p2p\Debug\loopback-p2p.exe
          )

      - name: Benchmark transport floor (Track A)
        shell: pwsh
        run: |
          python tools/benchmark_latency.py --count 1000
          python tools/benchmark_dc.py
          python tools/benchmark_weaknet.py --count 200 --size 1200

      # The saturated-link benchmark (v1.2 plan item E6).
      #
      # This one is a **gate**, not just a measurement: the wrapper
      # asserts the run's invariants (the saturation was real, the
      # stream survived, the ladder stepped down, the estimator never
      # raised its target on a report that said the link was
      # congested, the offered load tracked the capacity, the ladder
      # recovered, and it did not flap) and exits non-zero when one of
      # them fails.  The AIMD regression guard in particular catches a
      # defect this benchmark itself uncovered: the estimator used to
      # resume its additive increase while the link was still lossy,
      # so the estimate walked back into the wall it had just been
      # throttled away from.
      #
      # The numbers themselves are machine-dependent (the loopback's
      # real RTT and the host's real scheduling jitter), so the *artifact*
      # is uploaded but is not a pass/fail threshold — the invariants
      # are.
      - name: Benchmark saturated link (plan E6)
        shell: pwsh
        run: |
          cmake --build --preset debug.msvc --target bench_saturation -j 2
          python tools/benchmark_saturation.py --build-dir build --out build/e2e/bench_saturation.json

      # The G2 half of E6: the control plane's latency under a
      # saturated video path.  The invariants are what matter — the
      # media path really was saturated, the control plane reached the
      # profile's rate, its p99 stayed inside the profile's declared
      # budget, every control message arrived, and the two stacks rode
      # different 5-tuples — and the wrapper exits non-zero when one of
      # them fails.
      #
      # The rate invariant is **skipped** on a host without the
      # high-resolution deadline (the binary reports whether it had
      # one): the measured rate is produced by a thread waiting on a
      # deadline, so without it the run would measure the host's timer
      # rather than the transport.  A skip is reported, not hidden.
      - name: Benchmark G2 control plane (plan E6)
        shell: pwsh
        run: |
          cmake --build --preset debug.msvc --target bench_control_saturation -j 2
          python tools/benchmark_control_saturation.py --build-dir build --out build/e2e/bench_control_saturation.json

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-windows-x86_64-${{ github.run_id }}
          path: |
            build/e2e/bench_latency.json
            build/e2e/bench_dc.json
            build/e2e/bench_weaknet.json
            build/e2e/bench_saturation.json
            build/e2e/bench_control_saturation.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # DXVA (Windows Media Foundation H.264 hardware decoder).
  #
  # WHY THIS LEG EXISTS
  #
  # `NIMRTC_PLUGINS_DXVA` is OFF by default and **no other CI leg turned it
  # on**, so `src/modules/h264/src/dxva_decoder.cpp` was never compiled by
  # CI at all.  That is how a file could sit in the tree targeting the
  # *pre-split* codec seam -- types that no longer exist
  # (`VideoFrameType`, `EncodedImage`, `VideoEncoderConfig`,
  # `VideoCodecOptions`, `decode(const uint8_t*, int, ...)`) -- and still
  # leave the whole matrix green.  The rot was invisible precisely because
  # the option was off: a Windows host that asked for `--backend hardware`
  # got a *build failure*, not a degraded picture.
  #
  # The fix is not a code change; it is making the option's code path part
  # of what CI compiles.  This leg does that.
  #
  # WHY IT IS ITS OWN JOB AND NOT A FLAG ON THE WINDOWS LEG
  #
  # Two reasons.  First, the failure this leg exists to catch is a
  # *compile* failure in one file; folding it into the main Windows job
  # would bury it in a 60-minute matrix where the first thing you read is
  # "the Windows job failed", not "the DXVA backend does not compile".  A
  # dedicated job names the defect in the check name itself.  Second, the
  # two legs build different configurations (this one has
  # `NIMRTC_PLUGINS_DXVA=ON`), so they cannot share a build directory;
  # running both in one job would mean reconfiguring the same tree twice
  # and losing the cache benefit of the first.
  #
  # WHAT IT PROVES, AND WHAT IT DOES NOT
  #
  # It proves the DXVA backend **compiles and links** against the current
  # codec seam, and that its test binary builds and runs.  The decode tests
  # themselves `GTEST_SKIP()` on a host with no Media Foundation H.264
  # decoder (a Server Core container has the MFT but no usable media
  # stack), so on a hosted runner they are reported as skipped rather than
  # failed -- correctly: a host without the capability is not a bug.
  #
  # What it does NOT prove is that the decode is *correct* on hardware.
  # That is the `hardware.yml` job's job, on the self-hosted GPU runner.
  # This leg is the cheap half: it closes the compile-coverage hole, which
  # is the hole that let the stale file survive.
  # ---------------------------------------------------------------------------
  dxva-hardware:
    name: windows / dxva
    runs-on: windows-2022
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-dxva
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The DTLS test certificate pair.
      #
      # `scripts/build_dtls_cert.py` produces the Chrome-friendly ECC pair
      # into `tests/wolfssl_dtls/certs/` — a *build artefact*, gitignored
      # (`.gitignore:227`) — and CMake's copy rule reads it from there
      # (`cmake/NimRTCTest.cmake`).  It is therefore absent from a fresh
      # checkout, and every job whose build reaches that rule has to
      # generate it first; without it the build fails with
      #
      #     error MSB3073: "cmake.exe" -E copy_if_different
      #         .../tests/wolfssl_dtls/certs/ecc-key.pem .../certs/
      #
      # This leg builds the whole test tree, so it reaches that rule.
      # Every other job that does the same carries the same step.
      - name: Generate the DTLS test certificate pair
        run: python scripts/generate_dtls_certs_ci.py

      # NIMRTC_PLUGINS_DXVA=ON is the whole point of this leg.
      #
      # NIMRTC_PLUGINS_OPENH264=ON because the DXVA decode test produces
      # its bitstream with the software encoder -- without it the test
      # skips at "the software H.264 encoder is not available here" and
      # the leg would prove nothing about the decode path even on a host
      # that does have DXVA.
      #
      # NIMRTC_VENDORED_WEBRTC_APM=OFF because the WebRTC APM prebuilt
      # archive is not present on a CI runner; every other leg passes the
      # same flag.
      #
      # NIMRTC_BUILD_EXAMPLES=OFF: this leg is about the codec module,
      # and the examples add build time for nothing.
      - name: Configure (DXVA ON)
        run: >
          cmake --preset debug.msvc
          -DNIMRTC_PLUGINS_DXVA=ON
          -DNIMRTC_PLUGINS_OPENH264=ON
          -DNIMRTC_BUILD_EXAMPLES=OFF
          -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      # The build itself is the assertion.  Before this leg existed, this
      # file was never compiled by CI, which is how it could reference a
      # seam that had been deleted out from under it.
      - name: Build (DXVA ON)
        run: cmake --build --preset debug.msvc -j 2

      # The DXVA test binary is built by the build step above (it is in the
      # h264 module's test set), so running it proves the tests link too.
      # The decode cases skip on a runner with no Media Foundation H.264
      # decoder; that is a skip, not a failure, and the point of the leg
      # was the compile.
      - name: Run the DXVA tests
        run: ctest --preset tests.msvc -R test_dxva_hardware --output-on-failure

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-dxva-windows-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # GMSSL vendored opt-in (v1.1 X1, ADR-013 correction).
  # Windows/MSVC acceptance: submodule at src/third_party/gmssl/src
  # (pin v3.2.0) builds STATIC EXCLUDE_FROM_ALL when
  # NIMRTC_ENABLE_DTLS_GMSSL=ON, and test_dtls_gmssl_tlcp passes.
  # Default builds stay OFF (zero cost for non-GM users).
  # ---------------------------------------------------------------------------
  gmssl-vendored:
    name: gmssl-vendored / msvc
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gmssl-vendored
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        shell: pwsh
        run: python scripts/generate_dtls_certs_ci.py
      - name: Configure (GMSSL ON)
        # NIMRTC_VENDORED_WEBRTC_APM=OFF: this leg is about the GMSSL DTLS
        # backend, not the 3A stack.  The WebRTC APM prebuilt archive is
        # not present on a CI runner (it is produced by the release
        # workflow's out-of-tree meson prebuild), and the default ON
        # contract hard-fails at configure time when the archive is
        # missing.  Every other CI leg passes the same flag.
        run: cmake --preset debug.msvc -DNIMRTC_ENABLE_DTLS_GMSSL=ON -DNIMRTC_BUILD_EXAMPLES=OFF -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build GMSSL backend + TLCP test
        run: cmake --build --preset debug.msvc --target nimrtc_dtls_seam nimrtc_gmssl_cli test_dtls_gmssl_tlcp -j 2

      - name: Run TLCP test
        # test_dtls_gmssl_tlcp shells out to `gmssl sm2keygen`/`gmssl certgen`
        # for SM2 fixtures — put the vendored CLI on PATH first.
        run: |
          $gmsslBin = Get-ChildItem -Recurse -Filter gmssl.exe build | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($gmsslBin) { $env:PATH = "$gmsslBin;$env:PATH" }
          ctest --preset tests.msvc -R test_dtls_gmssl_tlcp --output-on-failure

  # ---------------------------------------------------------------------------
  # Real WebRTC APM: the "3A is enabled by default" leg (plan E3).
  #
  # Every other CI leg configures with -DNIMRTC_VENDORED_WEBRTC_APM=OFF, so
  # the *default* (ON) is asserted nowhere — the option could be flipped to
  # OFF in cmake/NimRTCVendored.cmake and the whole matrix would stay green.
  # This leg is the one that closes that hole:
  #
  #   * it prebuilds the real APM out-of-tree (meson) and configures with
  #     the option LEFT AT ITS DEFAULT — no -D flag at all.  A default that
  #     is not ON therefore fails the leg, which is the whole point;
  #   * it runs the ERLE rig with NIMRTC_REQUIRE_WEBRTC_APM=1, so a build
  #     that silently degraded to the stub 3A *fails* instead of skipping
  #     (a skipped gtest case is a passing ctest case);
  #   * the rig asserts ERLE >= 15 dB (ITU-T P.807's floor for a converged
  #     canceller) against a synthetic echo path.
  #
  # It is ONE platform on purpose (docs/zh/architecture.md §11.5.5, "升级
  # 路径"): the meson prebuild costs 10-20 min per platform, so folding it
  # into the 4-platform matrix would multiply that by four.  The other
  # three platforms keep the stub 3A, which is what makes this leg the
  # only place the default is exercised.
  # ---------------------------------------------------------------------------
  apm-real:
    name: linux-apm / real 3A
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-apm-real
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ninja + Python + meson (CMake via pip)
        # The upstream APM uses meson (not CMake) and pulls abseil-cpp in as
        # a subproject, so meson + ninja are build prerequisites here.  The
        # APM source tree itself is cloned by tools/fetch_webrtc_apm.py.
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3 4 5; do sudo apt-get install -y ninja-build python3 \
            python3-pip pkg-config && break || { sudo apt-get update; sleep 15; }; done
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25" "meson>=1.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The meson prebuild is the expensive part (abseil-cpp + ~440 APM
      # translation units).  Cache it so a rerun of this leg does not pay
      # for it twice.  The key includes the patch series, because a patch
      # change invalidates the build tree.
      - name: Cache the APM prebuild
        uses: actions/cache@v6
        with:
          path: |
            src/third_party/webrtc_audio_processing/src
            src/third_party/webrtc_audio_processing/build_meson
          key: ${{ runner.os }}-apm-${{ hashFiles('src/third_party/webrtc_audio_processing/patches/**', 'tools/build_webrtc_apm.sh', 'tools/fetch_webrtc_apm.py') }}
          restore-keys: |
            ${{ runner.os }}-apm-

      - name: Prebuild the WebRTC APM
        shell: bash
        run: PATH="$HOME/.local/bin:$PATH" python3 tools/fetch_webrtc_apm.py

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        run: python3 scripts/generate_dtls_certs_ci.py
      - name: Configure (APM left at its default)
        # NOTE: no -DNIMRTC_VENDORED_WEBRTC_APM flag here on purpose.  The
        # option's default IS the claim under test (docs/zh/architecture.md
        # §11.5.5), and pinning it to ON would assert the *flag* rather
        # than the default.  The release workflow pins it to ON because it
        # must ship the real APM; this leg must prove the default already
        # does.
        run: |
          cmake --preset debug \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_BUILD_TESTS=ON

      - name: Build the ERLE rig
        run: cmake --build --preset debug --target test_audio3a_erle -j 2

      - name: Measure the ERLE (the real APM, not the stub)
        # NIMRTC_REQUIRE_WEBRTC_APM=1 turns "the APM is not in this build"
        # from a skip into a failure.  Without it a stub build would skip
        # all three cases and ctest would report the leg green while
        # measuring nothing.
        env:
          NIMRTC_REQUIRE_WEBRTC_APM: "1"
        run: |
          ctest --preset tests --output-on-failure -R Audio3AErle

  # ---------------------------------------------------------------------------
  # Docs: Markdown link / anchor integrity.
  # Cheap, platform-independent, and catches the class of rot that a
  # README rewrite introduces (relative paths written as if they were
  # repo-root-relative, anchors that no longer match a heading).
  # ---------------------------------------------------------------------------
  docs:
    name: docs / markdown links
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # PyYAML is not part of the standard library, and the merge-gate
      # guard below parses the workflow files with it.  The runner image
      # usually has it, but "usually" is not a dependency contract --
      # and the guard is worthless if it silently skips.  Installing it
      # explicitly turns "the runner happened to have it" into "the
      # guard runs".
      - name: Install PyYAML
        run: python -m pip install --upgrade pyyaml

      - name: Check Markdown links and anchors
        run: python tools/check_md_links.py

      # The README is the front page, and it makes two claims about the
      # release: the badge says which version is published, and the
      # "Latest release" paragraph says what it contains.  Both went
      # stale for eleven days after v1.2.0 -- the badge still read
      # v1.0.2 while the body of the same file described v1.2.0 as
      # shipped.  Nothing caught it, because documentation drift is
      # invisible to the compiler and to the test suite.
      #
      # This check compares the badge, the "Latest release" paragraph
      # and the "Current main" paragraph in both languages against the
      # newest released section of the changelog, and fails when they
      # disagree.
      - name: Check the README's release claims against the changelog
        run: python tools/check_readme_release.py --verbose

      - name: Self-test the README release guard
        run: python tools/check_readme_release.py --self-test

      # The release workflow's tag filter decides whether a `git push` can
      # start a release.  GitHub evaluates `on.push.tags` patterns as
      # ECMAScript regexes anchored at the start of the ref, and the
      # pattern the repository shipped (`v[0-9]+.[0-9]+.[0-9]+*`) stood for
      # more than its author meant: a push of `chore/release-1.2-followup`
      # started the whole release workflow, which fails in preflight in
      # 0 s (run 44478642313, 2026-11-19).  The guard is a one-second check
      # that the filter matches every tag form the project cuts and no
      # branch in the repository.
      #
      # It runs wherever this job runs -- `main`, `release/**` and every PR
      # into `main` -- and NOT on a working branch, because `ci-fast.yml`
      # is what a working branch gets and it does not run the docs job.
      # That is the right place for it: the filters live in the tree, and
      # a working branch's push already cannot start `release.yml` once the
      # filters are correct.  During the window where a bad filter is being
      # pushed for the first time, this check would catch it on the PR, one
      # push later than ideal and before the merge.
      - name: Check the release workflow's tag filter
        run: python tools/check_release_tag_filter.py --self-test

      # A `${{ }}` block is evaluated by GitHub's expression language, not
      # by bash and not by YAML.  A shell expansion inside one -- writing an
      # expression block whose body is `tag` followed by a shell
      # dot-suffix-strip -- is invisible locally: the YAML parses and the
      # string is legal bash.  It shows up only after a push, as a workflow
      # that starts and produces zero jobs because the file did not parse.
      # That happened on 2026-11-19: commit `d6c3e38c` put such a block in
      # release.yml's ancestry step, and every subsequent push ran the
      # release workflow for 0 s with no jobs.  (This comment deliberately
      # does not quote the broken block -- quoting it here would break this
      # file in exactly the same way, which is also why the guard scans
      # comments.)
      - name: Check that every workflow expression is an expression
        run: python tools/check_workflow_expressions.py --self-test

      # The plugin catalogue in docs/plugin_author_guide.md section 4 is
      # a promise about the code: every knob it names must exist in
      # EngineConfig, every macro it names must exist in the registry,
      # and every registry macro must be listed.  A drift here is how
      # a plugin author ends up calling a macro that does not compile
      # or setting a knob the engine never reads.
      - name: Check the plugin catalogue against the code
        run: python tools/check_doc_contract.py

      # `examples/turn-server/` is the reference TURN deployment (v1.4
      # plan item N5).  It is a *deployment*: nothing in it is compiled,
      # and the CI leg that would use it is N5's follow-up, not this
      # one.  So it has no compiler to catch a mistake in it and no test
      # to catch a mistake in it.
      #
      # And every mistake in it fails **silently**: coturn's response to
      # an unreadable certificate is to start anyway with the TLS
      # listener disabled, so the container comes up, the port is
      # published, and the property the deployment exists to establish
      # -- that a client told "use TLS" cannot fall back to plain TCP --
      # is false.  The check pins the seven ways that happens, each of
      # which was a real defect in this directory.
      - name: Check the reference TURN server's deployment
        run: python tools/check_turn_server.py --verbose

      # A guard that cannot fail is not a guard, so each rule is
      # re-introduced into a scratch copy of the tree and the check is
      # required to fail.
      - name: Self-test the TURN-server deployment guard
        run: python tools/check_turn_server_selftest.py

      # The v1-n5-turn-server **acceptance file** is the only thing that
      # verifies that slice's STUN/TURN client implementation.  An
      # acceptance file whose assertions cannot fail is worse than no
      # acceptance file: it reads as coverage.
      #
      # So the acceptance file gets the same treatment the deployment
      # guard gets: each defect it claims to catch is re-introduced into
      # a scratch copy of the tree and the acceptance run is required to
      # go red.
      #
      # The defects are the three protocol bugs from the 2026-11-20
      # handover list (the RFC 3489 message-type layout, the
      # REQUESTED-TRANSPORT protocol byte, the XOR-RELAYED-ADDRESS
      # family offset), the deployment defects, and the attribute-padding
      # defect the three share as a premise.
      - name: Self-test the TURN-server acceptance file
        run: python tools/check_turn_server_acceptance_selftest.py

      # Architecture-remediation D2: "either wire it in, or delete it."
      # A module under src/modules/ with a complete implementation and
      # passing tests, but no path from the composition root, is the
      # worst state -- it manufactures the illusion that a feature
      # exists.  The check reads the CMake dependency graph and the
      # plugin registrar table; it needs no build.
      - name: Check for dead modules
        run: python tools/check_dead_modules.py

      # The guard above is only worth having if it can fail.  The
      # self-test builds a synthetic module tree and asserts that the
      # checker still distinguishes live / dead / orphan /
      # benchmark-only modules.
      - name: Self-test the dead-module guard
        run: python tools/check_dead_modules.py --self-test

      # ADR-025: Layout Invariant 4 says the engine reaches a concrete
      # module only through its `plugins::I*` seam, with a named,
      # enumerated set of exemptions.  This check is what makes the
      # invariant enforceable rather than aspirational -- a new
      # concrete `#include` in src/engine/ is one line, and the coupling
      # it creates is not.
      #
      # The same script also enforces the remediation plan §4.3 line
      # budget for the engine's internal state header, which two
      # unrelated features have already pushed back over once each.
      - name: Check the engine's layering against ADR-025
        run: python tools/check_engine_layering.py

      - name: Self-test the engine-layering guard
        run: python tools/check_engine_layering.py --self-test

      # v1.3 plan Q5: the impaired-soak recorder is the thing that
      # decides whether a 24 h run counts as evidence, so it has to be
      # able to fail.  The self-test pins the three verdicts (PASS /
      # FAIL / INCONCLUSIVE), the dirty-tree rule and the 24 h duration
      # bar, against a synthetic evidence file in the temp directory.
      - name: Self-test the impaired-soak recorder
        run: python3 tools/run_soak_impaired.py --self-test

      # v1.3 plan Q7: the hardware-encode recorder decides whether the
      # GPU path counts as evidence, so it has to be able to fail.  The
      # self-test pins the PASS / FAIL / SKIP verdicts and the
      # empty-window rule against a synthetic evidence file in the temp
      # directory.
      - name: Self-test the hardware-encode recorder
        run: python3 tools/run_hardware_e2e.py --self-test

      # The hardware *job* runner (tools/run_hardware_job.py) is the
      # script that replaces the two actions the hardware workflow used
      # to have, and it has to be able to fail too: the evidence
      # publication must not silently lose a record, and the
      # environment merge must not leave two spellings of PATH behind
      # (which would make the child process see whichever one the
      # environment block happened to write last).  The self-test pins
      # both, against a synthetic evidence file in the temp directory.
      - name: Self-test the hardware job runner
        run: python3 tools/run_hardware_job.py --self-test

      # v1.2 Track S / S8: the `Engine::Stats` field reference is a
      # *derived* document.  It is generated from `engine.hpp` by
      # `tools/dump_stats_fields.py`, and this step fails when the file
      # on disk and the header disagree -- which is the only way a
      # stable field set stays true over time: a field added to the
      # header without a line in the reference is caught on the pull
      # request, not six months later by a host whose build broke.
      - name: Check the Engine::Stats field reference against the header
        run: python3 tools/dump_stats_fields.py --check docs/api/stats_field_reference.md

      # The merge gate is a GitHub Ruleset that demands a list of
      # required status checks, and that list has to agree with the set
      # of checks the workflows actually produce.  The two drift apart
      # silently: a required check no workflow produces blocks every
      # merge, forever, with nothing to fix from the PR page, and a
      # check the matrix produces but the gate does not require costs
      # runner time and catches nothing.
      #
      # `windows / fast` is the trap this guard exists for: it comes
      # from `ci-fast.yml`, which does not run on `main`, so requiring
      # it would deadlock the repository.
      - name: Check the merge gate against the CI matrix
        run: python tools/check_ci_ruleset.py --verbose

      - name: Self-test the merge-gate guard
        run: python tools/check_ci_ruleset.py --self-test

      # The CI auto-retry workflow (`ci-retry.yml`) re-runs the jobs
      # that were starved of a runner.  Its safety rests entirely on
      # one distinction: a job that never received a runner is re-run,
      # and a job that ran and failed is left alone.  A classifier that
      # stopped telling those apart would re-run real failures and hide
      # the defect the CI run was for, so the classification is pinned
      # by a self-test.
      - name: Self-test the CI auto-retry classifier
        run: python tools/ci_retry_runner.py --self-test

      # The release body is built by `tools/release_body.py`, which
      # guards against GitHub's 125 000-character release-body limit.
      # The limit was hit for real: the `v1.2.0` body was 364 350
      # characters, GitHub silently truncated it to 124 999, and the
      # publish step then died with `422 Validation Failed`.  A
      # truncation is invisible in the artefact, so the tool's own rules
      # -- the body fits, the `Status:` paragraph survives, no entry is
      # dropped -- are pinned by a self-test.
      - name: Self-test the release-body builder
        run: python tools/release_body.py --self-test

      # The real body for the version being cut must fit.  This is the
      # check that would have caught the `v1.2.0` cut before it
      # produced a broken draft.
      #
      # The version checked is the one **in the CHANGELOG**, not the one
      # in `CMakeLists.txt`.  The tree's own version is `X.Y.(Z+1)-dev`
      # between two releases, and there is no `## [X.Y.(Z+1)-dev]`
      # section to write a body *for* -- asking for one makes the step
      # fail on every post-release tree, for a reason that has nothing
      # to do with the body.  The section that will actually be released
      # next is the most recent `## [X.Y.Z]` heading, and that is what
      # has to fit.
      #
      # `--latest` asks the tool for exactly that section, so the
      # version resolution lives in one place (the tool) rather than
      # being re-derived here and drifting from it.
      - name: Check the release body fits GitHub's limit
        run: python tools/release_body.py --latest --check > /dev/null

      # ADR-026: a `.h` under `src/**/include/` is a promise that a C
      # host can include it.  `sched_c.h` is the first public header
      # that promise is made about, and nothing checked it -- so adding
      # one `#include <string>` would have turned a public C header into
      # something no C compiler accepts, invisibly, until a consumer
      # tried to build against it.
      #
      # The check compiles every such header as C11, in isolation, with
      # a real C compiler.  `--require-compiler` makes a missing
      # compiler a failure rather than a skip: on this runner there
      # always is one, and a silently-skipped check is a check that
      # stopped running.
      - name: Check that the public headers are C-clean
        run: python tools/check_c_clean_headers.py --require-compiler

      - name: Self-test the C-clean guard
        run: python tools/check_c_clean_headers.py --self-test

      # The offline release-signature verifier carries its own Ed25519
      # implementation.  A wrong curve equation or an inverted
      # verification equation makes it reject *valid* release
      # signatures, so the RFC 8032 §7.1 vectors run on every push.
      - name: Self-test the offline release signature verifier
        run: python tools/verify_release_signature.py --self-test

      # The release body reports per-platform 3A content by asking
      # whether a bundle ships the WebRTC APM archives.  That question
      # used to be answered by `tar -tJf ... | grep -q`, which under
      # `set -o pipefail` reports *every* bundle as APM-free: `grep -q`
      # exits on its first match, `tar` dies of SIGPIPE (141), and the
      # pipeline's status is 141.  The published v1.1.0 body carries
      # that false "lib/webrtc_apm/ is absent" claim for the two Linux
      # platforms whose bundles do carry 14 APM members each.
      #
      # `tools/check_bundle_apm.py` replaces the pipeline, and its
      # self-test pins the three verdicts it must keep apart (present /
      # absent / unreadable) *and* fails if the pipeline ever comes back
      # into the workflow.
      - name: Self-test the release-bundle APM guard
        run: python tools/check_bundle_apm.py --self-test

      # The soak collector's whole value is in its evidence, so its
      # streak semantics are pinned by a self-test: five calendar-
      # consecutive green days are a streak of five, a gap or a failing
      # or an inconclusive day ends it, a FAIL behind a later PASS does
      # not make the day red, a day whose every run failed is not green,
      # and a day measured on a tree other than the candidate branch is
      # not green at all.  Without this running on every push, a change
      # to the gate could make the window overstate itself -- and the
      # window is what the release tag waits on.
      - name: Self-test the soak evidence collector
        run: python tools/run_soak.py --self-test

      # The published `.sha256` sidecar is what a reader runs
      # `sha256sum -c` against, and at the v1.3.0 cut three of the four
      # were not in the shape that command accepts.  The gate's rules --
      # a digest, whitespace, and the bare name of the file -- are
      # pinned here so a future edit to the sidecar writer cannot quietly
      # change what the guard accepts.
      - name: Self-test the sha256 sidecar guard
        run: python tools/check_sha256_sidecars.py --self-test

      # The fetcher is how the CI half of the window is read back.  It
      # must not lose a record (a day measured twice keeps both sets)
      # and it must not grow the files it writes (a record that is
      # already there is not written again), or the window it reports
      # would not be the window that was measured.
      - name: Self-test the soak evidence fetcher
        run: python tools/fetch_soak_evidence.py --self-test

      # The sanitizer gate decides whether the sanitizer CI leg fails, so
      # a bug in the gate's own classification is a silent hole in the
      # coverage: a NimRTC finding misfiled as vendored would stop the
      # gate from ever firing.  The self-test pins the classification:
      # an ASan report rooted in our own code is ours, a report rooted in
      # src/third_party is upstream even when our code is on the stack,
      # a data race whose other party is our code is shared, and a test
      # failure that no upstream report explains is a plain failure.
      - name: Self-test the sanitizer gate
        run: python tools/sanitizer_gate.py --self-test

      # Pre-tag guardrail (v1.1 plan Track C, item C3).  These are
      # repo-level facts that no unit test sees and that rot quietly
      # between releases: the SFU track must stay unwired, every public
      # symbol must carry an ADR-015 stability marker, the API version
      # must not carry a pre-release label, every submodule pin must be
      # fetchable from a fresh clone, and the project root must stay
      # free of scratch files.  The script was written for the tag cut
      # but never wired into CI, so a violation could only surface when
      # the release was already being cut.  Running it on every push
      # moves the failure to the push that introduced it.
      #
      # `--final-tag` is deliberately NOT passed here: it requires an
      # empty NIMRTC_API_VERSION_PRE_RELEASE, which is a property of a
      # release tag rather than of ordinary trunk commits.  The release
      # workflow passes it at cut time.
      - name: Release freeze checklist
        run: sh scripts/check-release-freeze.sh

      # The version lives in three places: the public API header, the
      # CMake project() call, and the pinned expectation the version
      # smoke test compares against.  Editing them by hand is how the
      # post-v1.1.0 bump (059cc29) shipped a tree where the header said
      # 1.1.1-dev and the test still said 1.1.0 -- a mismatch that CI
      # could only report as a static_assert failure inside four
      # platform builds, which says nothing about the real cause.
      #
      # tools/bump_version.py is the only supported way to change the
      # version, and it rewrites all three sites together.  This gate
      # checks that they still agree.  It runs here, in the fastest
      # job, so a drift is reported in seconds instead of after four
      # platform builds; --check needs no build and no network.
      - name: Version consistency
        run: python tools/bump_version.py --check

  # ---------------------------------------------------------------------------
  # linux-turn: the reference TURN server's deployment (v1.4 plan N5 / N5-2)
  # ---------------------------------------------------------------------------
  #
  # The reference TURN deployment (`examples/turn-server/`) is the server
  # that makes N1's claim testable: a client told "use TLS" must not be
  # able to fall back to plain TCP.  The deployment is a *deployment* --
  # nothing in it is compiled into the library -- so it has no compiler
  # to catch a mistake in it and no test to catch a mistake in it.
  #
  # Two things guard it, and this leg is the second:
  #
  #   * `tools/check_turn_server.py` (the docs job) checks the files
  #     against coturn's *real* option vocabulary.
  #   * this leg starts a real coturn and checks that it does what the
  #     files say it does.
  #
  # The static check alone is not enough, and the reason is the shape of
  # the failures: **coturn's answer to a misconfigured deployment is to
  # start anyway.**  A missing certificate, a TLS listener on the wrong
  # port, an unreadable key -- each of them leaves a healthy server
  # behind that answers with something that is not TLS.  So the leg
  # asserts the *behaviour*:
  #
  #   * the TLS port completes a TLS handshake that verifies against
  #     the CA `gen-certs.sh` produced;
  #   * a real TURN allocation succeeds over that TLS session, with
  #     coturn's own client (`turnutils_uclient`), and the server log
  #     records the session's cipher;
  #   * the **same client**, pointed at the **same port**, against a
  #     plain TURN server, gets no allocation -- which is the negative
  #     control, and the only thing that makes the positive case mean
  #     something.
  #
  # The control has to be on the *same* port.  A control on a different
  # port would produce a connection error, not a protocol downgrade, and
  # would not catch the defect N1 exists to remove.
  #
  # **Native coturn, not the compose file.**  GitHub's hosted runners
  # have no Docker daemon, so the container path (the developer and
  # archived-evidence path) cannot run here.  This is the shape §5
  # **N5-2** decided.
  #
  # The leg builds nothing: it exercises the deployment, not the
  # library.  That is why it is fast and why it does not belong inside
  # the `linux-gcc` job -- that job's build takes twenty minutes, and a
  # deployment that stops working should be reported in seconds.
  linux-turn:
    name: linux-turn / reference TURN server
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-turn
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # coturn is a *deployment*, not a vendored dependency (v1.4 plan
      # §3 N5): it stays out of src/third_party/ and is installed from
      # the distribution's package.  Ubuntu 22.04 ships coturn 4.5.2,
      # whose option vocabulary is the one the deployment is written
      # against (the compose file pins the newer 4.6.3 image, and the
      # options this leg relies on -- -c, --no-tls, --no-dtls,
      # --listening-port -- have the same meaning in both).
      - name: Install coturn and OpenSSL
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3 4 5; do sudo apt-get install -y coturn openssl && break || { sudo apt-get update; sleep 15; }; done
          turnserver --help 2>&1 | head -1 || true

      # The certificate, the CA and the credential.  `gen-certs.sh` is
      # the deployment's own generator -- the leg uses it rather than
      # an inline openssl invocation, so that a change to the
      # generator is exercised here and not only on a developer's
      # machine.
      - name: Stop the distro's coturn service
        # Ubuntu's coturn package starts a system service on 3478 the
        # moment it is installed.  That service would collide with the
        # deployment's own plain listener, and the collision is a *host*
        # problem, not a deployment defect -- the acceptance run would
        # report "port 3478 is already in use" and the reader would be
        # left looking for a defect in the deployment that is not
        # there.  So the host is put back into a clean state first.
        #
        # The service is *masked*, not just stopped: a masked unit
        # cannot be restarted by anything else on the runner, so the
        # port cannot come back between the two phases of the run.
        run: |
          sudo systemctl stop coturn.service  || true
          sudo systemctl disable coturn.service || true
          sudo systemctl mask coturn.service   || true
          # Belt and braces: an already-running instance is not always
          # owned by systemd (a runner image may have started one by
          # hand), so any leftover turnserver is stopped too.
          sudo pkill -x turnserver || true
          sleep 1
          for port in 3478 5349; do
            if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
              exec 3<&- 3>&-
              echo "port $port is still held after stopping coturn" >&2
              exit 1
            fi
          done

      - name: Generate the TLS material
        # `bash <script>`, not `./<script>`.  The exec bit is recorded in
        # the index (100755), but a script *invoked* by path depends on
        # the checkout's mode surviving, and a Windows contributor with
        # core.fileMode=false cannot set it in their working tree at
        # all.  Calling bash explicitly removes that dependency.  The
        # repository's other shell entry points are invoked the same way
        # (`sh scripts/check-release-freeze.sh`).
        run: bash ./examples/turn-server/gen-certs.sh

      # The leg itself.  It starts and stops coturn twice (the TLS
      # server, then the plain control on the same port) and asserts
      # the behaviour of both.
      #
      # The ports are the ones the deployment uses; they are also
      # overridable so that a runner with a conflicting service can be
      # accommodated without editing the script.
      - name: Run the deployment's acceptance
        env:
          NIMRTC_TURN_TLS_PORT: '5349'
          NIMRTC_TURN_PLAIN_PORT: '3478'
        run: bash ./examples/turn-server/ci-acceptance.sh

      # The logs are the evidence N1 cites ("the TLS handshake is
      # visible in the server log"), so they are uploaded rather than
      # left on the runner.
      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turn-server-logs-${{ github.run_id }}
          path: examples/turn-server/secrets/logs/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux x86_64: GCC on ubuntu-22.04
  # ---------------------------------------------------------------------------
  linux-gcc:
    name: linux-gcc / x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-gcc
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # v1.0+: hard gate — drift = red CI = blocked merge.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python3 scripts/check_api_marker_includes.py

      - name: API freeze — public header manifest
        # The checked-in manifest lists every public header.  The
        # per-symbol scan above checks the *markers*; this checks the
        # *set*.  A count cannot tell a swap from a change: deleting
        # `a.hpp` and adding `b.hpp` in the same PR leaves the count
        # untouched, so CI would stay green while the public surface
        # moved.  ADR-015 calls the surface a contract, and a contract
        # needs the actual list, not its cardinality.
        run: python3 scripts/check_api_manifest.py

      # Ubuntu 22.04 ships CMake 3.22.3; CMakePresets.json uses preset
      # schema v6 which requires CMake ≥ 3.25. Pin a recent cmake via pip.
      - name: Install ninja + Python + X11/PipeWire/EGL dev packages (CMake via pip)
        # The X11, XFixes, PipeWire, VDPAU/EGL, Wayland and XTest packages
        # are the **leaf-adapter** dependencies of video_capture,
        # video_sink and rd_input_inject.  Every one of them is OPTIONAL
        # in the CMake graph: a missing package silently skips a source
        # file, so a leaf that does not compile stays invisible.
        # Installing them here is what makes the "Leaf compile proof"
        # step below meaningful.
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3 4 5; do sudo apt-get install -y ninja-build python3 \
            libx11-dev libxfixes-dev libpipewire-0.3-dev libspa-0.2-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-bin libwayland-egl-backend-dev \
            wayland-protocols \
            libxtst-dev \
            pkg-config && break || { sudo apt-get update; sleep 15; }; done
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Cache CMake + build directory
        uses: actions/cache@v6
        with:
          path: |
            ~/.cmake
            ~/.local/lib/python*/site-packages/cmake
            build
          key: ${{ runner.os }}-cmake-debug-${{ hashFiles('CMakeLists.txt', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's OpenSSL / quictls backend
      # loads it from PEM files, so a self-signed key + certificate pair is
      # written into the build directory here.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        run: python3 scripts/generate_dtls_certs_ci.py
      # NIMRTC_PLUGINS_OPENH264 / NIMRTC_PLUGINS_DAV1D: the real software
      # codecs (remote-desktop plan WP-B).  They are vendored source
      # builds, so the leg proves that the wrappers compile and that the
      # software round-trip tests pass on this platform too.
      - name: Configure
        run: cmake --preset debug -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF -DNIMRTC_INSTALL=ON -DNIMRTC_PLUGINS_OPENH264=ON -DNIMRTC_PLUGINS_DAV1D=ON

      - name: Build
        run: cmake --build --preset debug -j 2

      - name: Test
        run: ctest --preset tests --output-on-failure -j 2

      # Track D downstream proof (Linux): install into a staging dir and
      # build a minimal find_package(NimRTC) consumer against it, so the
      # install rules stay verified on every push — not just on Windows.
      - name: Install + downstream proof
        run: |
          cmake --install build --prefix build/_install/linux-x86_64
          found="$(find build/_install/linux-x86_64 -name NimRTCConfig.cmake -print -quit)"
          test -n "$found" && test -f "$found"
          mkdir -p build/downstream-proof
          cat > build/downstream-proof/main.cpp <<'EOF'
          #include <nimrtc/core/api_version.hpp>
          #include <cstdio>
          int main() {
            std::printf("nimrtc %s\n", NIMRTC_API_VERSION_STRING);
            return 0;
          }
          EOF
          cat > build/downstream-proof/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(nimrtc_downstream_proof LANGUAGES CXX)
          find_package(NimRTC 1.0 REQUIRED)
          add_executable(downstream_proof main.cpp)
          target_link_libraries(downstream_proof PRIVATE nimrtc::engine)
          EOF
          cmake -S build/downstream-proof -B build/downstream-proof/build \
            -DCMAKE_PREFIX_PATH="$PWD/build/_install/linux-x86_64"
          cmake --build build/downstream-proof/build
          ./build/downstream-proof/build/downstream_proof

      - name: Benchmark transport floor (Track A)
        run: |
          python3 tools/benchmark_latency.py --count 1000
          python3 tools/benchmark_dc.py
          python3 tools/benchmark_weaknet.py --count 200 --size 1200

      - name: Benchmark weak network with kernel netem (Linux only)
        run: |
          sudo --preserve-env=PATH bash tools/benchmark_weaknet_netem.sh --count 200 --size 1200

      # The saturated-link benchmark (v1.2 plan item E6).
      #
      # This one is a **gate**, not just a measurement: the wrapper
      # asserts the run's invariants (the saturation was real, the
      # stream survived, the ladder stepped down, the estimator never
      # raised its target on a report that said the link was
      # congested, the offered load tracked the capacity, the ladder
      # recovered, and it did not flap) and exits non-zero when one of
      # them fails.  The AIMD regression guard in particular catches a
      # defect this benchmark itself uncovered: the estimator used to
      # resume its additive increase while the link was still lossy,
      # so the estimate walked back into the wall it had just been
      # throttled away from.
      #
      # The numbers themselves are machine-dependent (the loopback's
      # real RTT and the host's real scheduling jitter), so the *artifact*
      # is uploaded but is not a pass/fail threshold — the invariants
      # are.
      - name: Benchmark saturated link (plan E6)
        run: |
          cmake --build --preset debug --target bench_saturation -j 2
          python3 tools/benchmark_saturation.py --build-dir build --out build/e2e/bench_saturation.json

      # The G2 half of E6: the control plane's latency under a
      # saturated video path.  The invariants are what matter — the
      # media path really was saturated, the control plane reached the
      # profile's rate, its p99 stayed inside the profile's declared
      # budget, every control message arrived, and the two stacks rode
      # different 5-tuples — and the wrapper exits non-zero when one of
      # them fails.
      #
      # The rate invariant is **skipped** on a host without the
      # high-resolution deadline (the binary reports whether it had
      # one): the measured rate is produced by a thread waiting on a
      # deadline, so without it the run would measure the host's timer
      # rather than the transport.  A skip is reported, not hidden.
      - name: Benchmark G2 control plane (plan E6)
        run: |
          cmake --build --preset debug --target bench_control_saturation -j 2
          python3 tools/benchmark_control_saturation.py --build-dir build --out build/e2e/bench_control_saturation.json

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-x86_64-${{ github.run_id }}
          path: |
            build/e2e/bench_latency.json
            build/e2e/bench_dc.json
            build/e2e/bench_weaknet.json
            build/e2e/bench_weaknet_netem.json
            build/e2e/bench_saturation.json
            build/e2e/bench_control_saturation.json
          retention-days: 14

      # E2 — leaf compile proof (docs/plan/v1.2-next-plan.md §3 Track E).
      #
      # The module CMake probes for every Linux backend are *optional*: a
      # missing package silently drops a source file, so this leg stayed
      # green while `x11_capture.cpp`, `x11_cursor.cpp`,
      # `pipewire_capture.cpp`, the EGL renderer path and the XTest
      # injection backend were never compiled on any platform.  The
      # packages installed above make them compileable; this step makes
      # "they compiled" a fact CI asserts, instead of something a reader
      # has to infer from a log.
      - name: Leaf compile proof (Linux adapters)
        run: |
          log=build/leaf-configure.log
          cmake -S . -B build/leaf -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNIMRTC_BUILD_TESTS=OFF \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF \
            -DNIMRTC_INSTALL=OFF > "$log" 2>&1 || { tail -50 "$log"; exit 1; }
          grep -E '^-- (video_capture|  X11 capture|  X11 cursor|  PipeWire capture|  video_sink:|  rd_input_inject:)' "$log" || true
          for needle in \
            "the X11 capture backend is enabled" \
            "the X11 cursor source is enabled" \
            "the PipeWire capture backend is enabled" \
            "NIMRTC_VIDEO_SINK_HAS_EGL=1" \
            "NIMRTC_VIDEO_SINK_HAS_WAYLAND=1" \
            "NIMRTC_VIDEO_SINK_HAS_XDG_SHELL=1" \
            "NIMRTC_VIDEO_SINK_HAS_DMABUF=1" \
            "the XTest injection backend is enabled" \
            "the uinput injection backend is enabled"; do
            grep -qF "$needle" "$log" || {
              echo "::error::leaf compile proof: '$needle' missing from $log"
              exit 1
            }
          done
          cmake --build build/leaf --target nimrtc_video_capture nimrtc_video_sink nimrtc_rd_input_inject -j 2

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-gcc-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # linux-sanitizers: ASan + UBSan + TSan on ubuntu-22.04
  #
  # P0 hardening (2026-11-09): the project had sanitizer *options*
  # (NIMRTC_ASAN / NIMRTC_UBSAN) but no CI leg ever enabled them, so the
  # ~274 std::mutex / ~222 std::atomic in the tree were never checked for
  # data races.  This job is the gate.
  #
  # Two legs in one job (matrix over the preset):
  #   - asan-ubsan : memory errors + undefined behaviour   (GCC)
  #   - tsan.clang : data races                           (Clang compiler-rt)
  #
  # The TSan leg uses Clang's compiler-rt, not GCC's libtsan.  GCC 11's
  # libtsan does not intercept pthread_cond_clockwait(), which libstdc++
  # uses for condition_variable::wait_for() / wait_until() with a
  # steady_clock deadline.  TSan therefore never observes the
  # unlock/relock that happens inside such a wait, keeps believing the
  # thread still owns the mutex, and reports a bogus "double lock of a
  # mutex" for every timed condition-variable wait in the tree (the
  # video_source cadence loop, the SCTP state machine, the ICE consent
  # tracker, ...).  Clang's compiler-rt TSan intercepts it correctly and
  # reports zero findings on the same tree.
  #
  # ASan and TSan are mutually exclusive, so they cannot live in the same
  # build; the presets set the others OFF explicitly and
  # cmake/NimRTCOptions.cmake raises a hard FATAL_ERROR if both end up ON.
  #
  # The sanitizer flags are applied GLOBALLY (add_compile_options /
  # add_link_options) so the vendored third-party static libs are
  # instrumented too and the sanitizer runtime is present in every final
  # link line — a per-target application would produce undefined
  # references to the runtime in the test executables.
  #
  # Vendor code noise: wolfSSL / usrsctp / libjuice / msquic are upstream
  # code and may trip the sanitizers on their own.  Suppressing their
  # reports globally would hide real issues in the code we call into, and
  # failing on every upstream finding would train everyone to ignore the
  # gate.  So tools/sanitizer_gate.py classifies every report by the
  # ownership of its root frame:
  #
  #   owned  : the root frame is in src/ or tests/       -> the job FAILS
  #   vendor : the root frame is in src/third_party/     -> reported only
  #   shared : upstream root, NimRTC is the other party  -> reported only
  #
  # The ctest step is continue-on-error so that a sanitizer abort -- which
  # kills the test binary -- cannot stop the job before the gate has read
  # the log.  The gate step is what decides the outcome of the job: a
  # NimRTC-owned finding fails it, an upstream finding does not.  A test
  # failure that no upstream report explains is a plain test failure and
  # fails the gate too -- the sanitizer build can expose timing bugs the
  # plain build does not.
  # ---------------------------------------------------------------------------
  linux-sanitizers:
    name: linux-sanitizers / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: asan-ubsan
          - preset: tsan.clang
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-sanitizers-${{ matrix.preset }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ninja + clang + Python (CMake via pip)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3 4 5; do sudo apt-get install -y ninja-build clang python3 && break || { sudo apt-get update; sleep 15; }; done
          clang --version
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py --preset ${{ matrix.preset }}

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        run: python3 scripts/generate_dtls_certs_ci.py
      - name: Configure (${{ matrix.preset }})
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF \
            -DNIMRTC_INSTALL=OFF

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} -j 2

      - name: Test (${{ matrix.preset }})
        # continue-on-error: a sanitizer abort kills the test binary, and
        # the gate below still has to read what the sanitizer printed
        # before the job is allowed to end.
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set +e
          ctest --preset tests.${{ matrix.preset }} -j 2 --output-on-failure 2>&1 | tee build/sanitizer-ctest.log
          echo "${PIPESTATUS[0]}" > build/ctest-exit.txt
          exit 0

      - name: Classify the sanitizer findings
        # The gate is the point of this job.  LastTest.log is read as
        # well: ctest only echoes the output of *failing* tests, so a
        # leak report printed by a test that still passed would otherwise
        # never be seen.
        run: |
          python3 tools/sanitizer_gate.py \
            --ctest-status build/ctest-exit.txt \
            build/sanitizer-ctest.log \
            build/Testing/Temporary/LastTest.log

      - name: Upload sanitizer build directory on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-${{ matrix.preset }}-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux fuzzing: libFuzzer over the untrusted-input parsers.
  #
  # Three things run here:
  #
  #   1. The corpus replay driver (`test_fuzz_replay`) — the same
  #      driver that runs in the ordinary test suite.  It replays every
  #      committed seed plus a deterministic mutation set.  This is
  #      the regression floor: a crash libFuzzer finds is committed as
  #      a seed, and the seed keeps being replayed.
  #
  #   2. A short libFuzzer run per target (60 s each, under
  #      ASan+UBSan).  The runs are deliberately short: CI has to be
  #      affordable, and a 60 s run over the committed corpus already
  #      reaches the interesting states that a random byte flip never
  #      would.
  #
  #   3. The crash artefacts are uploaded, so a finding can be
  #      minimised and committed as a seed.
  #
  # Clang is required for `-fsanitize=fuzzer`; the leg installs it
  # explicitly rather than relying on the runner image.
  # ---------------------------------------------------------------------------
  linux-fuzz:
    name: linux-fuzz / clang
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-fuzz
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install clang + ninja
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3 4 5; do sudo apt-get install -y clang ninja-build python3 && break || { sudo apt-get update; sleep 15; }; done
          clang --version

      - name: Install CMake
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        run: python3 scripts/generate_dtls_certs_ci.py
      - name: Configure (clang + fuzzing + sanitizers)
        run: |
          cmake -S . -B build/fuzz \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNIMRTC_FUZZING=ON \
            -DNIMRTC_ASAN=ON \
            -DNIMRTC_UBSAN=ON \
            -DNIMRTC_BUILD_TESTS=ON \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF \
            -DNIMRTC_INSTALL=OFF

      - name: Build
        run: cmake --build build/fuzz -j 2

      - name: Materialise the fuzz corpus
        # The seeds are checked in as *text* (`.hex`), never as binary
        # blobs: binary files review badly, merge badly, and are
        # reproducible from the generator script anyway.  libFuzzer
        # needs raw bytes, so the hex seeds are decoded into a build
        # directory here.
        run: python3 tests/fuzz/tools/make_corpus.py --materialize build/fuzz-corpus

      - name: Replay the committed corpus
        # The replay driver must pass before the fuzzing runs: a seed
        # that already crashes means the corpus was committed without
        # fixing the bug it documents.
        run: ctest --test-dir build/fuzz -R test_fuzz_replay --output-on-failure

      - name: Run libFuzzer (60 s per target)
        # `-runs=0` means "run until the time limit expires"; the
        # time limit is what keeps CI affordable.  A crash makes
        # libFuzzer exit non-zero, which fails the step.
        run: |
          set -e
          mkdir -p build/fuzz-artifacts
          for target in sdp rtp video_payload; do
            echo "::group::fuzz_${target}"
            ASAN_OPTIONS=abort_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./build/fuzz/tests/fuzz/fuzz_${target} \
              -max_total_time=60 \
              -max_len=4096 \
              -artifact_prefix=build/fuzz-artifacts/ \
              "build/fuzz-corpus/${target}"
            echo "::endgroup::"
          done

      - name: Upload fuzzing artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: build/fuzz-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Linux aarch64: GCC on a native arm64 runner
  #
  # ROOT CAUSE (corrected 2026-10-28): the "ARM64 runner pool is
  # unreliable" story in the CHANGELOG was a misdiagnosis.  The label
  # `ubuntu-22.04-arm64` was never a valid GitHub-hosted runner label
  # -- the documented ARM64 labels are `ubuntu-26.04-arm`,
  # `ubuntu-24.04-arm` and `ubuntu-22.04-arm` (see the "Available
  # Images" table in actions/runner-images' README).  A job asking for
  # a label that matches no runner sits in `queued` forever: the
  # check-run stays `queued`, `started_at == created_at`, and
  # `runner_name` stays empty.
  #
  # That is exactly what the historical runs show.  Run #269
  # (#40370283784, 2026-10-26) had an aarch64 job with
  # `labels: [ubuntu-22.04-arm64]` and an empty `runner_name`, while
  # the other three jobs in the same run were allocated a runner within
  # 5 seconds.  Commit 4467cd8's aarch64 check-run sat queued for
  # exactly 24 h (2026-09-11T02:30:03Z -> 2026-09-12T02:30:03Z) and
  # was then cancelled -- the signature of "no runner matches this
  # label", not of "the pool is saturated".  The label was introduced
  # by 4467cd8 (2026-09-11); before it, 21e883f used the valid
  # `ubuntu-22.04-arm`.
  #
  # The label is now `ubuntu-24.04-arm`, which IS in the documented
  # label set, so the leg is a plain hard gate again -- no repository
  # variable, no `if:`.  A queued-forever job blocks the whole run
  # from reaching a terminal state, so keeping an escape hatch is
  # worth it, but the escape hatch must not be the default: the
  # previous `vars.NIMRTC_ARM64_CI` gate meant the 4-platform matrix
  # could never be observed green on a normal push, which is what
  # v1.0-plan.md §3 Gate #8 requires.
  #
  # If this leg ever has to be skipped, use a code change (as
  # 34a6ace / d2152ff did) rather than a variable -- a variable gate
  # makes "is the ARM64 leg actually running?" a question that has to
  # be answered out of band, which is what this register exists to
  # prevent.
  #
  # See `docs/plan/ci-workarounds.md` §4 (W5) for the full record.
  # ---------------------------------------------------------------------------
  linux-aarch64:
    name: linux-gcc / aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-aarch64
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python3 scripts/check_api_marker_includes.py

      - name: API freeze — public header manifest
        # The checked-in manifest lists every public header.  The
        # per-symbol scan above checks the *markers*; this checks the
        # *set*.  A count cannot tell a swap from a change: deleting
        # `a.hpp` and adding `b.hpp` in the same PR leaves the count
        # untouched, so CI would stay green while the public surface
        # moved.  ADR-015 calls the surface a contract, and a contract
        # needs the actual list, not its cardinality.
        run: python3 scripts/check_api_manifest.py

      - name: Install ninja + g++ + Python
        # The runner is a *native* arm64 host, so the cross toolchain is
        # not needed: `cmake/toolchains/aarch64-linux-gnu.cmake` detects
        # `uname -m == aarch64` and uses the system compiler directly
        # (its "native aarch64" branch, which is checked *before* the
        # cross-toolchain probe).  Installing the cross package here
        # would have made the toolchain file pick the cross compiler
        # and point `CMAKE_SYSROOT` at a sysroot the native image does
        # not have.  `g++` (not `g++-aarch64-linux-gnu`) is the native
        # arm64 package on this image.
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && break || sleep 15; done
          for i in 1 2 3 4 5; do sudo apt-get install -y ninja-build python3 g++ && break || { sudo apt-get update; sleep 15; }; done
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Cache CMake + build directory
        uses: actions/cache@v6
        with:
          path: |
            ~/.cmake
            ~/.local/lib/python*/site-packages/cmake
            build
          key: ${{ runner.os }}-cmake-debug.aarch64-${{ hashFiles('CMakeLists.txt', 'cmake/toolchains/aarch64-linux-gnu.cmake', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug.aarch64-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's OpenSSL / quictls backend
      # loads it from PEM files, so a self-signed key + certificate pair is
      # written into the build directory here.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        run: python3 scripts/generate_dtls_certs_ci.py
      - name: Configure
        run: cmake --preset debug.aarch64 -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        run: cmake --build --preset debug.aarch64 -j 2

      - name: Test
        run: ctest --preset tests.aarch64 --output-on-failure -j 2

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-aarch64-${{ github.run_id }}
          path: build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS: Apple Clang on macos-15 (arm64)
  #
  # macos-14 images were retired from GitHub Actions on 2026-11-02
  # (actions/runner-images#15226).  A job that asks for a retired label
  # is never allocated a runner: it stays queued and is then cancelled,
  # which is exactly what every macos-clang job did from 2026-11-06
  # onwards.  macos-15 is the current arm64 image; it ships a newer
  # CMake (3.31.x) and Xcode, so the Apple Clang leg is unaffected.
  # ---------------------------------------------------------------------------
  macos-clang:
    name: macos-clang / arm64
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-macos-clang
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        run: python tools/check_vendor.py

      - name: API freeze — per-symbol classification
        # Every namespace-scope symbol in a public header must carry a
        # NIMRTC_API_STABLE / NIMRTC_API_UNSTABLE marker (ADR-015
        # "Verification").  The scanner exits non-zero when a public
        # symbol is unclassified.  Node ships preinstalled on every
        # GitHub-hosted runner image.
        run: node scripts/api_freeze_scan.js

      - name: API freeze — marker include hygiene
        # A header that *uses* NIMRTC_API_STABLE / UNSTABLE / DEPRECATED
        # must also include <nimrtc/core/api_version.hpp>, otherwise the
        # first consumer to include that header standalone hits MSVC
        # C2079 ("uses undefined struct") instead of a clean error.
        run: python3 scripts/check_api_marker_includes.py

      - name: API freeze — public header manifest
        # The checked-in manifest lists every public header.  The
        # per-symbol scan above checks the *markers*; this checks the
        # *set*.  A count cannot tell a swap from a change: deleting
        # `a.hpp` and adding `b.hpp` in the same PR leaves the count
        # untouched, so CI would stay green while the public surface
        # moved.  ADR-015 calls the surface a contract, and a contract
        # needs the actual list, not its cardinality.
        run: python3 scripts/check_api_manifest.py

      - name: Unused-const gate self-test
        # The gate below only reports what its scanner recognizes.  The
        # self-test pins that behavior: an unused internal-linkage
        # constant must be reported, an external-linkage one must not.
        run: python3 scripts/test_check_unused_const.py

      - name: Unused-const gate (Apple Clang)
        # Clang's -Wunused-const-variable fires on a namespace-scope
        # constant in a .cpp that nothing reads; GCC does not diagnose
        # the same construct, so the defect is invisible on the Windows
        # and Linux builds and only breaks this leg (which compiles with
        # -Werror).  The scanner exits non-zero when it finds one.
        run: python3 scripts/check_unused_const.py .

      # macos-15 ships a modern CMake (3.31.x, ≥ 3.25) but its system
      # Python is not guaranteed to be the version the tooling expects
      # (and a Homebrew `brew update` can burn 10-25 min on a cold tap
      # refresh).  Pin a managed interpreter with actions/setup-python,
      # exactly as the release workflow's macos job does.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Fail fast: detect missing tools before wasting minutes on configure.
      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      - name: Cache CMake + build directory
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CMake
            build
          key: ${{ runner.os }}-cmake-debug.macos-${{ hashFiles('CMakeLists.txt', 'cmake/NimRTCOptions.cmake', 'cmake/NimRTCVendored.cmake', 'cmake/NimRTCTest.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-debug.macos-

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's OpenSSL / quictls backend
      # loads it from PEM files, so a self-signed key + certificate pair is
      # written into the build directory here.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # The helper knows the platform's interpreter name and pip
      # invocation (`python` vs `python3`, and `--user` for the
      # externally-managed PEP 668 Pythons on the Linux and macOS
      # runners).  `cryptography<42` on purpose: 42+ ships a Rust-backed
      # Windows wheel whose `cryptography_rust.dll` is not bundled in the
      # PyPI artefact, so `import cryptography` fails with "DLL load
      # failed while importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        run: python3 scripts/generate_dtls_certs_ci.py
      # NIMRTC_PLUGINS_OPENH264 / NIMRTC_PLUGINS_DAV1D: the real software
      # codecs (remote-desktop plan WP-B).  They are vendored source
      # builds, so the leg proves that the wrappers compile and that the
      # software round-trip tests pass on this platform too.
      - name: Configure
        run: cmake --preset debug.macos -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF -DNIMRTC_PLUGINS_OPENH264=ON -DNIMRTC_PLUGINS_DAV1D=ON

      - name: Build
        run: cmake --build --preset debug.macos -j 2

      - name: Test
        run: ctest --preset tests.macos --output-on-failure -j 2

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-clang-${{ github.run_id }}
          path: build/
          retention-days: 7
