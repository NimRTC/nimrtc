# =============================================================================
# NimRTC continuous integration
#
# Goals (P0 stage):
#   1. Library builds on every supported platform/compiler combo.
#   2. Unit tests (gtest) pass on every combo.
#   3. Loopback-p2p example exits 0 (ICE connectivity smoke test).
#
# Matrix:
#   linux × {gcc, clang}
#   windows × msvc
#   macos × {Intel, Apple Silicon} × Apple Clang
#   linux-aarch64 × gcc (cross-compile via ARM runner; build-only, no test)
#
# Build configuration: CMakePresets.json "debug" family, with
# NIMRTC_BUILD_EXAMPLES=ON so the loopback example target is available.
# =============================================================================

name: ci

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug
  CMAKE_GENERATOR: Ninja

jobs:
  # ---------------------------------------------------------------------------
  # Linux: GCC and Clang on x86_64 ubuntu-22.04
  # ---------------------------------------------------------------------------
  linux:
    name: linux / ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake
          --preset debug
          -DCMAKE_C_COMPILER=$CC
          -DCMAKE_CXX_COMPILER=$CXX
          -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j 2

      - name: Loopback smoke
        working-directory: build
        run: |
          ctest --output-on-failure -R loopback
          # Direct invocation as backup:
          ./examples/loopback-p2p/loopback-p2p

  # ---------------------------------------------------------------------------
  # Windows: MSVC on windows-2022
  # ---------------------------------------------------------------------------
  windows:
    name: windows / msvc
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake
          --preset debug.msvc
          -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j 2

      - name: Test
        working-directory: build
        shell: cmd
        run: ctest --output-on-failure -j 2 -C ${{ env.BUILD_TYPE }}

      - name: Loopback smoke
        working-directory: build
        shell: cmd
        run: |
          ctest --output-on-failure -R loopback -C ${{ env.BUILD_TYPE }}
          examples\loopback-p2p\Debug\loopback-p2p.exe

  # ---------------------------------------------------------------------------
  # macOS: Apple Clang on Intel (macos-13) and Apple Silicon (macos-14)
  # ---------------------------------------------------------------------------
  macos:
    name: macos / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake
          --preset debug.macos
          -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j 2

      - name: Loopback smoke
        working-directory: build
        run: |
          ctest --output-on-failure -R loopback
          ./examples/loopback-p2p/loopback-p2p

  # ---------------------------------------------------------------------------
  # Linux aarch64: build-only smoke (no ICE test in cross-compile)
  # Uses blacksmith-aarch64 hosted runner (free for open-source).
  # ---------------------------------------------------------------------------
  linux-arm:
    name: linux / aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + cross-toolchain (best-effort)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-aarch64-linux-gnu
          # Native gcc is also available on arm64 runners — use it for pure build smoke.

      - name: Configure (native aarch64)
        run: >
          cmake
          --preset debug
          -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build (build-only smoke; cross-runtime not yet supported)
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j 2
