# =============================================================================
# NimRTC continuous integration
#
# Goals (P0 stage):
#   1. Library builds on every supported platform/compiler combo.
#   2. Unit tests (gtest) pass on every combo.
#   3. Loopback-p2p example exits 0 (ICE connectivity smoke test).
#
# Matrix:
#   linux × {gcc, clang}
#   windows × msvc
#   macos × {Intel, Apple Silicon} × Apple Clang
#   linux-aarch64 × gcc (cross-compile via ARM runner; build-only, no test)
#
# Build configuration: CMakePresets.json "debug" family, with
# NIMRTC_BUILD_EXAMPLES=ON so the loopback example target is available.
# =============================================================================

name: ci

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug

jobs:
  # ---------------------------------------------------------------------------
  # Linux: GCC and Clang on x86_64 ubuntu-22.04
  # ---------------------------------------------------------------------------
  linux:
    name: linux / ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug]
        include:
          - compiler: gcc
            preset: debug
          - compiler: clang
            preset: debug.clang
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j 2

      - name: Test
        run: ctest --preset tests --output-on-failure -j 2

      - name: Loopback smoke
        run: |
          set -e
          if [ -x ./build/examples/loopback-p2p/loopback-p2p ]; then
            ./build/examples/loopback-p2p/loopback-p2p
          fi

  # ---------------------------------------------------------------------------
  # Windows: MSVC on windows-2022
  # ---------------------------------------------------------------------------
  windows:
    name: windows / msvc
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install -y ninja

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset debug.msvc -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset debug.msvc -j 2

      - name: Test
        run: ctest --preset tests.msvc --output-on-failure -j 2

      - name: Loopback smoke
        shell: cmd
        run: |
          if exist build\examples\loopback-p2p\Debug\loopback-p2p.exe (
            build\examples\loopback-p2p\Debug\loopback-p2p.exe
          )

  # ---------------------------------------------------------------------------
  # macOS: Apple Clang on Intel (macos-13) and Apple Silicon (macos-14)
  # ---------------------------------------------------------------------------
  macos:
    name: macos / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset debug.macos -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset debug.macos -j 2

      - name: Test
        run: ctest --preset tests.macos --output-on-failure -j 2

      - name: Loopback smoke
        run: |
          set -e
          if [ -x ./build/examples/loopback-p2p/loopback-p2p ]; then
            ./build/examples/loopback-p2p/loopback-p2p
          fi

  # ---------------------------------------------------------------------------
  # Linux aarch64: build-only smoke (no ICE test in cross-compile)
  # Uses GitHub-hosted ARM runner (free for public repos).
  # ---------------------------------------------------------------------------
  linux-arm:
    name: linux / aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (native aarch64 build smoke)
        run: cmake --preset debug -DNIMRTC_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset debug -j 2
