name: hardware

# The v1.3 plan's Q7 (O-6) evidence collector.
#
# The gap Q7 closes is coverage: the standard CI matrix has no
# encoder-capable GPU, so the *hardware* codec path was validated by
# hand.  This workflow runs it on a **self-hosted, GPU-capable** runner
# — the same shape `soak.yml` uses — and files the result as an artifact
# the PR gate can point at.
#
# The chain the job exercises (docs/plan/v1.3-plan.md §3 Q7):
#
#   a frame is captured → encoded by the hardware codec (NVENC /
#   VideoToolbox / VA-API ... the tree's backend table decides) →
#   packetized (STAP-A / FU-A) → carried as RTP → depacketized →
#   decoded → rendered → and the pipeline reported hardware encoding.
#
# Two independent recorders run on the runner:
#
#   1. `tools/run_hardware_e2e.py` — runs `examples/hw-e2e` (the
#      codec-level end-to-end harness), re-derives the green criteria
#      from the archived numbers, and appends a record with the driver
#      stamp and the tree's git provenance;
#   2. `ctest -R test_engine_video_hw_loopback` — the *engine-level*
#      test that drives two `NimRTCEngine`s with `video_codec_backend =
#      "hardware"` and asserts `Stats::video_codec_hardware_accelerated`;
#   3. `ctest -R test_engine_video_hw_h265` — the *engine-level*
#      H.265 parameter-set-switch test (v1.3 plan Q1b), which asserts
#      that a mid-stream resolution change decodes on a warm NVDEC
#      session with no key-frame round-trip.
#
# The record is the evidence.  A run on a runner that has lost its GPU
# is a **SKIPPED** record, and `--require-hardware` makes that a red
# job — a silently missing GPU is exactly the failure mode a
# hardware-evidence job exists to catch.
#
# The job only runs on the self-hosted runner (label `gpu-nvenc`): on a
# hosted runner it would skip, and a green check that means "nothing
# ran" is worse than no check at all.
#
# **There is deliberately no `pull_request` trigger.**  A PR trigger
# would put a job that needs a runner the repository does not have
# onto every hardware-touching PR, and the job would sit *queued*
# forever -- a check that never reports is not a gate, it is a
# decoration.  The trigger is `workflow_dispatch` (the release
# process runs it before cutting `v1.3.0`) plus a weekly `schedule`
# (a driver update on the runner is noticed without a PR).  This is
# the same shape `soak.yml` uses, and for the same reason: an evidence
# collector needs a machine the standard matrix does not have, so it
# is triggered where the machine is, not where the code is.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tree to measure (default: the branch this workflow runs on)'
        required: false
        type: string
  schedule:
    # Weekly, so a driver update on the runner is noticed without a PR.
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-hardware
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The self-hosted, GPU-capable runner.
  # ---------------------------------------------------------------------------
  hw-e2e:
    name: hardware / hw-e2e (self-hosted GPU)
    # The label is the *contract*: a runner without an encoder-capable GPU
    # must not pick this job up.  A hosted runner never matches, so the
    # job stays "queued" rather than pretending to pass.
    runs-on: [self-hosted, windows, gpu-nvenc]
    # Generous, because the vendored trees are the slow part of this
    # job and they are fetched over a link that is not always fast: the
    # largest of them is over 100 MB, and a run that fetched seven of
    # the fourteen in an hour was cancelled here before it ever
    # reached the build.  This is an evidence collector on a
    # self-hosted runner -- it is not a PR gate, and nothing waits on
    # it -- so a long timeout costs nothing but wall-clock, while a
    # short one makes the job unrunnable on the machine it is meant
    # for.
    timeout-minutes: 180
    steps:
      - name: Fetch the repository (with retries)
        # Not `actions/checkout`.  The checkout retries a cut-off
        # transfer three times, which is not enough for a link that
        # drops long ones, and its failure is blunt -- 'Failed to
        # connect to github.com port 443' -- and the job ends there
        # with nothing built and no evidence recorded.
        #
        # So the fetch is done here, with a bounded retry around it.
        # `git init` rather than `git clone`: an init leaves the
        # repository *in place* when the transfer is cut off, so the
        # objects that did arrive stay and the next attempt asks only
        # for the missing ones.  A clone deletes the whole directory
        # on failure, and on this link the first attempt routinely dies
        # with 'early EOF' after ten minutes.
        #
        # The fetch is shallow: the evidence record resolves the commit
        # with `git rev-parse HEAD`, which a shallow fetch answers, and
        # the full history is a large transfer that this link makes
        # very slow.
        #
        # `shell: powershell` -- Windows PowerShell, which every
        # Windows runner has.  This job asked for `pwsh` and the
        # runner answered 'pwsh: command not found': PowerShell 7 is
        # not installed on a self-hosted Windows machine by default --
        # it is on the hosted images, which is why every other
        # workflow in the tree can ask for it.
        shell: powershell
        run: |
          $ref = "${{ inputs.ref || github.sha }}"
          $url = "https://github.com/${{ github.repository }}.git"
          cd $env:GITHUB_WORKSPACE
          if (-not (Test-Path .git)) { git init }
          git remote remove origin 2>$null
          git remote add origin $url
          $attempts = 8
          $ok = $false
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "fetch attempt $i/$attempts"
            git -c http.version=HTTP/1.1 `
                -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=120 `
                fetch --depth 1 --no-tags origin $ref
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            Write-Error "could not fetch $ref in $attempts attempts"
            exit 1
          }
          git checkout --force FETCH_HEAD
          git submodule sync --recursive
        env:
          GIT_TERMINAL_PROMPT: "0"

      - name: Fetch the vendored submodules (with retries)
        # One submodule at a time, each with a bounded retry around it.
        # The step also fails if a submodule ends up *empty*, which is a
        # silent failure the build would only surface much later.
        #
        # The fetch tries the runner's local object cache before the
        # network: '.git/modules' survives from one job to the next --
        # the fetch above cleans the worktree, not the object cache --
        # so on a runner that has been here before, most of the
        # vendored trees are already on disk.
        shell: powershell
        run: |
          python tools/fetch_submodules.py --retries 5
        env:
          PYTHONIOENCODING: utf-8

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Stamp the machine (driver + GPU)
        # The evidence record carries its own stamp; printing it up front
        # keeps the job log self-contained when something goes wrong
        # *before* the harness runs.
        shell: powershell
        run: |
          nvidia-smi --query-gpu=name,driver_version --format=csv

      - name: Configure (NVENC + NVDEC on, examples on)
        shell: powershell
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DNIMRTC_PLUGINS_NVENC=ON `
            -DNIMRTC_PLUGINS_NVDEC=ON `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON

      - name: Build hw-e2e + the engine-level hardware test
        shell: powershell
        run: |
          cmake --build build --config Release -j --target hw-e2e test_engine_video_hw_loopback test_engine_video_hw_h265

      - name: The codec-level end-to-end run (recorded evidence)
        id: hw_e2e
        shell: powershell
        run: |
          # The binary was built above, so no `--build` here: the tool
          # would otherwise re-configure `build/` without the module
          # options this job set, and under a different configuration.
          # `--require-hardware`: a runner that lost its GPU must fail
          # here, not skip — this job exists to prove the GPU path ran.
          python tools/run_hardware_e2e.py --require-hardware `
            --binary build/examples/Release/hw-e2e.exe `
            --config Release
        env:
          PYTHONIOENCODING: utf-8

      - name: The engine-level hardware test
        # ctest's exit code is the verdict: the test skips only when the
        # host has no hardware encoder, which `--require-hardware` above
        # has already turned into a failure — so a green ctest here means
        # the engine ran the pinned hardware path end to end.
        shell: powershell
        run: |
          ctest --test-dir build -C Release -R "test_engine_video_hw_loopback|test_engine_video_hw_h265" `
            --output-on-failure

      - name: Surface the evidence summary
        if: always()
        shell: powershell
        run: |
          # Write the summary into the Step Summary so the run page shows
          # the window (driver, ref, verdict) without downloading the
          # artifact.  `--days 0` keeps the window to *today*, i.e. this
          # run's record: a stale record from an earlier job must not be
          # what the page shows.
          python tools/run_hardware_e2e.py --summary --days 0 |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardware-evidence-${{ github.run_id }}
          path: build/hardware/*.jsonl
          retention-days: 365
          if-no-files-found: error
