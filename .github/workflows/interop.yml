# =============================================================================
# NimRTC e2e acceptance CI — Windows MSVC
#
# Multi-platform build is covered by `ci.yml`. This workflow is the e2e
# smoke and acceptance suite (unit tests + Chrome interop) on Windows only,
# because the Playwright/Chrome harness is Windows-primary at v0.9 RC.
#
# What runs:
#   1. configure            — `cmake --preset dev.msvc`
#   2. build                — `cmake --build`
#   3. unit tests           — `ctest --preset tests`
#   4. e2e acceptance       — `python tools/run_e2e_acceptance.py`
#                             (Cases A/B/C expected PASS; Case D
#                              EXPECTED FAIL until Chrome DTLS server
#                              flight is fully verified — see CHANGELOG.md)
# =============================================================================

name: ci-e2e

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows MSVC: configure + build + unit tests
  # ---------------------------------------------------------------------------
  windows-build:
    name: windows / build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # Pre-1.0: warn-only so e2e is not blocked.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        continue-on-error: true
        shell: pwsh
        run: python tools/check_vendor.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Run unit tests
        shell: pwsh
        run: ctest --preset tests --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows MSVC: end-to-end acceptance (NimRTC↔NimRTC + NimRTC↔Chrome)
  # ---------------------------------------------------------------------------
  windows-e2e:
    name: windows / e2e acceptance
    runs-on: windows-2022
    timeout-minutes: 30
    # Skip on draft PRs; full e2e is slow (~1min per case)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        continue-on-error: true
        shell: pwsh
        run: python tools/check_vendor.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Install Python deps for e2e
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets playwright
          python -m playwright install chromium

      - name: Run e2e acceptance
        id: e2e
        shell: pwsh
        # All four cases (A/B/C/D) are expected to PASS at HEAD now that
        # the Case D DTLS↔Chrome alert 46 is fixed (see CHANGELOG.md
        # "Fixed — Chrome interop: fatal alert 46"). A failure in any
        # case therefore fails the job, instead of the prior
        # `|| true` + step-summary workaround.
        #
        # The fix/windows-dll-boundary branch has a known wolfSSL 5.9.2
        # fragment-reassembly bug that blocks the Chrome DTLS server
        # handshake regardless of the DTLS 1.2 force-pin landed in
        # commit 36ee838.  We set NIMRTC_SKIP_CASE_D=1 only on that
        # branch so the rest of the e2e suite (Cases A/B/C + build) is
        # still exercised.  All other branches (main, every other
        # feat/** / fix/** / chore/**) still run Case D normally.
        env:
          NIMRTC_SKIP_CASE_D: ${{ github.ref == 'refs/heads/fix/windows-dll-boundary' && '1' || '0' }}
        run: |
          python tools/run_e2e_acceptance.py 2>&1 | Tee-Object -FilePath build/e2e/orchestrator_ci.log
          $rc = $LASTEXITCODE
          echo "rc=$rc" >> $env:GITHUB_OUTPUT
          exit $rc

      - name: Surface case-D status in Step Summary
        if: always()
        shell: pwsh
        run: |
          $skip = $env:NIMRTC_SKIP_CASE_D -eq '1'
          # NOTE: Use single-quoted strings here so PowerShell does NOT
          # interpret backticks (the backquote char) as escape characters.
          # The else branch previously used backtick-escaped double quotes
          # which made PowerShell 5.1 on the GHA windows-2022 runner throw
          # a parser error on the backtick-before-paren sequence.
          # Single-quoted strings are literal; only '' is the escape,
          # and we don't need it here.
          if ($skip) {
            $caseDLine = 'Case D is **SKIPPED** on this branch (NIMRTC_SKIP_CASE_D=1) because of a known wolfSSL 5.9.2 fragment-reassembly bug. Tracked under `docs/plan/dtls_chrome_interop_review.md`. Cases A/B/C still run and gate the job.'
          } else {
            $caseDLine = 'Case D (NimRTC<->real Chrome DTLS handshake) is expected to PASS. The Case D certificate_unknown alert that blocked 0.9.0-rc1 is fixed (see CHANGELOG.md "Fixed - Chrome interop: fatal alert 46").'
          }
          $summary = @"
          ## E2E acceptance summary
          Case A (BCrypt AES-GCM round-trip), Case B (in-process DTLS),
          Case C (NimRTC<->NimRTC loopback) are always expected to PASS.

          $caseDLine
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: build/e2e/
          retention-days: 14
