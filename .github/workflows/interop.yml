# =============================================================================
# NimRTC e2e acceptance CI — Windows MSVC
#
# Multi-platform build is covered by `ci.yml`. This workflow is the e2e
# smoke and acceptance suite (unit tests + Chrome interop) on Windows only,
# because the Playwright/Chrome harness is Windows-primary at v0.9 RC.
#
# What runs:
#   1. configure            — `cmake --preset dev.msvc`
#   2. build                — `cmake --build`
#   3. unit tests           — `ctest --preset tests`
#   4. e2e acceptance       — `python tools/run_e2e_acceptance.py`
#                             (Cases A/B/C expected PASS; Case D
#                              EXPECTED FAIL until Chrome DTLS server
#                              flight is fully verified — see CHANGELOG.md)
# =============================================================================

name: ci-e2e

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows MSVC: configure + build + unit tests
  # ---------------------------------------------------------------------------
  windows-build:
    name: windows / build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # Pre-1.0: warn-only so e2e is not blocked.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        continue-on-error: true
        shell: pwsh
        run: python tools/check_vendor.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's SChannel backend loads the
      # certificate from the Windows certificate store, so the certificate is
      # created and installed here; its SHA-1 thumbprint is written to
      # build/wtserver_hash.txt, which the listener reads at startup.
      - name: Provision WebTransport TLS material
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File ./scripts/generate_wtserver_cert.ps1 `
            -BuildDir "${{ github.workspace }}/build"

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      # NB: use the `tests.msvc` preset (NOT `tests`) so that
      # `configuration: "Debug"` propagates to `ctest --build-config Debug`.
      # The `tests` preset is the Linux single-config variant and has no
      # `configuration` field; with the VS multi-config generator +
      # `gtest_discover_tests(PRE_TEST)`, an empty `CTEST_CONFIGURATION_TYPE`
      # causes `${CTEST_CONFIGURATION_TYPE}` to substitute to `` -1.1``
      # inside the auto-generated `<target>[N]_include.cmake` dispatcher,
      # which then tries to include the non-existent
      # `<target>[N]_include-.cmake` and aborts ctest before any
      # gtest binary is invoked.  Failure mode surfaces as
      # `Errors while running CTest` with no test results, even though
      # the build itself succeeds.  See run #231 onwards in the
      # ci-e2e history for the regression chain.
      - name: Run unit tests
        shell: pwsh
        run: ctest --preset tests.msvc --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows MSVC: end-to-end acceptance (NimRTC↔NimRTC + NimRTC↔Chrome)
  # ---------------------------------------------------------------------------
  windows-e2e:
    name: windows / e2e acceptance
    runs-on: windows-2022
    timeout-minutes: 30
    # Skip on draft PRs; full e2e is slow (~1min per case)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        continue-on-error: true
        shell: pwsh
        run: python tools/check_vendor.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Install Python deps for e2e
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets playwright
          python -m playwright install chromium

      - name: Run e2e acceptance
        id: e2e
        shell: pwsh
        # All four cases (A/B/C/D) are expected to PASS at HEAD now that
        # the Case D DTLS↔Chrome alert 46 is fixed (see CHANGELOG.md
        # "Fixed — Chrome interop: fatal alert 46"). A failure in any
        # case therefore fails the job, instead of the prior
        # `|| true` + step-summary workaround.
        #
        # The fix/windows-dll-boundary branch has a known wolfSSL 5.9.2
        # fragment-reassembly bug that blocks the Chrome DTLS server
        # handshake regardless of the DTLS 1.2 force-pin landed in
        # commit 36ee838.  We set NIMRTC_SKIP_CASE_D=1 only on that
        # branch so the rest of the e2e suite (Cases A/B/C + build) is
        # still exercised.  All other branches (main, every other
        # feat/** / fix/** / chore/**) still run Case D normally.
        env:
          NIMRTC_SKIP_CASE_D: ${{ github.ref == 'refs/heads/fix/windows-dll-boundary' && '1' || '0' }}
        run: |
          python tools/run_e2e_acceptance.py 2>&1 | Tee-Object -FilePath build/e2e/orchestrator_ci.log
          $rc = $LASTEXITCODE
          echo "rc=$rc" >> $env:GITHUB_OUTPUT
          exit $rc

      - name: Surface case-D status in Step Summary
        if: always()
        shell: pwsh
        # The summary text is generated by tools/run_e2e_acceptance.py
        # (which sees the same NIMRTC_SKIP_CASE_D env var the orchestrator
        # saw) and written to build/e2e/case_d_summary.md.  This step
        # only copies that file into $GITHUB_STEP_SUMMARY.  The earlier
        # inline PowerShell if/else interpolation of $caseDLine tripped
        # a PowerShell 5.1 parser error on the backtick-before-paren
        # sequence on the windows-2022 runner.  Pushing the string
        # composition into Python — which has no special meaning for
        # backticks in single-quoted strings — eliminates that failure
        # mode entirely, and the workflow now contains no string
        # literals that PowerShell would need to parse.
        run: |
          if (Test-Path build/e2e/case_d_summary.md) {
            Get-Content build/e2e/case_d_summary.md -Raw `
              | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (
              "## E2E acceptance summary`n" +
              "(case_d_summary.md missing - orchestrator did not run)"
            )
          }

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}
          path: build/e2e/
          retention-days: 14
