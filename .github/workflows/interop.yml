# =============================================================================
# NimRTC CI — Windows MSVC only (0.9.0-rc1)
#
# PLATFORM NOTE: This RC has only been validated on Windows 10 / MSVC.
# Linux and macOS runners are intentionally NOT used here because we have
# no Windows-validated signal that the build works elsewhere. Adding
# Linux/macOS jobs would silently produce false-positive green ticks.
# Cross-platform CI is a post-1.0 task.
#
# What runs:
#   1. configure            — `cmake --preset dev.msvc`
#   2. build                — `cmake --build`
#   3. unit tests           — `ctest --preset tests`
#   4. e2e acceptance       — `python tools/run_e2e_acceptance.py`
#                             (Cases A/B/C expected PASS; Case D
#                              EXPECTED FAIL until Chrome DTLS server
#                              flight is fully verified — see CHANGELOG.md)
# =============================================================================

name: ci

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows MSVC: configure + build + unit tests
  # ---------------------------------------------------------------------------
  windows-build:
    name: windows / build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset dev.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Run unit tests
        shell: pwsh
        run: ctest --preset tests --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows MSVC: end-to-end acceptance (NimRTC↔NimRTC + NimRTC↔Chrome)
  # ---------------------------------------------------------------------------
  windows-e2e:
    name: windows / e2e acceptance
    runs-on: windows-2022
    # Skip on draft PRs; full e2e is slow (~1min per case)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset dev.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Install Python deps for e2e
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets playwright
          python -m playwright install chromium

      - name: Run e2e acceptance
        shell: pwsh
        run: python tools/run_e2e_acceptance.py
        # NOTE: case_d_chrome is expected to FAIL at HEAD until the
        # DTLS↔Chrome server-flight issue is fixed. The orchestrator
        # returns non-zero overall, but per-case logs in build/e2e/ are
        # the diagnostic artifact. Re-enable `set -e` style failure
        # once Chrome DTLS interop is verified end-to-end.

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: build/e2e/
          retention-days: 14
