# =============================================================================
# NimRTC e2e acceptance CI — Windows MSVC
#
# Multi-platform build is covered by `ci.yml`. This workflow is the e2e
# smoke and acceptance suite (unit tests + Chrome interop) on Windows only,
# because the Playwright/Chrome harness is Windows-primary at v0.9 RC.
#
# What runs:
#   1. configure            — `cmake --preset dev.msvc`
#   2. build                — `cmake --build`
#   3. unit tests           — `ctest --preset tests`
#   4. e2e acceptance       — `python tools/run_e2e_acceptance.py`
#                             (Cases A/B/C expected PASS; Case D
#                              EXPECTED FAIL until Chrome DTLS server
#                              flight is fully verified — see CHANGELOG.md)
# =============================================================================

name: ci-e2e

on:
  # Same split as `ci.yml`: the e2e suite runs on `main`, on the release
  # branches, and on every PR that targets `main`.  Working-branch
  # pushes get the fast leg (`ci-fast.yml`) instead.
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows MSVC: configure + build + unit tests
  # ---------------------------------------------------------------------------
  windows-build:
    name: windows / build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # v1.0+: hard gate.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        shell: pwsh
        run: python tools/check_vendor.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's SChannel backend loads the
      # certificate from the Windows certificate store, so the certificate is
      # created and installed here; its SHA-1 thumbprint is written to
      # build/wtserver_hash.txt, which the listener reads at startup.
      - name: Provision WebTransport TLS material
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File ./scripts/generate_wtserver_cert.ps1 `
            -BuildDir "${{ github.workspace }}/build"

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # `cryptography<42` on purpose: 42+ ships a Rust-backed Windows wheel
      # whose `cryptography_rust.dll` is not bundled in the PyPI artefact,
      # so `import cryptography` fails with "DLL load failed while
      # importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        shell: pwsh
        run: |
          python -m pip install --upgrade "cryptography<42"
          python scripts/build_dtls_cert.py

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      # NB: use the `tests.msvc` preset (NOT `tests`) so that
      # `configuration: "Debug"` propagates to `ctest --build-config Debug`.
      # The `tests` preset is the Linux single-config variant and has no
      # `configuration` field; with the VS multi-config generator +
      # `gtest_discover_tests(PRE_TEST)`, an empty `CTEST_CONFIGURATION_TYPE`
      # causes `${CTEST_CONFIGURATION_TYPE}` to substitute to `` -1.1``
      # inside the auto-generated `<target>[N]_include.cmake` dispatcher,
      # which then tries to include the non-existent
      # `<target>[N]_include-.cmake` and aborts ctest before any
      # gtest binary is invoked.  Failure mode surfaces as
      # `Errors while running CTest` with no test results, even though
      # the build itself succeeds.  See run #231 onwards in the
      # ci-e2e history for the regression chain.
      - name: Run unit tests
        shell: pwsh
        run: ctest --preset tests.msvc --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows MSVC: end-to-end acceptance (NimRTC↔NimRTC + NimRTC↔Chrome)
  # ---------------------------------------------------------------------------
  windows-e2e:
    name: windows / e2e acceptance
    runs-on: windows-2022
    timeout-minutes: 30
    # Skip on draft PRs; full e2e is slow (~1min per case).
    # NOTE: the pre-v1.0 condition `github.event_name == 'pull_request' && ...`
    # evaluated to false on push events, silently skipping e2e on every main
    # push (incl. the v1.0.0 tag cut). Run on push AND on non-draft PRs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Vendor manifest drift gate (Phase 4 of docs/plan/vendor-migration.md).
      # v1.0+: hard gate.
      - name: Verify vendor manifests
        if: hashFiles('src/third_party/vendor.json') != ''
        shell: pwsh
        run: python tools/check_vendor.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The Chrome-friendly DTLS cert pair is a BUILD ARTEFACT, not a
      # checked-in file: `tests/wolfssl_dtls/certs/` is gitignored
      # (`.gitignore:227`).  A fresh checkout therefore has neither
      # `server-ecc.pem` nor `ecc-key.pem`, and CMake's
      # `nimrtc_copy_wolfssl_certs()` POST_BUILD step copies them
      # unconditionally -- so without this step the build fails with
      # "Error copying file (if different) from .../ecc-key.pem".
      #
      # It used to work in CI because the pair came from wolfSSL's own cert
      # tree (upstream tracks `certs/ecc-key.pem`), but the pair has moved
      # out of the vendored submodule -- a build artefact must not dirty a
      # vendored dependency's tracked files.
      #
      # `cryptography<42` on purpose: 42+ ships a Rust-backed Windows wheel
      # whose `cryptography_rust.dll` is not bundled in the PyPI artefact,
      # so `import cryptography` fails with "DLL load failed while
      # importing _rust".  41.x is the last pure-C line.
      - name: Generate the DTLS test certificate pair
        shell: pwsh
        run: |
          python -m pip install --upgrade "cryptography<42"
          python scripts/build_dtls_cert.py

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_BUILD_TESTS=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      # The WebTransport server seam (Case E) needs a TLS certificate to
      # complete the QUIC handshake.  msquic's SChannel backend loads the
      # certificate from the Windows certificate store, so the certificate is
      # created and installed here; its SHA-1 thumbprint is written to
      # build/wtserver_hash.txt, which the listener reads at startup.  The
      # certificate's SPKI SHA-256 is written to build/wtserver_spki.b64
      # next to it, and the browser is told to trust exactly that public
      # key (see the Case E step below).
      #
      # This step lives in the `windows-e2e` job (not in `windows-build`)
      # because the certificate has to be trusted by the machine that runs
      # the *browser*, and the browser only runs in this job.  The
      # `windows-build` job has its own copy of the step because it runs
      # the unit tests, and one of them starts `demo-wtserver`.
      - name: Provision WebTransport TLS material
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File ./scripts/generate_wtserver_cert.ps1 `
            -BuildDir "${{ github.workspace }}/build"

      - name: Install Python deps for e2e
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets playwright
          python -m playwright install chromium

      - name: Run e2e acceptance
        id: e2e
        shell: pwsh
        # All four cases (A/B/C/D) are expected to PASS at HEAD now that
        # the Case D DTLS↔Chrome alert 46 is fixed (see CHANGELOG.md
        # "Fixed — Chrome interop: fatal alert 46"). A failure in any
        # case therefore fails the job, instead of the prior
        # `|| true` + step-summary workaround.
        #
        # The fix/windows-dll-boundary branch has a known wolfSSL 5.9.2
        # fragment-reassembly bug that blocks the Chrome DTLS server
        # handshake regardless of the DTLS 1.2 force-pin landed in
        # commit 36ee838.  We set NIMRTC_SKIP_CASE_D=1 only on that
        # branch so the rest of the e2e suite (Cases A/B/C + build) is
        # still exercised.  All other branches (main, every other
        # feat/** / fix/** / chore/**) still run Case D normally.
        env:
          NIMRTC_SKIP_CASE_D: ${{ github.ref == 'refs/heads/fix/windows-dll-boundary' && '1' || '0' }}
        run: |
          python tools/run_e2e_acceptance.py 2>&1 | Tee-Object -FilePath build/e2e/orchestrator_ci.log
          $rc = $LASTEXITCODE
          echo "rc=$rc" >> $env:GITHUB_OUTPUT
          exit $rc

      # ---------------------------------------------------------------------
      # Case E — Chrome ↔ NimRTC interop (DTLS plane + WebTransport plane)
      # ---------------------------------------------------------------------
      #
      # Case E is a SEPARATE step because it needs the WebTransport TLS
      # material, and because the orchestrator's `--case=all` deliberately
      # excludes it (the orchestrator's "all" is the four NimRTC↔NimRTC /
      # NimRTC↔Chrome cases A/B/C/D; Case E is the explicit-interop pair).
      #
      # Why it is an ASSERTION and not a "provisioned but never run" step:
      # until now the workflow generated the WebTransport certificate and
      # then never executed Case E, so a broken Chrome interop could not
      # fail CI.  It now runs both planes and fails the job on either.
      #
      # The certificate: `scripts/generate_wtserver_cert.ps1` puts the
      # self-signed certificate into Cert:\CurrentUser\My (where msquic
      # loads it) and writes the certificate's SPKI SHA-256 next to it.
      # The harness hands that hash to Chrome via
      # --ignore-certificate-errors-spki-list, which is what makes Chrome
      # accept the server: without it Chrome rejects the handshake with
      # alert 46 (QUIC_TLS_CERTIFICATE_UNKNOWN), and the case has failed
      # every time it was run -- see docs/interop/chrome-interop-results.md.
      #
      # Deliberately NOT done here: installing the certificate into
      # Cert:\CurrentUser\Root.  That call HANGS on a non-interactive
      # runner (the protected-root prompt cannot be answered), and it
      # would change the trust decisions of every other program on the
      # machine for a test certificate's lifetime.
      - name: Run Case E interop (DTLS + WebTransport)
        id: case_e
        shell: pwsh
        run: |
          python tools/run_e2e_acceptance.py --case=e 2>&1 |
            Tee-Object -FilePath build/e2e/case_e_dtls_ci.log
          $rc1 = $LASTEXITCODE
          python tools/run_e2e_acceptance.py --case=e_webtransport 2>&1 |
            Tee-Object -FilePath build/e2e/case_e_wt_ci.log
          $rc2 = $LASTEXITCODE
          if ($rc1 -ne 0 -or $rc2 -ne 0) {
            Write-Output "Case E failed: dtls=$rc1 webtransport=$rc2"
            exit 1
          }
          Write-Output "Case E passed: dtls=$rc1 webtransport=$rc2"
          exit 0

      - name: Surface case-D status in Step Summary
        if: always()
        shell: pwsh
        # The summary text is generated by tools/run_e2e_acceptance.py
        # (which sees the same NIMRTC_SKIP_CASE_D env var the orchestrator
        # saw) and written to build/e2e/case_d_summary.md.  This step
        # only copies that file into $GITHUB_STEP_SUMMARY.  The earlier
        # inline PowerShell if/else interpolation of $caseDLine tripped
        # a PowerShell 5.1 parser error on the backtick-before-paren
        # sequence on the windows-2022 runner.  Pushing the string
        # composition into Python — which has no special meaning for
        # backticks in single-quoted strings — eliminates that failure
        # mode entirely, and the workflow now contains no string
        # literals that PowerShell would need to parse.
        run: |
          if (Test-Path build/e2e/case_d_summary.md) {
            Get-Content build/e2e/case_d_summary.md -Raw `
              | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (
              "## E2E acceptance summary`n" +
              "(case_d_summary.md missing - orchestrator did not run)"
            )
          }

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}
          path: build/e2e/
          retention-days: 14
