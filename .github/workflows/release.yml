      - name: Install into staging dir + bundle
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          staging="build/_install/linux-aarch64"
          cmake --install build --prefix "$staging"
          # BSD-3-Clause / Apache-2.0 obligations travel with the binary.
          python3 tools/collect_licenses.py --staging "$staging"
          tar -C "$staging" -cJf "build/nimrtc-${version}-linux-aarch64-gcc.tar.xz" .
          # Sanity guard: a correct bundle is a few MB.  A bundle that grew
          # to hundreds of MB means the wrong directory was archived (that
          # is exactly what happened to the v1.0.1 Windows asset) — fail
          # the release here instead of publishing it.
          size=$(stat -c%s "build/nimrtc-${version}-linux-aarch64-gcc.tar.xz")
          if [ "$size" -gt 67108864 ]; then
            echo "::error::bundle is $size bytes — refusing to publish"
            exit 1
          fi
          # Strip the `build/` prefix -- see the linux-gcc job above for
          # why `sha256sum -c` needs the basename.
          sha256sum "build/nimrtc-${version}-linux-aarch64-gcc.tar.xz" \
            | awk '{print $1"  "substr($2,index($2,"/")+1)}' \
