      # `tools/build_webrtc_apm.sh` to produce the prebuilt static lib so
      # the cmake configure step below succeeds with the default
      # NIMRTC_VENDORED_WEBRTC_APM=ON contract documented in
      # docs/zh/architecture.md §11.5.5.
      - name: Install meson (for WebRTC APM prebuild)
        shell: bash
        run: |
          python3 -m pip install --user --quiet "meson>=1.10"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # W3 (flipped 2026-11-06): the meson prebuild of
      # webrtc_audio_processing is known-good on the linux runners (it
      # succeeded on all four legs of the final `v1.0.2` release run),
      # so the step is a HARD GATE here: the real WebRTC APM 3A
      # (AEC/ANS/AGC) is always bundled, and a prebuild regression
      # aborts the cut instead of silently shipping the stub 3A path.
      - name: Prebuild WebRTC APM
        id: apm_prebuild
        shell: bash
        run: PATH="$HOME/.local/bin:$PATH" python3 tools/fetch_webrtc_apm.py

      - name: Configure
        shell: bash
        run: |
          # W3 (flipped 2026-11-06): the APM prebuild is a hard gate, so
          # the mode is pinned to ON — there is no degraded fallback
          # branch any more.
          apm="ON"
          echo "WebRTC APM (3A) bundled in this bundle: $apm"
          cmake --preset release.aarch64 \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_BUILD_TESTS=OFF \
            -DNIMRTC_VENDORED_WEBRTC_APM:BOOL=ON \
            -DNIMRTC_INSTALL=ON
          echo "3a=$apm" > build/3a-status-linux-aarch64.txt

      - name: Build
        shell: bash
