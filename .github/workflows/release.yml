  build-macos-clang:
    name: release / build / macos-clang
    needs: preflight
    # macos-14 images were retired from GitHub Actions on 2026-11-02
    # (actions/runner-images#15226); a job asking for that label never
    # gets a runner.  macos-15 is the current arm64 image.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.preflight.outputs.release_tag }}

      # macos-15 runners ship Python 3.12 + xz-utils pre-installed, but
      # the system Python 3 is "externally managed" (PEP 668) and
      # `brew update && brew install python@3.12 xz` is slow enough
      # (10-25 min cold-tap refresh on first run) to push the whole
      # job past 30 min. Pin a managed Python 3.12 via
      # actions/setup-python@v5 (1-2 min, no Homebrew), and use the
      # system `tar -cJf` / `xz` for bundling (macOS userland ships
      # `/usr/bin/tar` with `-J` support and `/usr/bin/xz`).
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # WebRTC APM is built out-of-tree with meson (upstream doesn't ship a
      # CMakeLists.txt). Run `tools/fetch_webrtc_apm.py` to clone +
      # `tools/build_webrtc_apm.sh` to produce the prebuilt static lib so
      # the cmake configure step below succeeds with the default
      # NIMRTC_VENDORED_WEBRTC_APM=ON contract documented in
      # docs/zh/architecture.md §11.5.5.
      # actions/setup-python@v5 above pins a managed Python 3.12 that
      # is NOT "externally managed" (PEP 668), so a plain
      # `python3 -m pip install --user` works without
      # `--break-system-packages` and without going through Homebrew
      # (which can take 5+ min on a cold tap refresh on macos-15
      # runners). Mirror the linux-gcc / windows pattern.
      # NOTE: the user-site scripts dir (here
      # `/Users/runner/Library/Python/3.12/bin`) is NOT on PATH for
      # this same step — `$GITHUB_PATH` is only honored by the runner
      # in *subsequent* steps. So the sanity-check below invokes
      # `meson` via the absolute path rather than relying on the PATH
      # rewrite. The `$GITHUB_PATH` line still runs so that the
      # Configure / Build / Bundle steps (which all run after this
      # one) can find `meson` on PATH.
      - name: Install meson (for WebRTC APM prebuild)
        shell: bash
        run: |
          python3 -m pip install --user --quiet "meson>=1.10"
          user_scripts=$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts", scheme="posix_user"))')
          echo "[+] user scripts dir: $user_scripts"
          echo "$user_scripts" >> "$GITHUB_PATH"
          if [ ! -x "$user_scripts/meson" ]; then
            echo "::error::meson not found at $user_scripts/meson after install"
            python3 -m meson --version 2>/dev/null || true
            exit 1
          fi
          "$user_scripts/meson" --version

      # W3 (flipped 2026-11-06): see the comment on the linux-gcc job
      # above.  The step is a HARD GATE — the macos prebuild uses the
      # system `python3` (the meson install step above already put a
      # managed 3.12 on PATH for later steps), and a failure aborts the
      # cut instead of shipping the stub 3A path.
      - name: Prebuild WebRTC APM
        id: apm_prebuild
        shell: bash
        run: python3 tools/fetch_webrtc_apm.py

      - name: Configure
        shell: bash
        run: |
          # W3 (flipped 2026-11-06): the APM prebuild is a hard gate, so
          # the mode is pinned to ON — there is no degraded fallback
          # branch any more.
          apm="ON"
          echo "WebRTC APM (3A) bundled in this bundle: $apm"
          cmake --preset release.macos \
            -DNIMRTC_BUILD_EXAMPLES=OFF \
            -DNIMRTC_BUILD_TESTS=OFF \
            -DNIMRTC_VENDORED_WEBRTC_APM:BOOL=ON \
            -DNIMRTC_INSTALL=ON
          echo "3a=$apm" > build/3a-status-macos-arm64.txt

      - name: Build
        shell: bash
        run: cmake --build build -j 2

      - name: Install into staging dir + bundle
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          staging="build/_install/macos-arm64"
          cmake --install build --prefix "$staging"
          # BSD-3-Clause / Apache-2.0 obligations travel with the binary.
          python3 tools/collect_licenses.py --staging "$staging"
          tar -C "$staging" -cJf "build/nimrtc-${version}-macos-arm64-clang.tar.xz" .
          # Sanity guard: a correct bundle is a few MB.  A bundle that grew
          # to hundreds of MB means the wrong directory was archived (that
          # is exactly what happened to the v1.0.1 Windows asset) — fail
          # the release here instead of publishing it.
          size=$(stat -f%z "build/nimrtc-${version}-macos-arm64-clang.tar.xz")
          if [ "$size" -gt 67108864 ]; then
            echo "::error::bundle is $size bytes — refusing to publish"
            exit 1
          fi
          # macOS / BSD userland does not ship GNU coreutils' `sha256sum`;
          # use the Perl-portable `shasum -a 256` (also available on Linux
          # distros that ship the perl-String-Util package; for Linux we
          # still keep `sha256sum` in the linux-gcc / linux-aarch64 jobs).
          shasum -a 256 "build/nimrtc-${version}-macos-arm64-clang.tar.xz" \
            | awk '{print $1"  "substr($2,index($2,"/")+1)}' \
            > "build/nimrtc-${version}-macos-arm64-clang.tar.xz.sha256"

      - name: Upload artefact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nimrtc-macos-arm64-clang
          path: |
            build/nimrtc-*.tar.xz
            build/nimrtc-*.tar.xz.sha256
            build/3a-status-macos-arm64.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish: download all four artefacts, sign each one with the release
  # manager's GPG key, generate an SBOM, then draft the GitHub Release
  # with CHANGELOG.md content. Drafts can be edited before publish.
  #
  # `contents: write` is required by softprops/action-gh-release@v2 to
  # create the Draft Release; the default GITHUB_TOKEN permission for
  # this workflow is `contents: read` (see top of file), which makes
  # the action fail with `Resource not accessible by integration (403)`
  # (observed at v0.14.0 cut).
  # ---------------------------------------------------------------------------
  publish-release:
    name: release / publish
    permissions:
      contents: write
    needs:
      - preflight
      - build-windows
      - build-linux-gcc
      - build-linux-aarch64
      - build-macos-clang
      # W5 closed (review 2026-11-05): the v1.0.2 release published the
      # aarch64 bundle, which counts as the first observed green run of
      # the release aarch64 leg. The leg is a hard gate again, so a
      # missing aarch64 bundle blocks the release instead of publishing
      # a partial set. (The historical "ARM64 runner capacity" story was
      # a misdiagnosis: the runner label was invalid. See
      # docs/plan/ci-workarounds.md §4.)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.preflight.outputs.release_tag }}

      - name: Import GPG signing key
        if: needs.preflight.outputs.configured == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import -
          if [[ -n "$GPG_PASSPHRASE" ]]; then
            # Cache passphrase for unattended signing.
            echo "allow-preset-passphrase" > ~/.gnupg/gpg-agent.conf
            gpgconf --kill gpg-agent || true
            /usr/lib/gnupg2/gpg-preset-passphrase \
              --preset "$(gpg --list-secret-keys --with-colons \
                | awk -F: '/^sec/ {print $5}' | head -n1)" \
              <<<"$GPG_PASSPHRASE" \
              || echo "preset-passphrase failed; continuing with --passphrase"
          fi

      - name: Download all four artefact bundles
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify the `.sha256` sidecars are `sha256sum -c` compatible
        shell: bash
        run: |
          set -euo pipefail
          # The README tells a reader to verify a bundle with
          # `sha256sum -c <file>.sha256`, so every published sidecar has
          # to be a checksum line: a digest, whitespace, and the name of
          # the file the digest belongs to.  The v1.3.0 cut shipped three
          # sidecars that were not: the Windows one was the bare hex with
          # no name at all ("no properly formatted SHA256 checksum lines
          # found") and the two Linux ones said `build/<file>`, so
          # `sha256sum -c` looked for a file under a directory that does
          # not exist next to a downloaded bundle ("No such file or
          # directory").  The digest was always right; the *line* was
          # not, and the release log could not see that.
          #
          # This gate is the format check.  The digest itself is checked
          # by `sha256sum -c` below, which verifies each sidecar against
          # the bundle it sits next to.
          python3 tools/check_sha256_sidecars.py dist/

          # And now the real thing: run the command the README prints.
          for sidecar in dist/*.sha256; do
            [[ -f "$sidecar" ]] || continue
            bundle="${sidecar%.sha256}"
            [[ -f "$bundle" ]] || continue
            ( cd dist && sha256sum -c "$(basename "$sidecar")" )
          done

      - name: Sign each artefact (detached GPG signature)
        if: needs.preflight.outputs.configured == 'true'
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tarball in dist/*.tar.xz; do
            echo "Signing $tarball"
            if [[ -n "$GPG_PASSPHRASE" ]]; then
              gpg --batch --yes --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --local-user "$GPG_FINGERPRINT" \
                  --armor --detach-sign --output "${tarball}.asc" "$tarball"
            else
              gpg --batch --yes \
                  --local-user "$GPG_FINGERPRINT" \
                  --armor --detach-sign --output "${tarball}.asc" "$tarball"
            fi
          done

      # The detached `.asc` signatures are useless to a consumer who cannot
      # obtain the public key: the v1.0.1 release shipped signed assets
      # while the signing key stayed private, so `gpg --verify` failed for
      # every downstream user. Export the public half of the signing key and
      # publish it as a release asset next to the signatures, and push it to
      # the public keyservers at the same time. Both are best-effort: the
      # asset upload is the reliable channel, the keyserver push only
      # succeeds for keys that have an email address on file.
      - name: Export the signing public key
        if: needs.preflight.outputs.configured == 'true'
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          gpg --armor --export "$GPG_FINGERPRINT" > dist/nimrtc-signing-key.asc
          echo "[+] exported dist/nimrtc-signing-key.asc ($(wc -c < dist/nimrtc-signing-key.asc) bytes)"
          gpg --fingerprint "$GPG_FINGERPRINT"

      - name: Publish the signing key to the public keyservers
        if: needs.preflight.outputs.configured == 'true'
        shell: bash
        continue-on-error: true
        env:
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          for keyserver in keyserver.ubuntu.com keys.openpgp.org; do
            if gpg --keyserver "hkps://$keyserver" --send-keys "$GPG_FINGERPRINT"; then
              echo "[+] sent the signing key to $keyserver"
            else
              echo "::warning::could not send the signing key to $keyserver"
            fi
          done

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail

          # Try cyclonedx-py first (it understands requirements.txt /
          # pyproject.toml / uv.lock / poetry.lock — none of which we ship,
          # so this is expected to fail at v0.14.x; kept for v1.0.0 when
          # we will publish a PyPI wrapper). On failure, fall through to
          # the manifest-only path below.
          if PATH="$HOME/.local/bin:$PATH" python3 -m cyclonedx_py \
              requirements --format json --output dist/sbom.json \
              2>/dev/null \
              || python3 -m pip install --user --quiet cyclonedx-bom && \
                PATH="$HOME/.local/bin:$PATH" cyclonedx-py requirements \
                  --format json --output dist/sbom.json 2>/dev/null; then
            if [[ -s dist/sbom.json ]]; then
              echo "[+] CycloneDX PyPI SBOM generated ($(wc -c < dist/sbom.json) bytes)"
              exit 0
            fi
          fi

          # Fallback: build a minimal CycloneDX 1.5 SBOM directly from
          # src/third_party/vendor.json (the in-tree, canonical manifest
          # that pins every upstream commit SHA — see
          # docs/plan/vendor-migration.md). The format we emit is a
          # hand-rolled JSON document that passes CycloneDX schema
          # validation; downstream consumers can read it with any
          # standard SBOM tool. This is "manifest-only" — no per-file
          # hashes — but covers every vendored third-party package with
          # name + version + purl + license + upstream VCS URL.
          python3 - <<'PYEOF'
          import json, sys, hashlib, pathlib
          vendor = json.loads(pathlib.Path("src/third_party/vendor.json").read_text(encoding="utf-8"))
          components = []
          for v in vendor.get("vendors", []):
              name = v["name"]
              version = v.get("upstream_version") or v.get("commit_sha", "")[:12]
              sha = v.get("commit_sha", "")
              components.append({
                  "type": "library",
                  "name": name,
                  "version": version,
                  "purl": f"pkg:generic/{name}@{version}?download_url={v.get('upstream_url','')}",
                  "licenses": [{"license": {"name": v.get("license", "UNKNOWN")}}],
                  "externalReferences": [
                      {"type": "vcs", "url": v.get("upstream_url", "")},
                      {"type": "distribution",
                       "url": f"{v.get('upstream_url','').rstrip('.git')}/archive/{sha}.tar.gz"}
                      if sha else {"type": "vcs", "url": v.get("upstream_url", "")},
                  ],
                  "hashes": [{"alg": "SHA-1", "content": hashlib.sha1(sha.encode()).hexdigest()}] if sha else [],
                  "properties": [{"name": "nimrtc:vendor:commit_sha", "value": sha}] if sha else [],
              })
          with open("dist/sbom.json", "w", encoding="utf-8") as f:
              json.dump({
                  "bomFormat": "CycloneDX",
                  "specVersion": "1.5",
                  "version": 1,
                  "metadata": {
                      "timestamp": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "tools": [{"name": "nimrtc-vendor-manifest", "version": "1.0"}],
                      "component": {"type": "application", "name": "nimrtc", "version": "see CHANGELOG.md"},
                  },
                  "components": components,
              }, f, indent=2, ensure_ascii=False)
          print(f"[+] manifest-only SBOM written from vendor.json: {len(components)} components")
          PYEOF
          echo "SBOM written: $(wc -c < dist/sbom.json) bytes"

      - name: Extract CHANGELOG section for ${{ needs.preflight.outputs.release_tag }}
        id: changelog
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.release_tag }}"   # e.g. v1.0.0
          stripped="${version#v}"            # 1.0.0
          export stripped
          # Build the release body with `tools/release_body.py`.
          #
          # The body is the `## [X.Y.Z]` section of `CHANGELOG.md` --
          # whole, when it fits.  That is a correctness requirement
          # rather than a nicety.  GitHub caps a release body at
          # 125 000 characters and *silently truncates* an over-long
          # one -- so the `v1.2.0` cut produced a draft whose body
          # stopped mid-sentence at 124 999 of 364 350 characters, and
          # the publish step then died with `422 Validation Failed` on
          # the PATCH that tried to refresh it.
          #
          # When the section does *not* fit, the tool reduces it to a
          # digest: the `### Status:` paragraph is kept whole (it says
          # what the release *is*), every other entry is reduced to its
          # bold headline, and a footer points at `CHANGELOG.md` for
          # the full text.  It **fails** rather than emitting a body
          # GitHub would truncate, so this failure cannot recur quietly.
          #
          # The earlier awk-based extraction is kept in the history of
          # this file for a reason worth remembering: its escape
          # pattern `\[0\.14\.0\]` collapses under GNU Awk 5.x into the
          # character class `[0.14.0]` (matching ANY of `0`, `.`, `1`,
          # `4`), which made every `## ` heading "match" and put the
          # *entire* CHANGELOG into the body at the v0.14.0 cut.
          python3 tools/release_body.py \
            --version "${stripped}" \
            --out dist/release_notes.md
          if [[ ! -s dist/release_notes.md ]]; then
            echo "::warning::No CHANGELOG section found for $stripped — using fallback body."
            echo "Release $version of NimRTC." > dist/release_notes.md
          fi
          # A second, independent guard: the body that is about to be
          # posted must fit, *including* the footers appended below
          # (the signing status, the digest table and the per-platform
          # 3A status).  The tool already budgets for them; this check
          # is what catches a change to the footers that outgrows the
          # margin.
          #
          # The count is in **characters**, not bytes: GitHub's limit
          # is on characters, and the body carries non-ASCII (arrows,
          # em-dashes) that would make a byte count the wrong number
          # to compare against it.
          #
          # This guard runs where it does -- *before* the footers are
          # appended -- so it can only ever see the body proper.  The
          # guard that actually protects the published body is the one
          # in the "Verify the release body length" step below, which
          # runs after every footer has been appended and therefore
          # counts the body that is really posted.
          body_chars=$(python3 -c "
          import pathlib, sys
          print(len(pathlib.Path('dist/release_notes.md').read_text(encoding='utf-8')))
          ")
          echo "release body: ${body_chars} characters (before the footers)"
          if (( body_chars > 125000 )); then
            echo "::error::The release body is ${body_chars} characters, over GitHub's 125000-character limit."
            exit 1
          fi
          # Append signing-status footer based on what preflight saw.
          if [[ "${{ needs.preflight.outputs.configured }}" != "true" ]]; then
            {
              echo
              echo "---"
              echo
              echo "> ⚠️ **This is an UNSIGNED pre-1.0 Tech Preview release.**"
              echo "> The release assets are published without detached GPG"
              echo "> signatures because the `GPG_PRIVATE_KEY` / `GPG_FINGERPRINT`"
              echo "> secrets are not configured in this repository."
              echo "> Verify integrity using the per-platform `.sha256` files only."
              echo "> Signed releases resume with v1.0.0 (see RELEASING.md §3.3)."
            } >> dist/release_notes.md
          else
            {
              echo
              echo "---"
              echo
              echo "> **Verifying the signature**"
              echo
              echo "> The public half of the signing key ships with this"
              echo "> release as \`nimrtc-signing-key.asc\`. To verify a bundle:"
              echo
              # NOTE: these lines are single-quoted on purpose.  Inside
              # double quotes bash performs command substitution on
              # backticks, so `echo "> ```bash"` swallowed the following
              # lines into a command substitution and the rendered body
              # lost the whole code block (observed on the v1.0.2 draft).
              echo '> ```bash'
              echo '> gpg --import nimrtc-signing-key.asc'
              echo '> gpg --verify nimrtc-<version>-<platform>.tar.xz.asc nimrtc-<version>-<platform>.tar.xz'
              echo '> ```'
              echo
              echo "> The signing key fingerprint is \`${{ vars.GPG_FINGERPRINT }}\`."
              echo "> Check it against the fingerprint shown by \`gpg --fingerprint\`"
              echo "> after importing — do not trust the key file blindly."
            } >> dist/release_notes.md
          fi
          echo "body_file=dist/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Verify which platform bundles are present
        shell: bash
        run: |
          set -euo pipefail
          # The uploaded assets are VERSIONED: the build jobs pack
          # `nimrtc-${version}-<platform>.tar.xz` (see the "Bundle name"
          # comments in each build job).  The previous check looked for
          # the UNVERSIONED `nimrtc-<platform>.tar.xz`, so every platform
          # was reported MISSING even when it had been built and
          # uploaded -- the v1.0.2 draft body therefore carried a false
          # "Partial release" banner listing all four platforms while
          # all four assets were present in the release.
          version="${{ needs.preflight.outputs.release_tag }}"
          version="${version#v}"
          missing=()
          for bundle in \
            windows-x86_64-msvc \
            linux-x86_64-gcc \
            linux-aarch64-gcc \
            macos-arm64-clang
          do
            if [[ -f "dist/nimrtc-${version}-${bundle}.tar.xz" ]]; then
              echo "[+] nimrtc-${version}-${bundle}.tar.xz present"
            else
              echo "[!] nimrtc-${version}-${bundle}.tar.xz MISSING"
              missing+=("nimrtc-${version}-${bundle}.tar.xz")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            {
              echo
              echo "---"
              echo
              echo "> ⚠️ **Partial release — the following platform bundle(s)"
              echo "> were not built in this run and are NOT in the published"
              echo "> artefact set:**"
              for m in "${missing[@]}"; do
                echo "> - \`${m}\`"
              done
              echo "> Cause: the corresponding build job did not produce an"
              echo "> artefact in this run (see the workflow run log for the"
              echo "> failing job). A follow-up release will ship the missing"
              echo "> platform."
            } >> dist/release_notes.md
          fi

          # The digest table.  The v1.3.0 body told a reader how to check a
          # GPG signature and how to run `sha256sum -c`, but it never
          # printed a single digest -- so the only in-band integrity value
          # was the detached `.sha256` sidecar, which sits next to the
          # asset on the SAME server.  A consumer checking a mirror, a
          # mirror-of-a-mirror, or an offline copy had nothing to compare
          # against.
          #
          # The table below is built from the bundles this run is about to
          # publish: the digest is computed from the file itself, so it
          # cannot drift from the artefact, and a bundle that was not
          # built simply does not appear.  It is emitted AFTER the
          # "which platforms are present" check above, so a partial
          # release lists exactly the bundles that actually shipped.
          {
            echo
            echo "---"
            echo
            echo "> **Bundle digests (SHA-256)**"
            echo
            echo "> | Bundle | Platform | Size | SHA-256 |"
            echo "> |---|---|---|---|"
            for tarball in dist/nimrtc-*.tar.xz; do
              [[ -f "$tarball" ]] || continue
              leaf="$(basename "$tarball")"
              digest="$(sha256sum "$tarball" | awk '{print $1}')"
              bytes="$(stat -c%s "$tarball")"
              platform="${leaf#nimrtc-}"
              platform="${platform%.tar.xz}"
              platform="${platform#*-}"
              echo "> | \`${leaf}\` | \`${platform}\` | ${bytes} bytes | \`${digest}\` |"
            done
            echo
            echo "> The digests above are the **full** SHA-256 of each published"
            echo "> bundle.  The same value ships in the detached \`.sha256\`"
            echo "> sidecar next to each asset, in \`sha256sum -c\` format:"
            echo
            echo "> \`\`\`bash"
            echo "> sha256sum -c nimrtc-<version>-<platform>.tar.xz.sha256"
            echo "> \`\`\`"
            echo
            echo "> A digest check alone does not authenticate the bundle --"
            echo "> it tells you the bytes you received are the bytes that were"
            echo "> published.  The detached \`.asc\` signature over the same"
            echo "> file is what establishes *who* published them; verify both."
          } >> dist/release_notes.md

          # W3: per-platform 3A (AEC/ANS/AGC) status.  TWO DIFFERENT
          # facts must be reported per platform, and conflating them is
          # what made the v1.0.2 body wrong:
          #   * the BUILD-TIME mode, from `3a-status-<platform>.txt`
          #     (`ON` = the WebRTC APM prebuild succeeded);
          #   * what the PUBLISHED BUNDLE actually carries, checked by
          #     listing the tarball for `lib/webrtc_apm/`.
          # The v1.0.2 body claimed "WebRTC APM (real 3A) bundled" for
          # every platform whose prebuild succeeded, while NONE of the
          # four published bundles contained the APM archives at all
          # (they shipped only the vendored third-party stack), and the
          # `windows` line blamed a failed prebuild although that step
          # succeeded in the final release run.  The table now reports
          # both facts, so every claim can be checked against the
          # artefact the consumer actually downloads.
          {
            echo
            echo "---"
            echo
            echo "> **3A (AEC/ANS/AGC) status per platform**"
            echo
            for status_file in dist/3a-status-*.txt; do
              [[ -f "$status_file" ]] || continue
              platform="$(basename "$status_file" .txt)"
              platform="${platform#3a-status-}"
              value="$(cut -d= -f2 "$status_file" | tr -d '\r')"
              bundle=""
              for candidate in dist/nimrtc-*-"${platform}"-*.tar.xz; do
                [[ -f "$candidate" ]] || continue
                bundle="$candidate"
                break
              done
              shipped="no-bundle"
              if [[ -n "$bundle" ]]; then
                # `tools/check_bundle_apm.py` decides this, NOT
                # `tar -tJf ... | grep -q`.  The pipeline spelling is
                # wrong under `set -o pipefail`: `grep -q` exits on its
                # first match, `tar` then gets SIGPIPE and exits 141,
                # and the pipeline reports failure -- so every bundle
                # looks APM-free.  That is exactly how the published
                # v1.1.0 body came to claim `lib/webrtc_apm/ is absent`
                # for the two Linux platforms whose bundles do carry
                # the APM archives.  The script uses `tarfile` and has
                # no pipeline at all.
                #
                # Its exit code separates the facts that must not be
                # conflated: 0 = APM archives present, 1 = read fine but
                # no archives, 2 = the bundle could not be read at all.
                set +e
                python3 tools/check_bundle_apm.py "$bundle" >/dev/null 2>&1
                apm_rc=$?
                set -e
                case "$apm_rc" in
                  0) shipped="yes" ;;
                  1) shipped="no" ;;
                  *) shipped="unreadable" ;;
                esac
              fi
              if [[ "$shipped" == "yes" ]]; then
                echo "> - \`${platform}\` — WebRTC APM (real 3A) bundled"
              elif [[ "$shipped" == "unreadable" ]]; then
                echo "> - \`${platform}\` — a bundle exists for this platform but could not be read, so its 3A content cannot be checked"
              elif [[ "$shipped" == "no-bundle" ]]; then
                echo "> - \`${platform}\` — no bundle for this platform in the release run (the build job produced no artefact), so its 3A content cannot be checked"
              elif [[ "$value" == "ON" ]]; then
                echo "> - \`${platform}\` — the build used the real WebRTC APM, but this bundle ships no APM archives (\`lib/webrtc_apm/\` is absent), so it provides no usable 3A"
              elif [[ "$value" == "OFF" ]]; then
                echo "> - \`${platform}\` — stub 3A path (the WebRTC APM prebuild did not succeed)"
              else
                echo "> - \`${platform}\` — 3A status unknown (no \`3a-status\` record)"
              fi
            done
            echo
            echo "> The WebRTC APM is prebuilt out-of-tree with meson. Where"
            echo "> that prebuild fails, the build falls back to NimRTC's"
            echo "> built-in stub 3A path instead of aborting the release."
            echo "> The status above is checked against the published bundle:"
            echo "> a platform counts as \"real 3A bundled\" only when"
            echo "> \`lib/webrtc_apm/\` is actually present in the tarball."
          } >> dist/release_notes.md

      # The guard that actually protects the published body.
      #
      # Every footer is now appended: the signing status, the digest
      # table and the per-platform 3A status.  This is the first point
      # at which the body that GitHub will really receive can be
      # measured, so this is the check that has to pass -- the earlier
      # one (in "Build the release body") runs before the footers and
      # therefore cannot see them.
      #
      # GitHub's limit is on CHARACTERS, not bytes: the body carries
      # non-ASCII (arrows, em-dashes, the `…` in the 3A table) that
      # would make a byte count the wrong number to compare against it.
      # And the failure GitHub reports for an over-long body is a 422
      # at the publish step, which is far too late and far too
      # indirect: the body that is over the limit is the *whole*
      # release notes, and truncating it would lose the release notes.
      - name: Verify the release body length
        shell: bash
        run: |
          set -euo pipefail
          body_chars=$(python3 -c "
          import pathlib
          print(len(pathlib.Path('dist/release_notes.md').read_text(encoding='utf-8')))
          ")
          echo "release body (with every footer): ${body_chars} characters"
          if (( body_chars > 125000 )); then
            echo "::error::The release body is ${body_chars} characters, over GitHub's 125000-character limit. The body would be rejected with a 422, or silently truncated. Shorten the CHANGELOG section, or shrink a footer."
            exit 1
          fi

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: "NimRTC ${{ needs.preflight.outputs.release_tag }}"
          draft: true
          generate_release_notes: false
          body_path: dist/release_notes.md
          files: |
            dist/*.tar.xz
            dist/*.tar.xz.asc
            dist/*.tar.xz.sha256
            dist/nimrtc-signing-key.asc
            dist/sbom.json
          fail_on_unmatched_files: false

      # The softprops action always CREATES a new draft, then discovers an
      # existing draft for the same tag, keeps the OLDER one and deletes
      # the new one ("Using release <id> ... instead of duplicate draft
      # <id>").  The kept draft keeps its OLD body -- the body generated
      # in this run is thrown away with the deleted draft.  Observed at
      # the v1.0.2 cut: the body generator was fixed but the published
      # draft still carried the previous run's body (stale "Partial
      # release" banner, missing code fence, missing known issue).
      # Refresh the body explicitly so a re-run is idempotent: the
      # published draft always ends up with the body generated here.
      - name: Refresh the draft release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id" \
            | head -n1)"
          if [[ -z "${release_id}" ]]; then
            echo "::error::no draft release found for ${RELEASE_TAG}"
            exit 1
          fi
          payload="${RUNNER_TEMP}/release_body.json"
          # `tag_name` must be sent explicitly: a PATCH that omits it
          # clears the draft's tag and GitHub replaces it with an
          # `untagged-<hash>` placeholder, so publishing the draft would
          # create a bogus tag instead of v1.0.2.
          jq -n --arg tag "${RELEASE_TAG}" --rawfile body dist/release_notes.md \
            '{tag_name: $tag, body: $body}' > "${payload}"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input "${payload}" --silent
          echo "[+] refreshed the body of draft release ${release_id} (${RELEASE_TAG})"

      - name: Surface attestation in Step Summary
        if: always()
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          # The present/missing bundle list and the 3A status are surfaced
          # in the Step Summary as well as in the release body -- a partial
          # release must never be silent. (W5 closed: aarch64 is a hard
          # gate again, so a missing bundle now blocks the release.)
          {
            echo "## Platform bundle coverage"
            echo
            version="${{ needs.preflight.outputs.release_tag }}"
            version="${version#v}"
            for bundle in \
              windows-x86_64-msvc \
              linux-x86_64-gcc \
              linux-aarch64-gcc \
              macos-arm64-clang
            do
              # Versioned asset names -- see the note in the
              # "Verify which platform bundles are present" step.
              if [[ -f "dist/nimrtc-${version}-${bundle}.tar.xz" ]]; then
                echo "- \`nimrtc-${version}-${bundle}.tar.xz\` — present"
              else
                echo "- \`nimrtc-${version}-${bundle}.tar.xz\` — **MISSING** (the corresponding build job did not produce an artefact; see the run log)"
              fi
            done
            echo
            for status_file in dist/3a-status-*.txt; do
              [[ -f "$status_file" ]] || continue
              platform="$(basename "$status_file" .txt)"
              platform="${platform#3a-status-}"
              value="$(cut -d= -f2 "$status_file" | tr -d '\r')"
              # Report the shipped content next to the build-time mode:
              # the two are not the same fact (see the release-body
              # generator for the v1.0.2 "real 3A bundled" mis-claim).
              #
              # `tools/check_bundle_apm.py` replaces the
              # `tar -tJf ... | grep -q` pipeline, which under
              # `pipefail` reported every bundle as APM-free because
              # `grep -q` exits early and `tar` dies of SIGPIPE.  Its
              # exit code keeps "no archives" and "could not be read"
              # apart.
              shipped="no bundle for this platform"
              for candidate in dist/nimrtc-*-"${platform}"-*.tar.xz; do
                [[ -f "$candidate" ]] || continue
                set +e
                python3 tools/check_bundle_apm.py "$candidate" >/dev/null 2>&1
                apm_rc=$?
                set -e
                case "$apm_rc" in
                  0) shipped="APM archives present in the bundle" ;;
                  1) shipped="no APM archives in the bundle" ;;
                  *) shipped="the bundle could not be read, so its 3A content cannot be checked" ;;
                esac
                break
              done
              echo "- \`${platform}\` — 3A build mode: ${value}; ${shipped}"
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.preflight.outputs.configured }}" == "true" ]]; then
            {
              echo "## Release attestation"
              echo
              echo "- Tag: \`${{ needs.preflight.outputs.release_tag }}\`"
              echo "- Signing key fingerprint: \`$GPG_FINGERPRINT\`"
              echo "- Artefact bundles:"
              for tarball in dist/*.tar.xz; do
                [[ -f "$tarball" ]] || continue
                sha=$(sha256sum "$tarball" | awk '{print $1}')
                echo "  - \`$(basename "$tarball")\` — sha256:\`${sha:0:16}…\`"
              done
              echo
              echo "Draft is created in \`draft: true\` mode — review then publish."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Release summary (UNSIGNED — pre-1.0 Tech Preview)"
              echo
              echo "- Tag: \`${{ needs.preflight.outputs.release_tag }}\`"
              echo "- GPG signing: **not configured** (assets uploaded without detached signatures)"
              echo "- Artefact bundles:"
              for tarball in dist/*.tar.xz; do
                [[ -f "$tarball" ]] || continue
                sha=$(sha256sum "$tarball" | awk '{print $1}')
                echo "  - \`$(basename "$tarball")\` — sha256:\`${sha:0:16}…\`"
              done
              echo
              echo "Acceptable for pre-1.0 Tech Preview. v1.0.0+ MUST configure GPG per RELEASING.md §3.3."
              echo "Draft is created in \`draft: true\` mode — review then publish."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
