name: soak

# The daily evidence collector for the v1.1 seven-day release gate
# (v1.1 plan §2 Track C, item C5).  The gate needs SEVEN CONSECUTIVE
# green days of Case D + Case E on Windows AND Linux x86_64; the
# collector is `tools/run_soak.py` and its operating procedure is
# `docs/plan/soak-runbook.md`.
#
# The Windows half of the window is produced by a local Scheduled Task
# (the runbook §4.1).  This workflow produces the Linux half, which had
# no machine at all -- without it the tag could not be cut, because a
# green Windows streak and a green Linux streak are tracked separately
# and neither substitutes for the other.
#
# Evidence accumulation: every run writes
# `build/soak/<platform>-<YYYY-MM-DD>.jsonl` and uploads that file as a
# workflow artifact (90-day retention).  The artifact IS the record:
# the collector keeps every record it writes, so a run that is
# repeated on the same day adds a second artifact rather than
# replacing the first one, and no failing run can be erased by a
# later pass.  `tools/fetch_soak_evidence.py` pulls the window back
# into `build/soak/` -- the release machine runs it before
# `python tools/run_soak.py --summary --require`, and this workflow
# runs it before the summary so the Step Summary shows the whole
# window instead of just the day it was measured.
#
# The records used to accumulate on a per-platform branch
# (`soak/evidence-<platform>`).  That was a permanent ref that grew
# without bound, and it was lossy: the workflow copied each day's
# file onto the branch, so a second run of the same day REPLACED the
# first run's records.  It was also what broke this workflow: the
# step that pushed the branch replaced the working tree with the
# branch's tree, which deleted `tools/run_soak.py` from the checkout,
# so the summary step that followed it could not find its own tool --
# and on Linux the missing `pipefail` hid that failure completely.
#
# A day with no record at all breaks the streak, so the schedule is
# deliberately off the hour (GitHub's scheduled workflows are delayed
# anyway, but a `:00` slot collides with every other `:00` job on the
# platform).

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to collect evidence for'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - linux-x86_64
          - windows
      ref:
        description: 'Tree to measure -- the v1.1.0 candidate lives on release/1.1'
        required: false
        default: 'release/1.1'
        type: string

# The tree the window measures.  It is NOT `main`: the v1.1.0 tag is cut
# from `release/1.1`, and `main` already carries the v1.2.0 audio body.
# Evidence collected from a different tree than the one that gets tagged
# would not be evidence about the release candidate.  The scheduled run
# has no `inputs`, so it falls back to the same default the dispatch
# input carries.
env:
  SOAK_REF: ${{ inputs.ref || 'release/1.1' }}

permissions:
  # The workflow no longer pushes anything: the evidence leaves the job
  # as an artifact.  `actions: read` is what lets the summary step
  # download the window's earlier artifacts; `contents: read` is what
  # the checkout needs.
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-soak
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 -- the half of the window that had no machine.
  # ---------------------------------------------------------------------------
  linux-x86_64:
    name: soak / linux-x86_64
    if: github.event_name == 'schedule' || inputs.platform == 'both' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # A red acceptance run is EVIDENCE, not a build break: the collector
    # records FAIL (or INCONCLUSIVE) for the day, which is exactly what
    # breaks the seven-day streak.  Failing the job as well would add a
    # red check on `main` that gates nothing and trains everyone to
    # ignore it.  The evidence file and the Step Summary carry the
    # verdict.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The tree the window measures.  Must be the candidate tree
          # (release/1.1), not `main` -- see the `SOAK_REF` env block.
          ref: ${{ env.SOAK_REF }}
          # Full history: the record names the commit it measured, and
          # a shallow clone makes that commit impossible to resolve in
          # the repository's own history later.
          fetch-depth: 0

      - name: Install ninja + Python (CMake via pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the e2e dependencies (Playwright + Chromium)
        # Case D and Case E both drive a REAL Chrome peer through
        # Playwright, so the Chromium build and its system libraries have
        # to be present -- `run_soak.py` records the day as INCONCLUSIVE
        # (never PASS) when Playwright is missing.
        run: |
          python3 -m pip install --user websockets playwright
          python3 -m playwright install --with-deps chromium

      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      # The WebTransport server seam needs a TLS certificate to complete
      # the QUIC handshake; the harness looks for the pair in the build
      # directory.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      - name: Configure
        run: cmake --preset debug -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        run: cmake --build --preset debug -j 2

      - name: Collect the soak evidence
        id: collect
        run: python3 tools/run_soak.py --platform linux-x86_64 --case d,e

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-linux-x86_64-${{ github.run_id }}
          path: build/soak/linux-x86_64-*.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Fold the window's artifacts into the evidence directory
        # The Step Summary has to show the WINDOW, not just the day this
        # run measured -- a summary that only ever sees one day reports
        # a one-day streak no matter how long the window has been
        # running.  The records of the earlier days live in the earlier
        # runs' artifacts, so they are pulled back in here.
        #
        # `always()`: when this day's measurement failed there is no
        # record of it, but the window up to yesterday is still worth
        # showing -- and it is exactly the day a failure would break.
        #
        # The step fails when an artifact cannot be read: a window read
        # from an incomplete set of artifacts is not the window, and a
        # short read must not be mistaken for a short window.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/fetch_soak_evidence.py --days 21

      - name: Surface the soak summary
        if: always()
        shell: bash
        run: |
          # `pipefail` is not optional here: without it the exit status
          # of the pipeline is tee's, so a failing summary looks like a
          # successful one and the Step Summary stays empty.
          set -o pipefail
          python3 tools/run_soak.py --summary --expect-ref "$SOAK_REF" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Windows -- the same evidence, produced on the platform the local
  # Scheduled Task also covers.  Two independent sources for one gate is
  # deliberate: a machine that is asleep on the wrong night must not be
  # able to break the release window.
  # ---------------------------------------------------------------------------
  windows:
    name: soak / windows
    if: github.event_name == 'schedule' || inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 60
    # Same reasoning as the Linux leg: the verdict lives in the evidence
    # record, not in the job status.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The tree the window measures.  Must be the candidate tree
          # (release/1.1), not `main` -- see the `SOAK_REF` env block.
          ref: ${{ env.SOAK_REF }}
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the e2e dependencies (Playwright + Chromium)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets playwright
          python -m playwright install chromium

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Collect the soak evidence
        id: collect
        shell: pwsh
        run: python tools/run_soak.py --platform windows --case d,e

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-windows-${{ github.run_id }}
          path: build/soak/windows-*.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Fold the window's artifacts into the evidence directory
        # Same reasoning as the Linux leg: the Step Summary shows the
        # whole window, so the earlier days' artifacts are pulled in.
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_soak_evidence.py --days 21

      - name: Surface the soak summary
        if: always()
        shell: pwsh
        run: |
          # Tee-Object writes the summary to the Step Summary and leaves
          # it on stdout, so the job log carries it too.
          python tools/run_soak.py --summary --expect-ref $env:SOAK_REF |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # The exit code of the collector is the verdict of this step;
          # it must not be swallowed by the pipeline.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
