name: soak

# The daily evidence collector for the release's soak gate
# (v1.1 plan §2 Track C, item C5).  The gate needs SEVEN CONSECUTIVE
# green days of Case D + Case E on Windows AND Linux x86_64; the
# collector is `tools/run_soak.py` and its operating procedure is
# `docs/plan/soak-runbook.md`.
#
# The day count is the RULE's business, not this workflow's and not the
# release workflow's: `tools/run_soak.py` carries a versioned, dated
# rule (`GATE_RULE`) and picks the rule in force on the cut date.  This
# workflow only RECORDS evidence and REPORTS the window -- it does not
# gate, so it does not need to know how many days the rule wants.  See
# `docs/plan/soak-runbook.md` §4.3.2.
#
# The Windows half of the window is produced by a local Scheduled Task
# (the runbook §4.1).  This workflow produces the Linux half, which had
# no machine at all -- without it the tag could not be cut, because a
# green Windows streak and a green Linux streak are tracked separately
# and neither substitutes for the other.
#
# The window is READ BY THE RELEASE, not just by a human: the release
# workflow's preflight fetches these artifacts and runs the collector's
# `--require` gate against the tagged commit (see `release.yml`, step
# "Verify the soak evidence for this release").  That step is what
# makes the window a gate rather than a report -- a gate that is
# written down but never consulted is not a gate.
#
# Which tree the window measures, and why it is `main`:
#
# The default used to be `release/1.1`, and it was wrong twice over.
# That branch had fallen two generations behind `main` (202 commits /
# 300 files), so a ten-day window measured a tree nobody was going to
# ship; and the release tag is cut from a descendant of `main`, so a
# window measured on a *stale* branch is evidence about a program that
# is not the one being released.
#
# The rule that makes a moving target safe is the ANCESTRY rule in
# `tools/run_soak.py`: a day counts only when the commit it was
# measured on is an ancestor of the commit the release is cut from.  A
# window measured on `main` therefore stays valid as `main` advances
# -- the tagged tree descends from every commit that was measured --
# while a window measured on an unrelated tree still proves nothing.
# The release gate applies exactly that rule, with the tag itself as
# the candidate.
#
# Evidence accumulation: every run writes
# `build/soak/<platform>-<YYYY-MM-DD>.jsonl` and uploads that file as a
# workflow artifact (90-day retention).  The artifact IS the record:
# the collector keeps every record it writes, so a run that is
# repeated on the same day adds a second artifact rather than
# replacing the first one, and no failing run can be erased by a
# later pass.  `tools/fetch_soak_evidence.py` pulls the window back
# into `build/soak/` -- the release workflow runs it before
# `python tools/run_soak.py --summary --require`, and this workflow
# runs it before the summary so the Step Summary shows the whole
# window instead of just the day it was measured.
#
# The records used to accumulate on a per-platform branch
# (`soak/evidence-<platform>`).  That was a permanent ref that grew
# without bound, and it was lossy: the workflow copied each day's
# file onto the branch, so a second run of the same day REPLACED the
# first run's records.  It was also what broke this workflow: the
# step that pushed the branch replaced the working tree with the
# branch's tree, which deleted `tools/run_soak.py` from the checkout,
# so the summary step that followed it could not find its own tool --
# and on Linux the missing `pipefail` hid that failure completely.
#
# A day with no record at all breaks the streak, so the schedule is
# deliberately off the hour (GitHub's scheduled workflows are delayed
# anyway, but a `:00` slot collides with every other `:00` job on the
# platform).

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to collect evidence for'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - linux-x86_64
          - windows
      ref:
        description: 'Tree to measure -- the candidate the release will be cut from'
        required: false
        default: 'main'
        type: string

# The tree the window measures.
#
# It has to be a tree the release is actually cut from, and it has to
# be a LIVE one.  The default used to be `release/1.1`, and that was
# wrong twice over: the branch had fallen two generations behind
# `main` (202 commits / 300 files), so a ten-day window measured a
# tree nobody was going to ship; and the release tag is now cut from a
# descendant of `main`, so a window measured on a *stale* branch is
# evidence about a program that is not the one being released.
#
# The rule that makes this safe is the ANCESTRY rule in
# `tools/run_soak.py`: a day counts only when the commit it was
# measured on is an ancestor of the commit the release is cut from.
# A window measured on `main` therefore stays valid as `main` moves --
# the tagged tree descends from every commit that was measured -- while
# a window measured on an unrelated tree still proves nothing.
#
# The scheduled run has no `inputs`, so it falls back to the same
# default the dispatch input carries.
env:
  SOAK_REF: ${{ inputs.ref || 'main' }}

permissions:
  # The workflow no longer pushes anything: the evidence leaves the job
  # as an artifact.  `actions: read` is what lets the summary step
  # download the window's earlier artifacts; `contents: read` is what
  # the checkout needs.
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-soak
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 -- the half of the window that had no machine.
  # ---------------------------------------------------------------------------
  linux-x86_64:
    name: soak / linux-x86_64
    if: github.event_name == 'schedule' || inputs.platform == 'both' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # A red acceptance run is EVIDENCE, not a build break: the collector
    # records FAIL (or INCONCLUSIVE) for the day, which is exactly what
    # breaks the streak.  Failing the job as well would add a
    # red check on `main` that gates nothing and trains everyone to
    # ignore it.  The evidence file and the Step Summary carry the
    # verdict.
    #
    # `continue-on-error` used to sit HERE, on the job, which meant the
    # job's own conclusion was "success" no matter what happened --
    # including a runner that never allocated a machine, or a build
    # that never compiled.  The mask hid the difference between "the
    # acceptance case failed" (evidence) and "this job never ran"
    # (a hole in the window).
    #
    # The distinction is now made explicitly: the steps that produce
    # EVIDENCE carry `continue-on-error: true`, so a failing case
    # still writes its record, while the steps that produce the
    # EVIDENCE'S PRECONDITIONS -- the checkout, the build, the
    # dependency install -- do not.  A job that could not build is a
    # hole in the window, and a hole must be visible.
    #
    # The final "Fail the job when the day is not green" step turns a
    # non-green day into a red job, so the workflow's own conclusion
    # agrees with the evidence rather than being decorative.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The tree the window measures -- see the `SOAK_REF` env block.
          ref: ${{ env.SOAK_REF }}
          # Full history: the record names the commit it measured, and
          # a shallow clone makes that commit impossible to resolve in
          # the repository's own history later.
          fetch-depth: 0

      - name: Install ninja + Python (CMake via pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the e2e dependencies (Playwright + Chromium)
        # Case D and Case E both drive a REAL Chrome peer through
        # Playwright, so the Chromium build and its system libraries have
        # to be present -- `run_soak.py` records the day as INCONCLUSIVE
        # (never PASS) when Playwright is missing.
        run: |
          python3 -m pip install --user websockets playwright
          python3 -m playwright install --with-deps chromium

      - name: Pre-flight tool check
        run: python3 tools/ci_preflight.py

      # The WebTransport server seam needs a TLS certificate to complete
      # the QUIC handshake; the harness looks for the pair in the build
      # directory.
      - name: Provision WebTransport TLS material
        run: |
          mkdir -p build
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = localhost' \
            '[v3]' 'subjectAltName = DNS:localhost,IP:127.0.0.1' \
            > build/wtserver_openssl.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout build/wtserver_key.pem \
            -out build/wtserver_cert.pem \
            -config build/wtserver_openssl.cnf

      - name: Configure
        run: cmake --preset debug -DNIMRTC_BUILD_EXAMPLES=ON -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        run: cmake --build --preset debug -j 2

      - name: Collect the soak evidence
        id: collect
        # `continue-on-error` here, and ONLY here: a failing acceptance
        # case is evidence, and the collector has already written the
        # record that says so.  The step's own exit status is the
        # collector's verdict on the cases, and it is read below.
        continue-on-error: true
        run: python3 tools/run_soak.py --platform linux-x86_64 --case d,e

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-linux-x86_64-${{ github.run_id }}
          path: build/soak/linux-x86_64-*.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Fold the window's artifacts into the evidence directory
        # The Step Summary has to show the WINDOW, not just the day this
        # run measured -- a summary that only ever sees one day reports
        # a one-day streak no matter how long the window has been
        # running.  The records of the earlier days live in the earlier
        # runs' artifacts, so they are pulled back in here.
        #
        # `always()`: when this day's measurement failed there is no
        # record of it, but the window up to yesterday is still worth
        # showing -- and it is exactly the day a failure would break.
        #
        # The step fails when an artifact cannot be read: a window read
        # from an incomplete set of artifacts is not the window, and a
        # short read must not be mistaken for a short window.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/fetch_soak_evidence.py --days 21

      - name: Surface the soak summary
        if: always()
        shell: bash
        run: |
          # `pipefail` is not optional here: without it the exit status
          # of the pipeline is tee's, so a failing summary looks like a
          # successful one and the Step Summary stays empty.
          set -o pipefail
          python3 tools/run_soak.py --summary --expect-ref "$SOAK_REF" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail the job when the day is not green
        # The job's conclusion now agrees with the evidence.  A day that
        # did not pass both cases is a red job, so the window's health
        # is visible on the workflow list rather than only inside a
        # Step Summary nobody reads.
        #
        # The collector's exit status is the authority: 0 = every case
        # passed, 1 = a case failed, 2 = the collector could not run at
        # all (no Playwright, no build tree, no interpreter).  The third
        # one is an INCONCLUSIVE day, which breaks the streak just like
        # a failure does -- so it is a red job too, and the reason is
        # in the record.
        if: always()
        shell: bash
        run: |
          # `steps.collect.outcome` is "success" or "failure".  It is
          # compared as a STRING and never routed through an arithmetic
          # ternary, because GitHub's expression language has no
          # `?:` -- the idiom `cond && 0 || 1` looks like one and is
          # not: `0` is falsy in that language, so `true && 0` yields
          # `0`, which falsy-falls-through to the `|| 1` branch and the
          # whole expression evaluates to `1` no matter what the
          # condition was.  That is precisely what happened here: the
          # step read `rc="1"` on a run whose every recorded case was
          # PASS, and the Linux leg was red for a reason that had
          # nothing to do with the soak -- a second bug, in the very
          # step that reports the verdict, hiding behind the glob bug
          # above.  The Windows leg never had it: it compares the
          # outcome as a string (`-ne "success"`), which is the shape
          # to copy.
          if [[ "${{ steps.collect.outcome }}" != "success" ]]; then
            echo "::error::the soak day is not green -- see the evidence record"
            exit 1
          fi
          # The collector's own exit code is not preserved by
          # `continue-on-error`, so the distinction between "a case
          # failed" (1) and "the collector could not run" (2) is read
          # from the record the collector wrote, not from this step.
          #
          # A glob is NOT expanded on the right-hand side of `-f` inside
          # `[[ ... ]]`: the pattern is handed to the test as a literal
          # string, and a literal string with a `*` in it is never a
          # file.  The negation therefore ALWAYS held, and this step
          # reported "the collector wrote no evidence record at all" on
          # every single run -- including the ones whose evidence file
          # was sitting right there.  The Linux leg was red every day
          # for a reason that had nothing to do with the soak.
          #
          # The fix is to let the shell expand the glob in a context
          # that does expand it: a plain `compgen`/`for` over the
          # pattern, or `ls` with the pattern.  `compgen -G` is the
          # cheapest of the two -- it prints the matching paths and
          # returns non-zero when there are none.
          if ! compgen -G "build/soak/linux-x86_64-*.jsonl" > /dev/null; then
            echo "::error::the collector wrote no evidence record at all"
            exit 1
          fi
          echo "the soak day is green"

  # ---------------------------------------------------------------------------
  # Windows -- the same evidence, produced on the platform the local
  # Scheduled Task also covers.  Two independent sources for one gate is
  # deliberate: a machine that is asleep on the wrong night must not be
  # able to break the release window.
  # ---------------------------------------------------------------------------
  windows:
    name: soak / windows
    if: github.event_name == 'schedule' || inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 60
    # Same reasoning as the Linux leg: the verdict lives in the evidence
    # record, and the job's conclusion is made to agree with it at the
    # end of the job (see "Fail the job when the day is not green").
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The tree the window measures -- see the `SOAK_REF` env block.
          ref: ${{ env.SOAK_REF }}
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the e2e dependencies (Playwright + Chromium)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets playwright
          python -m playwright install chromium

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset debug.msvc `
            -DNIMRTC_BUILD_EXAMPLES=ON `
            -DNIMRTC_VENDORED_WEBRTC_APM=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j

      - name: Collect the soak evidence
        id: collect
        shell: pwsh
        # `continue-on-error` here, and ONLY here: a failing acceptance
        # case is evidence, and the collector has already written the
        # record that says so.
        continue-on-error: true
        run: python tools/run_soak.py --platform windows --case d,e

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-windows-${{ github.run_id }}
          path: build/soak/windows-*.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Fold the window's artifacts into the evidence directory
        # Same reasoning as the Linux leg: the Step Summary shows the
        # whole window, so the earlier days' artifacts are pulled in.
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_soak_evidence.py --days 21

      - name: Surface the soak summary
        if: always()
        shell: pwsh
        run: |
          # Tee-Object writes the summary to the Step Summary and leaves
          # it on stdout, so the job log carries it too.
          python tools/run_soak.py --summary --expect-ref $env:SOAK_REF |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # The exit code of the collector is the verdict of this step;
          # it must not be swallowed by the pipeline.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fail the job when the day is not green
        # The job's conclusion agrees with the evidence.  See the
        # equivalent step in the Linux leg for the reasoning.
        if: always()
        shell: pwsh
        run: |
          $records = Get-ChildItem build/soak/windows-*.jsonl -ErrorAction SilentlyContinue
          if (-not $records) {
            Write-Error "the collector wrote no evidence record at all"
            exit 1
          }
          if ("${{ steps.collect.outcome }}" -ne "success") {
            Write-Error "the soak day is not green -- see the evidence record"
            exit 1
          }
          Write-Host "the soak day is green"
