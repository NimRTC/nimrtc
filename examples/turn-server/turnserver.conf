# ---------------------------------------------------------------------------
# examples/turn-server/turnserver.conf
# ---------------------------------------------------------------------------
#
# The reference TURN server for NimRTC's connectivity tests (v1.4 plan
# item N5).  It is deliberately **not** a production configuration: its
# credentials are static, its certificate is issued by a one-off local
# CA (`gen-certs.sh`), and its realm says `nimrtc.local`.  Its job is to
# be the server a test can point at and that *enforces* the transport
# the test claims to use.
#
# Nothing here is read by the library.  `src/modules/ice/` talks to this
# server through libjuice's TURN client; the only thing the two share is
# the TURN URI, the realm and the credential.
#
# ---------------------------------------------------------------------------
# Listening
# ---------------------------------------------------------------------------

# The plain TURN listener.  Used by the negative control and by the
# pre-N1 tree, which only speaks TCP.
listening-port=3478

# The TLS listener (RFC 8656 § 7.2's conventional port).  N1's positive
# case points here, and the negative control is "the same client pointed
# at coturn-plain fails to establish".
#
# 443 is a second TLS listener, added by the compose file as an extra
# `--tls-listening-port=443` argument (coturn takes the option once; a
# second line here would silently override the first).
tls-listening-port=5349

# The relay port range.  Must match `x-relay-ports` in docker-compose.yml,
# or the published ports point at allocations the server never makes.
min-port=49160
max-port=49200

# TURN over TCP (RFC 6062 § 4) — the control connection is a TCP stream;
# the relayed allocation is still UDP towards the peer.  N2's
# ICE-over-TCP work is separate (RFC 6544), but this is what lets a
# pre-N2 client reach the server from behind a TCP-only firewall.
no-udp-relay=0
no-tcp-relay=0

# ---------------------------------------------------------------------------
# Authentication — static, long-term credentials, test-only
# ---------------------------------------------------------------------------
#
# `lt-cred-mech` selects the long-term-credential mechanism (RFC 5766
# §4 / RFC 8656 §9.2): the client sends a username and a key derived
# from a password.  coturn's *default* is the short-term mechanism,
# where the "password" is a credential the server itself hands out —
# which is exactly what a test cannot use, because there is nothing to
# configure up front.  This line is what makes `user=` below mean
# anything.
lt-cred-mech

# `user=...` lines are the plain form `user=<name>:<password>`; coturn
# hashes the password at start.  The credentials are the sample's and
# the tests' shared constants, duplicated from `gen-certs.sh`'s
# `secrets/creds.txt` on purpose: a test credential that has to be
# fetched is a test that cannot run from a clean checkout.
#
# N7 (the credential-provider seam) is what makes *real* TURN
# credentials — `username:timestamp` + HMAC, expiring — a first-class
# thing.  This file is the static server list N7 explicitly keeps
# working (§5 N7-1).
user=nimrtc:nimrtc-test-secret

realm=nimrtc.local

# The CLI password protects coturn's *administrative* interface (the
# `turnserver_cli` telnet console), not the TURN protocol.  It is
# required here because of `allow-loopback-peers`: coturn refuses to
# start with "allow_loopback_peers and empty cli password cannot be
# used together" — a loopback relay without a console password would
# otherwise let anyone on the machine reconfigure the server.  The
# value below is local-only and its only job is to be non-empty.
cli-password=local-console-only

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
#
# gen-certs.sh issues the certificate from a one-off local CA for
# `turn.nimrtc.local` (plus `localhost` and `127.0.0.1` / `::1` as
# subjectAltName).  A client that verifies pins the generated CA
# (`secrets/ca/ca.pem`), not the leaf — so the certificate can rotate
# without every pin breaking.  `TurnServer::tls_server_name` carries the
# SNI, and the DTLS path's existing rule (pinned fingerprint, or the
# trust store) is the rule N1 reuses.
cert=/etc/coturn/tls/turn.pem
pkey=/etc/coturn/tls/turn.key

# TLS 1.2 is the floor: RFC 8656 § 7.2 requires TLS 1.2 or better, and
# the DTLS stack the client uses (ADR-013) is configured for the same
# floor.  A test that passes at TLS 1.0 is a test of a protocol the
# client cannot actually negotiate in the field.
no-tlsv1=1
no-tlsv1_1=1

# ---------------------------------------------------------------------------
# What this server refuses to do
# ---------------------------------------------------------------------------

# No TURN-over-DTLS: out of scope for N1 (v1.4 §3, N1 "Scope boundary"):
# plain RFC 5766 long-term credentials, no alternate auth, no
# TURN-over-DTLS.
no-dtls=1
no-dtlsv1=1
no-dtlsv1_1=1

# Loopback is where the relay peers live (the sample and the tests run
# on one host).  `allow-loopback-peers` is what lets two processes on
# localhost relay through each other; without it the relay allocation
# is refused and the failure looks like a credential problem.
allow-loopback-peers=1

# Docker's bridge puts the container behind NAT: a peer on the host
# reaches the container from the bridge's gateway address, and the
# permission the client asks for names that address.  coturn's default
# handling already accepts it; this is where a future tightening would
# go, so it is left at the default on purpose rather than guessed at.

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
#
# The file lands under ./secrets/logs/ (the compose file mounts
# `./secrets` at `/etc/coturn`, and coturn creates the directory it is
# told to log into).  N1's evidence is "the TLS handshake is visible in
# the server log", so the log has to exist and has to name the
# transport.
log-file=/etc/coturn/logs/turnserver.log
simple-log=1
verbose=1
# `fingerprint` prints the TLS suite and version on the handshake line,
# which is what "the control stream's TLS handshake is visible in the
# server log" (N1's DoD) needs to be checkable by a human.
fingerprint=1

# ---------------------------------------------------------------------------
# Limits — deliberately small
# ---------------------------------------------------------------------------
#
# A reference server that can be flooded is a reference that fails a
# test for reasons the test is not about.  These are enough for the
# sample plus the N1 / N2 tests and no more.
max-bps=2000000
total-quota=100
user-quota=12
stale-nonce=600
max-allocate-lifetime=600
