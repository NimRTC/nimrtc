# coturn configuration for the NimRTC reference TURN deployment
# (examples/turn-server/, slice v1-n5-turn-server).
#
# This is the TLS-only listener: only the TURN-over-TLS control
# connection on port 5349 is accepted.  The no-* lines below are the
# version-portable spelling of "TLS only" (newer coturn builds also
# accept a --tls-only flag on the command line — see install-coturn.sh
# and the slice spec's risk note about --require-tls).

# TURN over TLS control listener (RFC 6062, conventional port 5349).
listening-port=5349
tls-listening-port=5349

# Do not listen for UDP/TCP/DTLS — TLS is the only transport.
no-udp
no-tcp
no-dtls

# Long-term credential mechanism (RFC 5766 §8): the acceptance test and
# the NimRTC ICE client both use a username/password credential.
lt-cred-mech
realm=turn.nimrtc.local

# The certificate material generated by gen-certs.sh.  The TLS listener
# references these paths (N5 验收标准 2).
cert=/etc/turn-server/certs/turn-server-cert.pem
pkey=/etc/turn-server/certs/turn-server-key.pem

# Static long-term credential.  install-coturn.sh rewrites this line
# with the credential it generates; the compose developer path keeps
# the defaults documented in README.md.
user=turnuser:turnpass
