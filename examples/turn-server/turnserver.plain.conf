# ---------------------------------------------------------------------------
# examples/turn-server/turnserver.plain.conf
# ---------------------------------------------------------------------------
#
# The configuration of the **negative control** (v1.4 plan item N5).
#
# It is a separate file rather than a set of command-line overrides on
# `turnserver.conf` because of how coturn resolves its options, and the
# resolution is the opposite of what one would guess:
#
#   * **The command line wins for ordinary options.**  coturn reads the
#     config file (pass 1) and *then* the command line, so
#     `--listening-port=5349` overrides the file's value.
#
#   * **The config file wins for the log options.**  `set_option()`
#     lists `'l'` (log-file) among the options "already taken care of
#     before", and the only pass that applies the config file's
#     `log-file=` runs *after* the command line's log option.  So a
#     command-line `--log-file=` is **silently ignored** -- the server
#     opens the config file's path instead and says nothing about it.
#
# The second point is why this file exists.  The control has to keep its
# own log: it is the evidence that no TLS session was ever created on
# the port, and if it shared the positive server's log file, the
# control's run would *overwrite* the positive server's evidence -- or
# the other way round, whichever ran last.  Passing `--log-file` on the
# command line would not have prevented that; it would have been
# ignored.
#
# Everything else here is identical to `turnserver.conf` on purpose: the
# control must fail *only* because TLS is off.
#
# ---------------------------------------------------------------------------
# Listening
# ---------------------------------------------------------------------------

# The plain TURN listener, on the port the client was told to use.
# This is the whole point of the control: the client is told 5349, and
# 5349 speaks plain TCP.  A client that connects here was told to use
# TLS and did not.
listening-port=5349

# The relay port range.  Must match `x-relay-ports` in
# `docker-compose.yml`, or the published ports point at allocations the
# server never makes.
min-port=49160
max-port=49200

no-udp-relay=0
no-tcp-relay=0

# ---------------------------------------------------------------------------
# Authentication — static, long-term credentials, test-only
# ---------------------------------------------------------------------------
#
# The same mechanism and the same credential as the positive server.
# The control has to authenticate the client the same way, or the
# failure it produces would be "the credentials were rejected" rather
# than "the TLS handshake did not happen" -- and only the second is
# the defect N1 is about.
lt-cred-mech
user=nimrtc:nimrtc-test-secret

realm=nimrtc.local

# coturn refuses to start with "allow_loopback_peers and empty cli
# password cannot be used together", so the administrative console's
# password has to be non-empty.  It guards coturn's *console*, not the
# TURN protocol.
cli-password=local-console-only

# ---------------------------------------------------------------------------
# What this server refuses to do
# ---------------------------------------------------------------------------

# **No TLS listeners and no DTLS listeners.**  These are coturn's own
# switches: `--no-tls` is "Do not start TLS client listeners" and
# `--no-dtls` is "Do not start DTLS client listeners".  There is no
# `--tls-only` option in coturn -- a deployment "refuses plain TCP on
# the TLS port" by *not* putting a plain listener on that port, which
# is what the positive server does (its plain listener is on 3478 and
# its TLS listener on 5349).
#
# Because both are off, coturn does not look for a certificate at all
# (the certificate check is skipped when both listeners are disabled),
# which is correct: the control has no TLS material to present.
no-tls=1
no-dtls=1

# The relay peers live on loopback (the sample and the tests run on one
# host), and without this the allocation is refused and the failure
# looks like a credential problem.
allow-loopback-peers=1

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
#
# Its own file, for the reason in the header: this log is the evidence
# that no TLS session was created on the port, and it must not be
# destroyed by (or destroy) the positive server's evidence.
log-file=/etc/coturn/logs/turnserver-plain.log
simple-log=1
verbose=1

# ---------------------------------------------------------------------------
# Limits — deliberately small, and the same as the positive server's
# ---------------------------------------------------------------------------

max-bps=2000000
total-quota=100
user-quota=12
stale-nonce=600
max-allocate-lifetime=600
