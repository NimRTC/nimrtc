# ---------------------------------------------------------------------------
# examples/turn-server/turnserver.wsl.conf
# ---------------------------------------------------------------------------
#
# A copy of `turnserver.conf` with the container paths rewritten to the
# ones the native WSL run uses.  The Docker compose file mounts ./secrets
# at /etc/coturn; here the same directory is reached through the DrvFs
# mount, so the paths differ but nothing else does.
#
# The plain listener is on 3477 rather than the IANA 3478: the WSL image
# ships a *system* coturn (/etc/turnserver.conf) that already holds
# 3478 -- and, because coturn's default TLS port is `listening-port + 1`,
# 3479 as well.  The two would fight over them.  The TLS listener keeps
# the conventional 5349, because that is the port the N1 acceptance run
# points the client at.
#
# This file exists so that the N1 acceptance run ("a real coturn, with
# TLS, on the port the client was told to use") can be reproduced by hand
# on a machine that has no Docker daemon.  It is not used by CI and not
# used by the compose file.
# ---------------------------------------------------------------------------

listening-port=3477
tls-listening-port=5349

# coturn's default "alt" port is `listening-port + 1`, which would be
# 3478 -- the port the WSL image's *system* coturn already holds.  Pin it
# to a free port so the two servers do not fight over it.
alt-listening-port=3480
alt-tls-listening-port=5350

min-port=49160
max-port=49200

no-udp-relay=0
no-tcp-relay=0

lt-cred-mech
user=nimrtc:nimrtc-test-secret
realm=nimrtc.local
cli-password=local-console-only

cert=/mnt/d/MyOpen/NimRTC/examples/turn-server/secrets/tls/turn.pem
pkey=/mnt/d/MyOpen/NimRTC/examples/turn-server/secrets/tls/turn.key

no-tlsv1=1
no-tlsv1_1=1

no-dtls=1
no-dtlsv1=1
no-dtlsv1_1=1

allow-loopback-peers=1

log-file=/mnt/d/MyOpen/NimRTC/examples/turn-server/secrets/logs/turnserver.log
simple-log=1
verbose=1
fingerprint=1

max-bps=2000000
total-quota=100
user-quota=12
stale-nonce=600
max-allocate-lifetime=600
