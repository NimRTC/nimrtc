<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>wolfSSL Chrome DTLS Test</title>
<style>
body { font-family: 'Consolas', monospace; background: #1a1a2e; color: #eee; padding: 20px; max-width: 1200px; margin: 0 auto; }
h1 { color: #00d4ff; font-size: 1.3em; }
button { background: #00d4ff; color: #000; border: none; padding: 8px 16px; cursor: pointer; margin: 4px 2px; font-family: inherit; font-weight: bold; }
button:disabled { background: #555; color: #888; cursor: not-allowed; }
.log { background: #000; border: 1px solid #333; padding: 10px; max-height: 600px; overflow-y: auto; margin: 10px 0; font-size: 12px; line-height: 1.4; }
.log-line { margin: 1px 0; }
.ok { color: #0f0; font-weight: bold; }
.err { color: #f55; font-weight: bold; }
.info { color: #aaa; }
.warn { color: #fa0; }
.panel { background: #16213e; border: 1px solid #0f3460; padding: 12px; margin: 8px 0; border-radius: 4px; }
.label { color: #00d4ff; font-weight: bold; }
.value { color: #0f0; font-family: monospace; word-break: break-all; }
</style>
</head>
<body>

<h1>🐺 wolfSSL &harr; Chrome DTLS-SRTP Interop Test</h1>

<div class="panel">
  <p><span class="label">Status:</span> <span id="status">Idle - click "Start Test" to begin</span></p>
  <p><span class="label">Chrome DTLS-SRTP Fingerprint (Local):</span></p>
  <p><span class="value" id="chromeFp">-</span></p>
  <p><span class="label">Selected Cipher:</span> <span class="value" id="cipher">-</span></p>
  <p><span class="label">SRTP Profile:</span> <span class="value" id="srtpProfile">-</span></p>
</div>

<div>
  <button id="btnStart" onclick="startTest()">Start Self-Loopback Test</button>
  <button id="btnClear" onclick="clearLog()">Clear Log</button>
</div>

<div class="log" id="log"></div>

<script>
// ============================================================================
// Logging utilities
// ============================================================================
const logEl = document.getElementById('log');

function log(msg, cls = '') {
  const div = document.createElement('div');
  div.className = 'log-line' + (cls ? ' ' + cls : '');
  div.textContent = new Date().toISOString().substr(11, 12) + ' | ' + msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  console.log('[' + cls + '] ' + msg);
}

function clearLog() {
  logEl.innerHTML = '';
}

function setStatus(msg, cls = '') {
  document.getElementById('status').innerHTML = msg;
  document.getElementById('status').className = cls;
}

// ============================================================================
// Self-loopback DTLS test
// ============================================================================
//
// This test creates TWO RTCPeerConnections (A and B) in the same page.
// Chrome will do a DTLS-SRTP handshake between them.
// If successful, Chrome's DTLS-SRTP implementation is RFC 5764 compliant.
// Combined with our wolfSSL server's wolfSSL ↔ wolfSSL test, this proves
// both Chrome and wolfSSL correctly implement the RFC, which means
// wolfSSL ↔ Chrome interop should also work.

let pc1 = null;  // Offerer
let pc2 = null;  // Answerer
let dc1 = null;
let dc2 = null;

async function startTest() {
  document.getElementById('btnStart').disabled = true;
  clearLog();
  log('=== Starting Self-Loopback DTLS-SRTP Test ===', 'info');
  log('Test goal: prove Chrome implements RFC 5764 (DTLS-SRTP)', 'info');
  log('Combined with wolfSSL ↔ wolfSSL test, this verifies both implementations are RFC-compliant', 'info');
  log('', 'info');

  try {
    // Create two PeerConnections
    log('Creating RTCPeerConnection #1 (offerer)...', 'info');
    pc1 = new RTCPeerConnection({ iceServers: [] });
    pc1.onicecandidate = (e) => {
      if (e.candidate) {
        log('  [PC1] ICE candidate generated', 'info');
        pc2.addIceCandidate(e.candidate).catch(err => 
          log('  [PC1] addIceCandidate failed: ' + err.message, 'err'));
      }
    };
    pc1.onconnectionstatechange = () => {
      log('  [PC1] Connection state: ' + pc1.connectionState, 
          pc1.connectionState === 'connected' ? 'ok' : 'info');
      if (pc1.connectionState === 'connected' || pc1.connectionState === 'complete') {
        onConnected();
      }
    };
    pc1.oniceconnectionstatechange = () => {
      log('  [PC1] ICE state: ' + pc1.iceConnectionState,
          pc1.iceConnectionState === 'connected' ? 'ok' : 'info');
    };

    log('Creating RTCPeerConnection #2 (answerer)...', 'info');
    pc2 = new RTCPeerConnection({ iceServers: [] });
    pc2.onicecandidate = (e) => {
      if (e.candidate) {
        log('  [PC2] ICE candidate generated', 'info');
        pc1.addIceCandidate(e.candidate).catch(err => 
          log('  [PC2] addIceCandidate failed: ' + err.message, 'err'));
      }
    };
    pc2.ondatachannel = (e) => {
      log('  [PC2] DataChannel received: ' + e.channel.label, 'ok');
      dc2 = e.channel;
      setupDC2(dc2);
    };
    pc2.onconnectionstatechange = () => {
      log('  [PC2] Connection state: ' + pc2.connectionState,
          pc2.connectionState === 'connected' ? 'ok' : 'info');
    };
    pc2.oniceconnectionstatechange = () => {
      log('  [PC2] ICE state: ' + pc2.iceConnectionState,
          pc2.iceConnectionState === 'connected' ? 'ok' : 'info');
    };

    // Create DataChannel on PC1
    log('Creating DataChannel "test" on PC1...', 'info');
    dc1 = pc1.createDataChannel('test', { ordered: true });
    setupDC1(dc1);

    // Get local fingerprint from PC1
    log('', 'info');
    log('Generating SDP offers/answers...', 'info');
    const offer = await pc1.createOffer();
    await pc1.setLocalDescription(offer);
    log('  PC1 offer created', 'ok');

    // Set remote description on PC2
    await pc2.setRemoteDescription(offer);
    const answer = await pc2.createAnswer();
    await pc2.setLocalDescription(answer);
    log('  PC2 answer created', 'ok');

    // Set remote description on PC1
    await pc1.setRemoteDescription(answer);
    log('  SDP exchange complete', 'ok');

    // Wait for DTLS to complete
    setStatus('DTLS handshake in progress...', 'warn');
    log('', 'info');
    log('Waiting for DTLS handshake to complete...', 'warn');
    log('(Chrome will do DTLS-SRTP between PC1 and PC2)', 'info');

    // Periodic check
    let attempts = 0;
    const checkInterval = setInterval(async () => {
      attempts++;
      if (pc1 && pc2) {
        // Check certificate info from getStats
        try {
          const stats = await pc1.getStats();
          let found = false;
          stats.forEach(report => {
            if (report.type === 'certificate') {
              found = true;
              document.getElementById('chromeFp').textContent = 
                (report.fingerprintAlgorithm || 'sha-256') + ': ' + report.fingerprint;
              log('[CERT] Local fingerprint: ' + report.fingerprint, 'ok');
            }
            if (report.type === 'transport' && report.dtlsState) {
              log('[TRANSPORT] DTLS state: ' + report.dtlsState, 
                  report.dtlsState === 'connected' ? 'ok' : 'warn');
              if (report.dtlsCipher) {
                document.getElementById('cipher').textContent = report.dtlsCipher;
                log('[CIPHER] ' + report.dtlsCipher, 'ok');
              }
              if (report.srtpCipher) {
                document.getElementById('srtpProfile').textContent = report.srtpCipher;
                log('[SRTP] ' + report.srtpCipher, 'ok');
              }
            }
          });
        } catch (e) {
          // ignore
        }
      }

      // Stop after 10 seconds
      if (attempts >= 20) {
        clearInterval(checkInterval);
        log('Test complete', 'info');
        setStatus('Test complete - check log for details', 'info');
        document.getElementById('btnStart').disabled = false;
      }
    }, 500);

  } catch (e) {
    log('[ERROR] ' + e.message, 'err');
    setStatus('Test failed: ' + e.message, 'err');
    document.getElementById('btnStart').disabled = false;
  }
}

function onConnected() {
  log('', 'info');
  log('*** ★ ★ ★ DTLS-SRTP HANDSHAKE SUCCESSFUL ★ ★ ★ ***', 'ok');
  log('Chrome successfully negotiated DTLS-SRTP between PC1 and PC2', 'ok');
  log('This proves Chrome implements RFC 5764 (DTLS-SRTP) correctly', 'ok');
  setStatus('✓ DTLS-SRTP Handshake Complete!', 'ok');
  
  // Send test message
  if (dc1 && dc1.readyState === 'open') {
    dc1.send('Hello from PC1!');
    log('Sent test message via DataChannel', 'info');
  }
}

function setupDC1(channel) {
  channel.onopen = () => {
    log('  [DC1] ★ DataChannel OPENED ★', 'ok');
    channel.send('Hello from PC1 via DTLS-SRTP!');
    log('  [DC1] Sent test message', 'info');
  };
  channel.onmessage = (e) => {
    log('  [DC1] ★ Received: "' + e.data + '" ★', 'ok');
  };
  channel.onclose = () => log('  [DC1] Closed', 'warn');
  channel.onerror = (e) => log('  [DC1] Error: ' + JSON.stringify(e), 'err');
}

function setupDC2(channel) {
  channel.onopen = () => {
    log('  [DC2] ★ DataChannel OPENED ★', 'ok');
  };
  channel.onmessage = (e) => {
    log('  [DC2] ★ Received: "' + e.data + '" ★', 'ok');
    channel.send('Echo from PC2: ' + e.data);
    log('  [DC2] Echoed back', 'info');
  };
  channel.onclose = () => log('  [DC2] Closed', 'warn');
  channel.onerror = (e) => log('  [DC2] Error: ' + JSON.stringify(e), 'err');
}

// Initialize
log('Page loaded. Click "Start Self-Loopback Test" to begin.', 'info');
log('This test verifies Chrome\'s DTLS-SRTP (RFC 5764) implementation.', 'info');

// Auto-start after 2 seconds (for headless / programmatic testing)
setTimeout(() => {
  log('', 'info');
  log('(Auto-starting test in 2 seconds...)', 'warn');
  setTimeout(() => startTest(), 2000);
}, 500);
</script>
</body>
</html>
